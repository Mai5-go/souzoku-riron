1,"ref":"","items":[{"mk":"⑴","h":"確実な債務","ref":"法14①","st":0,"t":"控除すべき債務は、《確実と認められるもの》に限る。","lv":1},{"mk":"⑵","h":"公租公課","ref":"法14②、③、令3","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"被相続人の公租公課\n控除すべき公租公課の金額は、被相続人の死亡の際《納税義務が確定》しているものの金額のほか、被相続人の死亡後《相続税の納税義務者》が《納付》し、又は《徴収》されることとなった《被相続人に係る所得税》、《相続税》、《贈与税等》の税額とする。\nただし、《相続人》又は《包括受遺者の責任》で納付し、又は徴収されることとなった附帯税等の税額を含まないものとする。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"国外転出等","lv":2}]},{"mk":"⑵","h":"","ref":"","st":0,"t":"①の債務の確定している公租公課の金額には、《被相続人》が《所得税法に規定する国外転出時課税に係る納税猶予》の適用を受けていた場合におけるその《納税猶予分の所得税額》及び国外転出（贈与・相続）時課税に係る納税猶予の適用を受けていた場合におけるその《納税猶予分の所得税額》を含まない。ただし、その被相続人の《納付の義務を承継》した《相続人》又は《包括受遺者》が《納付することとなった》納税猶予分の所得税額等については、《この限りでない》。","lv":1}],"t":""},{"n":"〔3〕","h":"控除が認められない債務","st":1,"ref":"法13③","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《墓所》、《霊びょう》及び《祭具》並びにこれらに準ずるもの","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《宗教、慈善、学術》その他《公益を目的とする事業を行う者》で一定のものが相続又は遺贈により取得した財産でその《公益を目的とする事業の用》に供することが《確実なもの》（《公益信託》の《受託者》がその《信託財産》として取得したものを《除く》。）","lv":1}],"t":"次の財産の《取得》、《維持》又は《管理》のために生じた債務の金額は、《控除金額に算入しない》。\nただし、⑵の財産の価額を《課税価格に算入》した場合においては、この限りでない。"},{"n":"〔4〕","h":"特別寄与料","st":2,"ref":"法13④、21の15②","items":[],"t":"《特別寄与者》が支払を受けるべき《特別寄与料の額》がその《特別寄与者》の《課税価格に算入される場合》においては、その《特別寄与料を支払うべき相続人》が《相続又は遺贈により取得した財産》及び《相続時精算課税適用財産》については、《課税価格に算入すべき価額》は、《相続時精算課税に係る基礎控除額》を控除後の《これらの財産の価額から》その《特別寄与料の額》のうち《その者の負担に属する部分の金額》を控除した金額による。"}]},{"no":"3-8","chap":"課税価格","ttl":"小規模宅地等についての相続税の課税価格の計算の特例（特例対象宅地等の用語の意義を除く。）","sub":"","secs":[{"n":"〔1〕","h":"内容","st":2,"ref":"措法69の4①","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《特定事業用宅地等》、《特定居住用宅地等》及び《特定同族会社事業用宅地等》である小規模宅地等\n……《100分の20》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《貸付事業用宅地等》である小規模宅地等\n……《100分の50》\n（注1）　被相続人等とは、《被相続人》又は被相続人の《生計一親族》をいう。\n（注2）　居住の用は、居住の用に供することができない事由として一定の事由によ\nり相続開始の直前において《被相続人の居住の用》に供されていなかった場合（一定の用途に供されている場合を《除く》。）におけるその事由により《居住の用》\n《に供されなくなる直前》のその被相続人の居住の用を含む。","lv":1}],"t":"個人が相続又は遺贈により取得した財産のうちに、その《相続開始の直前》において、\n（注1）（注2）《被相続人等》の《事業》（《準事業を含む》。）《の用》又は《居住の用》に供されていた宅地等で《建物》又は《構築物》の敷地の用に供されているもの（《特定事業用宅地等》、《特定居住用宅地等》、《特定同族会社事業用宅地等》及び《貸付事業用宅地等》に限る。以下「《特例対象宅地等》」という。）がある場合には、その相続又は遺贈により財産を取得した者に係る《全ての特例対象宅地等》のうち、その《個人が取得》をした《特例対象宅地等又はその一部》でこの規定の適用を受けるものとして《選択をしたもの》（以下「《選択特例対象宅地等》」という。）については、《限度面積要件》を満たすその選択特例対象宅地等（以下「《小規模宅地等》」という。）に限り、《相続税の課税価格に算入すべき価額》は、その小規模宅地等の価額に次に掲げる割合を乗じて計算した金額とする。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"措法69の4⑦、⑧","items":[],"t":"この規定は、《税務署長がやむを得ない事情があると認める場合を除き》、相続税の《期限内申告書》（《期限後申告書》及び《修正申告書》を含む。）に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。"},{"n":"〔3〕","h":"限度面積要件","st":1,"ref":"措法69の4②","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"特定事業用宅地等又は特定同族会社事業用宅地等（以下「《特定事業用等宅地等》」という。）である選択特例対象宅地等\n……面積の合計が《400㎡以下》であること。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《特定居住用宅地等》である選択特例対象宅地等\n……面積の合計が《330㎡以下》であること。","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"《貸付事業用宅地等》である選択特例対象宅地等\n次の①、②及び③の面積の合計が《200㎡以下》であること。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《特定事業用等宅地等》である選択特例対象宅地等がある場合…《面積の合計×400分の200》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《特定居住用宅地等》である選択特例対象宅地等がある場合…《面積の合計×330分の200》","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"《貸付事業用宅地等》である選択特例対象宅地等…《面積の合計》","lv":2}]}],"t":"次の区分に応じ、それぞれに定める要件とする。"},{"n":"〔4〕","h":"未分割である場合","st":2,"ref":"措法69の4④","items":[{"mk":"⑴","h":"未分割の場合","ref":"","st":0,"t":"〔1〕の規定は、《申告期限まで》に共同相続人又は包括受遺者によって《分割されていない特例対象宅地等》については、《適用しない。》","lv":1},{"mk":"⑵","h":"分割された場合","ref":"","st":0,"t":"⑴の場合において、その《分割されていない特例対象宅地等》が《申告期限》から《3年以内》（その期間内にその特例対象宅地等が《分割されなかった》ことにつき、《やむを得ない事情》がある場合において、《納税地の所轄税務署長》の《承認》を受けたときは、その特例対象宅地等の分割が《できることとなった日》として定める日の翌日から《4月以内》）に分割された場合（《特定計画山林の特例》の規定の適用を受けている場合を除く。）には、その《分割された特例対象宅地等》については、この限りでない。","lv":1}],"t":""},{"n":"〔5〕","h":"選択適用","st":2,"ref":"措法69の4⑥","items":[],"t":"〔1〕の規定は、《個人の事業用資産の贈与税の納税猶予及び免除》の規定の適用を受けた《特例事業受贈者》に係る《贈与者》から《相続又は遺贈により取得》（《事業用資産の贈与者が死亡した場合の相続税の課税の特例の規定》により《相続又は遺贈》により《取得したものとみなされる場合》の《取得》を含む。）をした《特定事業用宅地等》及び《個人の事業用資産の相続税の納税猶予及び免除》の規定の適用を受ける《特例事業相続人等》に係る《被相続人》から《相続又は遺贈》により取得した《特定事業用宅地等》については、《適用しない》。"}]},{"no":"3-9","chap":"課税価格","ttl":"特例対象宅地等の用語の意義","sub":"","secs":[{"n":"〔1〕","h":"特定事業用宅地等","st":1,"ref":"措法69の4③一","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"その親族が、《相続開始時》から《申告期限まで》の間にその宅地等の上で営まれていた《被相続人の事業を引き継ぎ》、《申告期限まで》引き続きその《宅地等を有し》、かつ、その《事業を営んでいる》こと。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"被相続人の《生計一親族》が、相続開始時から《申告期限》（その親族が《申告期限前に死亡》した場合には、《その死亡の日》。〔4〕⑴を除き、以下同じ。）《まで》引き続きその《宅地等を有し》、かつ、《相続開始前》から《申告期限まで》引き続きその宅地等を《自己の事業の用に供している》こと。\n（注1）　被相続人等とは、《被相続人又は被相続人の生計一親族》をいう。\n（注2）　被相続人等の事業には、《準事業》を含む。","lv":1}],"t":"（注1、2）《被相続人等の事業》（《不動産貸付業等》を除く。以下《〔1〕及び〔3〕》において同じ。）《の用》に供されていた宅地等で、次のいずれかを満たすその《被相続人の親族》（その《親族》から《相続又は遺贈》によりその宅地等を取得したその《親族の相続人》を含む。⑴及び〔4〕（《⑵を除く》。）において同じ。）が《相続又は遺贈により取得》したもの（《相続開始前3年以内》に《新たに事業の用に供された宅地等》（《一定の規模以上》の事業を行っていた被相続人等の《その事業の用に供されたもの》を除く。）を《除く》。）をいう。"},{"n":"〔2〕","h":"特定居住用宅地等","st":1,"ref":"措法69の4③二、措令40の2⑭","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"その親族が《相続開始の直前》においてその宅地等の上に存する《被相続人》の居住の用に供されていた《一棟の建物》（その《被相続人》、《その配偶者》又は《その親族》の居住の用に供されていた部分として一定の部分に《限る》。）《に居住》していた者であって、《相続開始時》から《申告期限まで》引き続きその《宅地等を有し》、かつ、その《建物に居住している》こと。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"その親族（《被相続人の居住の用に供されていた》宅地等を取得した者に《限る》。）が次に掲げる要件の《全てを満たすこと》（その被相続人の《配偶者》又は《相続開始の直前》においてその《被相続人の居住の用》に供されていた《家屋》に居住していた《親族》で《法定相続人に該当する者がいない場合》に限る。）。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《相続開始前3年以内》に《法施行地》にあるその《親族》、《その親族の配偶者》、《その親族の三親等内の親族》又はその《親族と特別の関係がある法人が所有する家屋》（《相続開始の直前》においてその《被相続人の居住の用に供されていた家屋》を除く。）に《居住したことがない》こと。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《相続開始時》にその《親族が居住している家屋》を《相続開始前》の《いずれの時》においても《所有》していたことが《ないこと》。","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"《相続開始時》から《申告期限》まで引き続きその宅地等を《有している》こと。","lv":2}]},{"mk":"⑶","h":"","ref":"","st":0,"t":"被相続人の《生計一親族》が、《相続開始時》から《申告期限まで》引き続きその《宅地等を有\u0007し》、かつ、《相続開始前》から《申告期限まで》引き続きその宅地等を《自己の居住の用に供している》こと。","lv":1}],"t":"《被相続人等の居住の用》に供されていた宅地等（その《宅地等が2以上ある》場合には、一定の宅地等に限る。）で、その被相続人の《配偶者》又は次のいずれかを満たすその《被相続人の親族》（その《被相続人の配偶者》を除く。以下《〔2〕において》同じ。）が相続又は遺贈により取得したものをいう。"},{"n":"〔3〕","h":"特定同族会社事業用宅地等","st":1,"ref":"措法69の4③三、措規23の2⑤","items":[],"t":"（注）《特定同族会社の事業の用》に供されていた宅地等で、その宅地等を相続又は遺贈により取得した被相続人の親族（申告期限においてその法人の《役員》である者に限る。）が相続開始時から申告期限まで引き続き《有し》、かつ、《申告期限まで》引き続きその《法人の事業の用に供されている》ものをいう。\n（注）　特定同族会社とは、相続開始の《直前》の《被相続人》及び《同族関係者》の議決権割合が《50％超の法人》をいう。"},{"n":"〔4〕","h":"貸付事業用宅地等","st":1,"ref":"措法69の4③四、措令40の2⑲","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"その親族が、《相続開始時》から《申告期限まで》の間にその宅地等に係る《被相続人の貸付事業を引き継ぎ》、《申告期限まで》引き続きその《宅地等を有し》、かつ、その《貸付事業の用に供している》こと。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"被相続人の《生計一親族》が、相続開始時から申告期限まで引き続きその《宅地等を有し》、かつ、《相続開始前》から《申告期限まで》引き続きその宅地等を《自己の貸付事業の用に供している》こと。","lv":1}],"t":"《被相続人等の事業》（《不動産貸付業等》に限る。以下「貸付事業」という。）《の用》に供されていた宅地等で、次の《いずれかを満たす》その被相続人の《親族》が相続又は遺贈により取得したもの（〔3〕及び《相続開始前3年以内》に《新たに貸付事業の用》に供された宅地等（《相続開始の日》まで《3年を超えて》引き続き《特定貸付事業》を行っていた被相続人等のその《貸付事業の用に供されたもの》を除く。）を《除く》。）をいう。"}]},{"no":"3-10","chap":"課税価格","ttl":"特定計画山林についての相続税の課税価格の計算の特例","sub":"","secs":[{"n":"〔1〕","h":"内容","st":2,"ref":"措法69の5①","items":[],"t":"《特定計画山林相続人等》が、相続又は遺贈（被相続人からの《相続時精算課税に係る贈与を含む》。）により取得した《特定計画山林》でこの規定の適用を受けるものとして選択をしたもの（以下「《選択特定計画山林》」という。）について、相続開始時から申告期限（特定計画山林相続人等が《申告期限前に死亡》した場合には、その死亡の日。）まで引き続きその選択特定計画山林の《全てを有している》場合等には、《相続税の課税価格》（《相続時精算課税適用財産》の価額を加算した後の相続税の課税価格）《に算入すべき価額》は、その《選択特定計画山林》の価額（《相続時精算課税》の適用を受けるものである場合には、《相続時精算課税に係る基礎控除額》を控除した《残額》）に《100分の95》を乗じて計算した金額とする。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"措法69の5⑦、⑪","items":[],"t":"この規定は、《税務署長がやむを得ない事情があると認める場合を除き》、相続税の《期限内申告書》（《期限後申告書》及び《修正申告書》を含む。）に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。"},{"n":"〔3〕","h":"未分割である場合","st":2,"ref":"措法69の5③","items":[{"mk":"⑴","h":"未分割の場合","ref":"","st":0,"t":"〔1〕の規定は、《申告期限まで》に共同相続人又は包括受遺者によって《分割されていない特定計画山林》については、《適用しない。》","lv":1},{"mk":"⑵","h":"分割された場合","ref":"","st":0,"t":"⑴の場合において、その《分割されていない特定計画山林》が《申告期限》から《3年以内》（その期間内にその《特定計画山林が分割されなかった》ことにつき、《やむを得ない事情》がある場合において、《納税地の所轄税務署長》の《承認》を受けたときは、その特定計画山林の分割が《できることとなった日》として定める日の翌日から《4月以内》）に分割された場合には、その《分割された特定計画山林》については、この限りでない。","lv":1}],"t":""},{"n":"〔4〕","h":"その他の書類の提出","st":1,"ref":"措法69の5⑧、⑨、⑩、⑪","items":[{"mk":"⑴","h":"贈与時","ref":"","st":0,"t":"《特定受贈森林経営計画対象山林》について〔1〕の規定の適用を受けようとする《特定計画山林相続人等》は、《贈与税の期限内申告書の提出期間内》に〔1〕の規定の適用を受ける旨等を記載した《書類》を納税地の所轄税務署長に提出しなければ〔1〕の規定の適用を受けることができない。","lv":1},{"mk":"⑵","h":"相続時","ref":"","st":0,"t":"〔1〕の規定は、〔2〕の規定にかかわらず、《税務署長がやむを得ない事情があると認める場合を除き》、特定計画山林について〔1〕の規定の適用を受けようとする者の《申告期限》から《2月以内》に森林経営計画に基づき施業が行われていた旨等を証する《書類》の提出がない場合には、《適用しない》。","lv":1}],"t":""},{"n":"〔5〕","h":"選択適用等","st":1,"ref":"措法69の5④、⑤","items":[{"mk":"⑴","h":"原　　則","ref":"","st":0,"t":"〔1〕の規定は、被相続人から相続又は遺贈により財産を取得した者が《小規模宅地等の特例》の適用を受けている場合には、《適用しない》。","lv":1},{"mk":"⑵","h":"例　　外","ref":"","st":0,"t":"《選択宅地等面積》（小規模宅地等として選択された宅地等の面積で一定の調整をしたものの合計をいう。）が《200㎡未満》である場合には、⑴の規定にかかわらず、《次に定める価額に達するまで》の部分について、〔1〕の規定の適用を《受けることができる》。\n%%《特定計画山林の価額》×|《200㎡》－《選択宅地等面積》|《200㎡》","lv":1}],"t":""}]},{"no":"3-11","chap":"課税価格","ttl":"相続税法に定める財産評価","sub":"","secs":[{"n":"〔1〕","h":"評価の原則","st":2,"ref":"法22","items":[],"t":"特別の定めのあるものを除くほか、相続、遺贈又は贈与により取得した《財産の価額》は、その《財産の取得の時における時価》により、その財産の価額から《控除すべき債務の金額》は、《その時の現況》による。"},{"n":"〔2〕","h":"地上権及び永小作権の評価","st":0,"ref":"法23","items":[],"t":"地上権及び永小作権の価額は、その《残存期間》に応じ、その権利を取得した時における権利が設定されていない場合の土地の時価に、一定の《割合》を乗じて計算した金額による。"},{"n":"〔3〕","h":"定期金に関する権利の評価","st":0,"ref":"法24","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"定期金給付契約でその契約に関する権利を取得した時において《定期金給付事由が発生しているもの》に関する権利の価額は、次の区分に応じ、それぞれに定める金額による。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"有期定期金…次に掲げる金額のうちいずれか《多い金額》","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《解約返戻金》の額","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"定期金に代えて一時金の給付を受けることができる場合にはその《一時金の額》\n給付を受けるべき金額《残存期間》に応ずる《予定利率》","lv":3},{"mk":"ハ","h":"","ref":"","st":0,"t":"×\nの《1年当たりの平均額》による《複利年金現価率》","lv":3}]},{"mk":"②","h":"","ref":"","st":0,"t":"無期定期金…次に掲げる金額のうちいずれか《多い金額》","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《解約返戻金》の額","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"定期金に代えて一時金の給付を受けることができる場合にはその《一時金の額》\n%%ハ　|給付を受けるべき金額の《1年当たりの平均額》|《予定利率》","lv":3}]},{"mk":"③","h":"","ref":"","st":0,"t":"終身定期金…次に掲げる金額のうちいずれか《多い金額》","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《解約返戻金》の額","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"定期金に代えて一時金の給付を受けることができる場合にはその《一時金の額》\n給付を受けるべき金額《受取人の平均余命》に応ずる《》","lv":3},{"mk":"ハ","h":"","ref":"","st":0,"t":"×\nの《1年当たりの平均額予定利率》による《複利年金現価率》","lv":3}]},{"mk":"④","h":"","ref":"","st":0,"t":"一時金…その《給付金額》","lv":2}]},{"mk":"⑵","h":"","ref":"","st":0,"t":"⑴に規定する定期金給付契約に関する権利で、その権利者に対し、《一定期間》、かつ、その目的とされた者の《生存中》、定期金を給付する契約に基づくものの価額は、⑴①の金額と⑴③の金額のいずれか《少ない金額》による。","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"⑴に規定する定期金給付契約に関する権利で、その目的とされた者の生存中定期金を給付し、かつ、その者が死亡したときは《その者の遺族等に対し継続して定期金を給付》する契約に基づくものの価額は、⑴①の金額と⑴③の金額のいずれか《多い金額》による。","lv":1},{"mk":"⑷","h":"","ref":"","st":0,"t":"⑴〜⑶の規定は、《契約に基づかない定期金》に関する権利の価額の評価について準用する。","lv":1}],"t":""},{"n":"〔4〕","h":"定期金給付事由が発生していない定期金に関する権利の評価","st":0,"ref":"法25","items":[{"mk":"⑴","h":"解約返戻金を支払う旨の定めがない場合","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"保険料等が一時に払い込まれた場合\n（注）《掛金等》の金額×《経過期間》に応ずる《予定利率》による《複利終価率》×《100分の90》\n（注）　《経過期間》とは掛金等の払込開始の時から権利を取得した時までの期間をいう。以下同じ。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"①以外の場合\n《経過期間》に払い込まれた《掛金等経過期間》に応ずる《予定利率90》\n××\n《の金額》の《1年当たりの平均額100》\nによる《複利年金終価率》","lv":2}]},{"mk":"⑵","h":"⑴以外の場合","ref":"","st":0,"t":"《解約返戻金》の額","lv":1}],"t":"《定期金給付契約》（《生命保険契約》を除く。）でその契約に関する権利を取得した時において定期金給付事由が発生していないものに関する権利の価額は、次の区分に応じ、それぞれに定める金額による。"},{"n":"〔5〕","h":"立木の評価","st":2,"ref":"法26","items":[],"t":"相続又は遺贈（《包括遺贈》及び被相続人からの《相続人に対する遺贈》に限る。）により取得した立木の価額は、その立木を《取得した時》における《立木の時価》に《100分の85》の割合を乗じた金額とする。"}]},{"no":"3-12","chap":"課税価格","ttl":"配偶者居住権等の評価","sub":"","secs":[{"n":"〔1〕","h":"配偶者居住権等の評価","st":0,"ref":"法23の2、令5の7②、③","items":[{"mk":"⑴","h":"配偶者居住権の価額","ref":"","st":2,"t":"《①－①×②－③分の②－③－④×⑤》\n（注1）　上記算式中の《分母》又は《分子》が《零以下》である場合は、《零》。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《配偶者居住権》の目的となっている《建物の相続開始時》の《時価》\n（注2）","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《配偶者居住権設定時》の《建物》の《耐用年数》\n（注2）　《配偶者居住権》の目的となっている《建物》の《耐用年数》に《1≥5を乗じて計算》し\nた《年数》（《6月以上》切上、《6月未満》切捨）","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"《配偶者居住権設定時》のその建物の《建築後》の《経過年数》（《6月以上》切上、《6月未満》切捨）\n（注3）","lv":2},{"mk":"④","h":"","ref":"","st":0,"t":"《配偶者居住権》の《存続年数》（《6月以上》切上、《6月未満》切捨）\n（注3）　次の場合の区分に応じた《年数》","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《存続期間》が《配偶者》の《終身の間》とされている場合《配偶者居住権設定時》の《配偶者》の《平均余命》","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"《イ以外》の場合　《配偶者居住権設定時》の《配偶者》の《平均余命》又は《遺産分割協議等》により《設》\n《定した年数》の《短い方》","lv":3}]},{"mk":"⑤","h":"","ref":"","st":0,"t":"《④》に応じた《法定利率》による《複利現価率》","lv":2}]},{"mk":"⑵","h":"建物所有権の価額","ref":"","st":2,"t":"《配偶者居住権》の目的となっている《建物の価額》は、次による。\nその《建物》の《相続開始時》の《時価》－《⑴》","lv":1},{"mk":"⑶","h":"敷地利用権の価額","ref":"","st":2,"t":"《配偶者居住権》の目的となっている《建物の敷地》の用に供される《土地等》を《使用する権利の価額》は、次による。\n《土地等》の《相続土地等》の《相続》\n－×《⑴⑤》\n《開始時》の《時価開始時》の《時価》","lv":1},{"mk":"⑷","h":"敷地所有権の価額","ref":"","st":2,"t":"《配偶者居住権》の目的となっている《建物の敷地》の用に供される《土地等の価額》は、次による。\n《土地等》の《相続開始時》の《時価》－《⑶》","lv":1},{"mk":"⑸","h":"一部賃貸又は共有の場合","ref":"","st":1,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"建物の時価","lv":2}]},{"mk":"⑴","h":"","ref":"","st":0,"t":"①の建物の時価は、その建物の《一部が賃貸》の用に供されている場合又は被相続人がその《相続開始の直前》においてその《建物》をその《配偶者と共有》していた場合には、その建物のうちその《賃貸の用に供されていない部分》又はその被相続人の《持分割合》に《応ずる部分》の価額として一定の金額とする。","lv":1,"items":[{"mk":"②","h":"","ref":"","st":0,"t":"土地等の時価\n⑶の土地等の時価は、その建物の《一部が賃貸》の用に供されている場合又は被相続人がその《相続開始の直前》においてその《土地等》を《他の者と共有》し、若しくはその《建物》をその《配偶者と共有》していた場合には、その建物のうちその《賃貸の用に供されていない部分》に応ずる部分又はその被相続人の《持分割合》に《応ずる部分》の価額として一定の金額とする。","lv":2}]}],"t":""},{"n":"〔2〕","h":"小規模宅地等の特例との関係","st":2,"ref":"措令40の2⑥","items":[],"t":"小規模宅地等の特例の規定の適用を受けるものとしてその《全部又は一部》の《選択》をしようとする《特例対象宅地等》が、《配偶者居住権》の目的となっている《建物》の《敷地の用》に供される《宅地等》又はその《宅地等》を《配偶者居住権》に基づき《使用する権利》の《全部又は一部》である場合には、その《特例対象宅地等》の《面積》は次の算式により計算した《面積》であるものと《みなして》、小規模宅地等の特例の規定を適用する。\n%%その《宅地等》の《面積》×|その《敷地の用に供される宅地等》の価額《又は》その《権利》の価額|その《敷地の用に供される宅地等》の価額《＋》その《権利》の価額"}]},{"no":"3-13","chap":"課税価格","ttl":"未分割遺産に対する相続税の取扱い","sub":"","secs":[{"n":"〔1〕","h":"遺産が未分割である場合","st":2,"ref":"","items":[{"mk":"⑴","h":"未分割遺産に対する課税","ref":"法55","st":0,"t":"《相続》若しくは《包括遺贈》により取得した財産に係る相続税について《申告書を提出する》場合又は《更正若しくは決定をする》場合において、その取得した財産の《全部又は一部》が《共同相続人又は包括受遺者》によってまだ《分割されていないとき》は、その《分割されていない財産については》、《各共同相続人又は包括受遺者》が《民法》（《寄与分》を除く。）の規定による《相続分又は包括遺贈の割合》に従ってその財産を取得したものとしてその《課税価格を計算》する。","lv":1},{"mk":"⑵","h":"配偶者の税額軽減","ref":"法19の2②","st":0,"t":"《申告期限まで》に相続又は遺贈により取得した財産の《全部又は一部》が《共同相続人又は包括受遺者》によってまだ《分割されていない》場合においては、《分割されていない財産については》、配偶者の《課税価格相当額の計算の基礎》とされる《財産に含まれない》ものとする。","lv":1},{"mk":"⑶","h":"小規模宅地等の特例","ref":"措法69の4④","st":0,"t":"小規模宅地等の特例は、《申告期限まで》に《共同相続人又は包括受遺者》によって《分割されていない特例対象宅地等》については、《適用しない》。","lv":1},{"mk":"⑷","h":"特定計画山林の特例","ref":"措法69の5③","st":0,"t":"特定計画山林の特例は、《申告期限まで》に《共同相続人又は包括受遺者》によって《分割されていない特定計画山林》については、《適用しない》。","lv":1},{"mk":"⑸","h":"相続税の納税猶予及び免除","ref":"","st":0,"t":"次の規定については、その適用の対象となる財産が《申告期限まで》に《分割されていない場合》には、《適用しない》。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《農地等の相続税の納税猶予及び免除》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《個人の事業用資産の相続税の納税猶予及び免除》","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"《山林の相続税の納税猶予及び免除》","lv":2},{"mk":"④","h":"","ref":"","st":0,"t":"《非上場株式等の相続税の納税猶予及び免除》","lv":2},{"mk":"⑤","h":"","ref":"","st":0,"t":"《非上場株式等の相続税の納税猶予及び免除の特例》","lv":2},{"mk":"⑥","h":"","ref":"","st":0,"t":"《医療法人の持分の相続税の納税猶予及び免除》","lv":2},{"mk":"⑦","h":"","ref":"","st":0,"t":"《特定の美術品の相続税の納税猶予及び免除》","lv":2}]}],"t":""},{"n":"〔2〕","h":"未分割遺産が分割された場合","st":2,"ref":"","items":[{"mk":"⑴","h":"未分割遺産に対する課税","ref":"法55但書","st":0,"t":"〔1〕⑴の場合において、《その後においてその財産の分割があり》、その共同相続人又は包括受遺者がその《分割により取得した財産》に係る《課税価格》が、その《相続分又は包括遺贈の割合》に従って計算された《課税価格》と《異なること》となった場合においては、その《分割により取得した財産に係る課税価格を基礎》として、《納税義務者》において《申告書を提出》し、若しくは《更正の請求》をし、又は《税務署長》において《更正》若しくは《決定》をすることを妨げない。","lv":1},{"mk":"⑵","h":"配偶者の税額軽減","ref":"法19の2②但書","st":0,"t":"〔1〕⑵の場合において、その《分割されていない財産》が《申告期限》から《3年以内》（その期間内にその財産が分割されなかったことにつき、《やむを得ない事情》がある場合において、《納税地の所轄税務署長》の《承認》を受けたときは、その財産の《分割ができることとなった日》として定める日の翌日から《4月以内》。以下同じ。）に分割された場合には、その分割された財産については、この限りでない。","lv":1},{"mk":"⑶","h":"小規模宅地等の特例","ref":"措法69の4④但書","st":0,"t":"〔1〕⑶の場合において、その《分割されていない特例対象宅地等》が《申告期限》から《3年以内》に分割された場合（《特定計画山林の特例》の規定の適用を受けている場合を除く。）には、その《分割された特例対象宅地等》については、この限りでない。","lv":1},{"mk":"⑷","h":"特定計画山林の特例","ref":"措法69の5③但書","st":0,"t":"〔1〕⑷の場合において、その《分割されていない特定計画山林》が《申告期限》から《3年以内》に分割された場合には、その《分割された特定計画山林》については、この限りでない。","lv":1},{"mk":"⑸","h":"手続規定","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"法32①、措法69の4⑤、69の5⑥","st":0,"t":"更正の請求\n《相続税》について《申告書》を提出した者又は《決定》を受けた者は、次の事由によりその《申告》又は《決定》に係る《課税価格》及び《相続税額》が《過大となったとき》は、その事由が生じたことを知った日の翌日から《4月以内》に限り、《納税地の所轄税務署長》に《更正の請求》を《することができる》。","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《〔1〕⑴》の規定により《分割されていない財産》について《民法》（《寄与分を除く。》）の規定による《相続分又は包括遺贈の割合》に従って《課税価格》が計算されていた場合において、その後その財産の《分割が行われ》、《共同相続人又は包括受遺者》がその《分割により取得した財産》に係る《課税価格》がその《相続分又は包括遺贈の割合》に従って計算された《課税価格》と《異なること》となったこと。","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"⑵により、その《分割が行われた時以後》において《配偶者の税額軽減》の規定を適用して計算した《相続税額》が、《その時前》において《配偶者の税額軽減》の規定を適用して計算した《相続税額》と《異なること》となったこと（《イの場合》を除く。）。","lv":3},{"mk":"ハ","h":"","ref":"","st":0,"t":"⑶により、その《分割が行われた時以後》において《小規模宅地等の特例》の規定を適用して計算した《相続税額》が、《その時前》において《小規模宅地等の特例》の規定を適用して計算した《相続税額》と《異なること》となったこと（《イの場合》を除く。）。","lv":3},{"mk":"ニ","h":"","ref":"","st":0,"t":"⑷により、その《分割が行われた時以後》において《特定計画山林の特例》の規定を適用して計算した《相続税額》が、《その時前》において《特定計画山林の特例》の規定を適用して計算した《相続税額》と《異なること》となったこと（《イの場合》を除く。）。","lv":3}]},{"mk":"②","h":"","ref":"法30①","st":0,"t":"期限後申告\n相続税の《期限内申告書》の提出期限《後》において①イの事由が生じたため《新たに期限内申告書を提出すべき要件》に該当することとなった者は、《期限後申告書》を《提出することができる》。","lv":2},{"mk":"③","h":"","ref":"法31①","st":0,"t":"修正申告\n《期限内申告書》又は《期限後申告書》を提出した者（相続税について《決定》を受けた者を含む｡）は、①イの事由が生じたため《既に確定した相続税額に不足を生じた》場合には、《修正申告書》を《提出することができる》。","lv":2}]}],"t":""}]},{"no":"4-1","chap":"税額計算","ttl":"相続税の総額、遺産に係る基礎控除、法定相続人の数及び各相続人等の算出相続税額","sub":"","secs":[{"n":"〔1〕","h":"相続税の総額","st":2,"ref":"法16","items":[],"t":"相続税の総額は、《同一の被相続人》から相続又は遺贈により財産を取得した《全ての者》に係る《相続税の課税価格》（《生前贈与加算》及び《相続時精算課税適用財産》の価額を加算した後の《相続税の課税価格とみなされた金額》。以下同じ。）の合計額から《遺産に係る基礎控除額》を控除した《残額》をその被相続人の《法定相続人の数に応じた法定相続人》が《法定相続分》、《代襲相続分》に応じて取得したものとした場合における《各取得金額》につきそれぞれ《超過累進税率を乗じて計算》した金額を《合計した金額》とする。"},{"n":"〔2〕","h":"遺産に係る基礎控除","st":2,"ref":"法15①","items":[],"t":"相続税の総額を計算する場合においては、《同一の被相続人》から相続又は遺贈により財産を取得した全ての者に係る《相続税の課税価格の合計額》から、次の算式により計算した金額を控除する。\n《3000万円》＋《600万円×法定相続人の数》"},{"n":"〔3〕","h":"法定相続人の数","st":2,"ref":"法15②、③、63","items":[{"mk":"⑴","h":"内　　容","ref":"","st":0,"t":"法定相続人の数は、《被相続人の法定相続人の数》（その被相続人に養子がある場合の法定相続人の数に算入する養子の数は、《次の養子の数に限る》ものとし、相続の放棄があった場合には、《その放棄がなかったものとした場合における相続人》の数）とする。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"その被相続人に《実子がある場合》又はその被相続人に《実子がなく》、《養子の数が1人》である場合…《1人》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"その被相続人に《実子がなく》、《養子の数が2人以上》である場合…《2人》","lv":2}]},{"mk":"⑵","h":"実子とみなされる者","ref":"","st":0,"t":"⑴の規定の適用については、《次の者は実子とみなす》。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"民法に規定する《特別養子縁組》による養子となった者、被相続人の《配偶者の実子》でその被相続人の養子となった者等","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《実子》若しくは《養子》又は《その直系卑属》が《相続開始以前に死亡》し、又は《相続権を失った》ため《法定相続人》となった《その者の直系卑属》","lv":2}]},{"mk":"⑶","h":"養子の数の否認","ref":"","st":0,"t":"⑴に定める《養子の数》を法定相続人の数に算入することが《相続税の負担を不当に減少させる結果》となると認められる場合においては、《税務署長》は、相続税の《更正又は決定》に際し、《税務署長の認めるところにより》、その養子の数を《法定相続人の数》に《算入しないで》相続税の《課税価格及び相続税額》を計算することができる。","lv":1}],"t":""},{"n":"〔4〕","h":"各相続人等の算出相続税額","st":1,"ref":"法17","items":[],"t":"各相続人等の算出相続税額は次の算式により計算した金額とする。\n%%相続税の総額×|その者の相続税の課税価格|相続税の課税価格の合計額"}]},{"no":"4-2","chap":"税額計算","ttl":"相続税額の加算の制度","sub":"","secs":[{"n":"〔1〕","h":"相続税額の加算","st":2,"ref":"法18、21の15②、21の16②","items":[],"t":"（注）《相続又は遺贈》により財産を取得した者が被相続人の《一親等の血族》（その被相続人の《直系卑属である代襲相続人》を含む。以下同じ。）《及び配偶者以外》の者である場合においては、その者に係る相続税額は、その者の《算出相続税額》に《その100分の20》に相当する金額を《加算》した金額とする。ただし、《相続時精算課税に係る贈与》により《財産を取得した時》においてその被相続人の《一親等の血族》であった場合には、その財産に《対応する相続税額》については、《この限りでない》。\n（注）　《一親等の血族》には、《被相続人の直系卑属》がその《被相続人の養子》となっている場合を《含まない》ものとする。ただし、その被相続人の《直系卑属》がその被相続人の《代襲相続人》となっている場合は、この限りでない。"}]},{"no":"4-3","chap":"税額計算","ttl":"相続開始前7年以内に被相続人から贈与があった場合（相続時精算課税を除く。）","sub":"","secs":[{"n":"〔1〕","h":"生前贈与加算","st":2,"ref":"法19①","items":[],"t":"《相続又は遺贈により財産を取得した者》が《相続開始前7年以内》に被相続人から《贈与》により財産を取得したことがある場合においては、その者については、その贈与により取得した財産（その《取得の日の属する年分》の《贈与税の課税価格計算の基礎に算入されるもの》に限り、《特定贈与財産》及び《相続時精算課税適用財産》を除く。以下「《加算対象贈与財産》」という。）の価額（《加算対象贈与財産》のうちその《相続開始前3年以内》に《取得した財産以外》の財産にあっては、その財産の価額の合計額から《100万円を控除した残額》）を相続税の《課税価格に加算》した価額を《相続税の課税価格とみなす》。"},{"n":"〔2〕","h":"贈与税額控除","st":2,"ref":"法19①、令4①、基通19－7","items":[],"t":"〔1〕の場合において、《加算対象贈与財産》の取得につき《課せられた贈与税》があるときは、《算出相続税額》（《相続税額の加算まで》の規定適用後の金額）から次の控除額を控除した金額をもってその《納付すべき相続税額》とする。\nＡ×Ｂ分のＣ\nＡ…その取得の日の属する年分の《贈与税額》（《贈与税の外国税額控除前》の税額とし、《附帯》\n《税》を除く。）\nＢ…その年分の《贈与税の課税価格に算入》された財産の価額の合計額\nＣ…〔1〕の規定により《相続税の課税価格に加算》された金額（《100万円控除前》の価額）"},{"n":"〔3〕","h":"特定贈与財産の意義","st":2,"ref":"法19②、令4②","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"その贈与が《相続開始の年の前年以前》にされた場合で、その被相続人の配偶者がその贈与による取得の日の属する年分の贈与税につき《贈与税の配偶者控除》の規定の《適用を受けている》とき\n……《贈与税の配偶者控除》の規定により《控除された金額》に相当する部分","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"その贈与が《相続開始の年》にされた場合で、その被相続人の配偶者がその被相続人からの贈与につき《贈与税の配偶者控除》の規定の《適用を受けたことがない》とき\n……《贈与税の配偶者控除》の規定の《適用があるとした場合》に、《控除される金額》に相\n当する部分","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"①の規定は、被相続人の《配偶者》が、相続税の《期限内申告書》（《期限後申告書》及び《修正申告書》を含む。）又は《更正請求書》に《特定贈与財産の価額》を《贈与税の課税価格に算入する旨》等の一定の事項を記載し、かつ、一定の書類を添付してこれを提出した場合に限り、適用する。","lv":2}]}],"t":"特定贈与財産とは、《贈与税の配偶者控除》に規定する《婚姻期間20年以上》の《配偶者》に該当する被相続人からの贈与によりその《被相続人の配偶者》が取得した《居住用不動産》又は《金銭》でそれぞれ次に定める部分をいい、その特定贈与財産は相続税の計算上《生前贈与加算》されない。"},{"n":"〔4〕","h":"経過措置","st":1,"ref":"法附則19②","items":[],"t":"《令和6年1月1日》から《令和8年12月31日》までの間に《開始した相続》については、《〔1〕の7年》とあるのは、《3年》とする。"}]},{"no":"4-4","chap":"税額計算","ttl":"配偶者の相続税額の軽減","sub":"","secs":[{"n":"〔1〕","h":"内容","st":2,"ref":"法19の2①","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《算出相続税額》（《贈与税額控除まで》の規定適用後の金額）\n%%⑵　|相続税の総額×（注）|相続税の課税価格の合計額\n※　相続税の課税価格は、《生前贈与加算》及び《相続時精算課税適用財産》の価額を《加算》した後の《相続税の課税価格とみなされた金額》。以下同じ。\n（注）\n（注）①　相続税の課税価格の合計額×《配偶者の法定相続分1億6≤000万円》∴《多い》金額\n（注）　《配偶者の法定相続分》は、《相続の放棄》があった場合には、その《放棄がなかったもの》とした場合における《相続分》","lv":1,"items":[{"mk":"②","h":"","ref":"","st":0,"t":"《配偶者の課税価格相当額》","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"①②　　∴《少ない》金額","lv":2}]}],"t":"《被相続人の配偶者》がその被相続人からの《相続又は遺贈》により財産を取得した場合には、その配偶者については、次の⑴の金額から⑵の金額を控除した《残額があるとき》は、その残額をもってその《納付すべき相続税額》とし、次の⑴の金額が⑵の金額《以下であるとき》は、その《納付すべき相続税額》は《ないもの》とする。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"法19の2③、④","items":[],"t":"この規定は、《税務署長がやむを得ない事情があると認める場合を除き》、相続税の《期限内申告書》（《期限後申告書》及び《修正申告書》を含む。以下同じ。）又は《更正請求書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、《適用する》。"},{"n":"〔3〕","h":"未分割である場合","st":2,"ref":"法19の2②","items":[{"mk":"⑴","h":"未分割の場合","ref":"","st":0,"t":"〔1〕において、《申告期限まで》に相続又は遺贈により取得した財産の《全部又は一部》が《共同相続人又は包括受遺者》によってまだ《分割されていない》場合においては、《分割されていない財産については》、〔1〕⑵②の《課税価格の計算の基礎》とされる《財産に含まれない》ものとする。","lv":1},{"mk":"⑵","h":"分割された場合","ref":"","st":0,"t":"⑴の場合において、その《分割されていない財産》が《申告期限》から《3年以内》（その期間内にその財産が分割されなかったことにつき、《やむを得ない事情》がある場合において、《納税地の所轄税務署長》の《承認》を受けたときは、その財産の《分割ができることとなった日》として定める日の翌日から《4月以内》）に分割された場合には、その分割された財産については、この限りでない。","lv":1}],"t":""},{"n":"〔4〕","h":"隠ぺい仮装行為があった場合","st":1,"ref":"法19の2⑤","items":[{"mk":"②","h":"","ref":"","st":0,"t":"配偶者の課税価格相当額","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"①＞②　　∴少ない金額\n※1　《配偶者が行った隠ぺい仮装行為》による事実に基づく金額を《含まない》ものとして計算した金額\n※2　《隠ぺい仮装行為》に係る財産のうち、《配偶者が取得した》部分の金額を《含まない》ものとして計算した金額","lv":2}],"t":"《相続又は遺贈により財産を取得した者》が、《隠ぺい仮装行為》に基づき、相続税の期限内申告書を提出し、又はこれを提出していなかった場合において、その相続税について《調査》があったことにより《更正又は決定》があるべきことを《予知》して《期限後申告書》又は《修正申告書》を提出するときは、これらの申告書に係る〔1〕の規定の適用については、〔1〕⑵の算式は次のとおりとする。\n%%|※1相続税の総額×（注）|相続税の課税価格の合計額\n※1\n※2\n（注）①　相続税の課税価格の合計額×配偶者の法定相続分1億6≤000万円∴多い金額\n※2"}]},{"no":"4-5","chap":"税額計算","ttl":"未成年者控除及び障害者控除","sub":"","secs":[{"n":"〔1〕","h":"未成年者控除","st":2,"ref":"法19の3①","items":[],"t":"《相続又は遺贈》により財産を取得した者（《居住制限納税義務者》又は《非居住制限納税義務者》に該当する者を除く。）がその被相続人の《法定相続人》に該当し、かつ、《18歳未満の者》である場合には、その者については、《算出相続税額》（《配偶者の税額軽減まで》の規定適用後の金額）から《10万円》にその者が《18歳》に達するまでの年数（1年未満《切上》）を乗じて算出した金額を控除した金額をもって、その《納付すべき相続税額》とする。"},{"n":"〔2〕","h":"障害者控除","st":2,"ref":"法19の4①","items":[],"t":"《相続又は遺贈》により財産を取得した者（《非居住無制限納税義務者》、《居住制限納税義務者》、《非居住制限納税義務者》に該当する者及び法施行地に《住所を有しない特定納税義務者》に該当する者を除く。）がその被相続人の《法定相続人》に該当し、かつ、《障害者》である場合には、その者については、《算出相続税額》（《未成年者控除まで》の規定適用後の金額）から《10万円》（《特別障害者》の場合には、《20万円》）にその者が《85歳》に達するまでの年数（1年未満《切上》）を乗じて算出した金額を控除した金額をもって、その《納付すべき相続税額》とする。"},{"n":"〔3〕","h":"扶養義務者から控除される場合","st":1,"ref":"法19の3②、19の4③","items":[],"t":"〔1〕〔2〕の《控除を受けることができる金額》がその《控除を受ける者》の《算出相続税額》を《超える》場合においては、その超える部分の金額は、その者の《扶養義務者の算出相続税額から控除》し、その《控除後の金額》をもって、その《扶養義務者》の《納付すべき相続税額》とする。"},{"n":"〔4〕","h":"重ねて受ける場合","st":1,"ref":"法19の3③、19の4③","items":[],"t":"〔1〕〔2〕に該当する者がその者又はその扶養義務者について《既に未成年者控除又は障害者控除を受けたことがある者》である場合においては、その者又はその扶養義務者が控除を受けることができる金額は、《既に控除を受けた金額》の合計額が〔1〕〔2〕により《控除を受けることができる金額》（《2回以上》これらの規定による《控除を受けた場合》には、《最初に》相続又は遺贈により財産を取得した際に控除を受けることができる金額）《に満たなかった》場合におけるその《満たなかった部分》の金額の範囲内に《限る》。"},{"n":"〔5〕","h":"障害者の意義","st":2,"ref":"法19の4②","items":[],"t":"《障害者》とは、精神上の障害により事理を弁識する能力を欠く常況にある者、失明者その他の精神又は身体に障害がある者をいい、《特別障害者》とは、《その障害者のうち》精神又は身体に《重度の障害》がある者をいう。"}]},{"no":"4-6","chap":"税額計算","ttl":"相次相続控除","sub":"","secs":[{"n":"〔1〕","h":"内容","st":2,"ref":"法20①","items":[],"t":"《相続》（被相続人からの《相続人に対する遺贈を含む》。以下同じ。）により《財産を取得》した場合において、その相続（以下「《第2次相続》」という。）に係る《被相続人》が第2次相続の開始前《10年以内》に開始した相続（以下「《第1次相続》」という。）により財産（《第1次相続》に係る被相続人からの《相続時精算課税適用財産》を含む。）を取得したことがあるときは、その被相続人から《相続により財産を取得した者》については、《算出相続税額》（《障害者控除まで》の規定《適用後》の金額）から〔2〕の控除額を控除した金額をもって、その《納付すべき相続税額》とする。"},{"n":"〔2〕","h":"控除額","st":1,"ref":"法20①、基通20－3","items":[],"t":"Ａ×Ｂ－Ａ分のＣ（100分の100を超えるときは100分の100）×Ｃ分のＤ×10分の10－Ｅ\nＡ：第2次相続に係る《被相続人》が《第1次相続》により取得した財産（その《第1次相続》に係\nる被相続人からの《相続時精算課税適用財産》を含む。以下Ｂにおいて同じ。）につき\n《課せられた相続税額》（《附帯税を》除く。）\nＢ：《第2次相続》に係る《被相続人》が第1次相続により取得した《財産の価額》（《相続税の課税》\n《価格に算入》された部分に《限る》。）\nＣ：《第2次相続》に係る《被相続人》から相続又は《遺贈》（被相続人からの《相続人に対する遺贈》\n《を除く》。）により財産を取得した全ての者が取得した《財産》（その被相続人からの《相》\n《続時精算課税適用財産》を含む。以下《Ｄにおいて》同じ。）《の価額》（《相続税の課税価格》\n《に算入》される部分に限る。以下《Ｄにおいて》同じ。）《の合計額》\nＤ：《第2次相続》に係る《被相続人》から《相続》により取得した《財産の価額》\nＥ：《第1次相続開始の時》から《第2次相続開始の時》までの《期間》に相当する《年数》（《1年未満》\n《切捨》）"}]},{"no":"4-7","chap":"税額計算","ttl":"外国税額控除","sub":"","secs":[{"n":"〔1〕","h":"相続税の外国税額控除","st":2,"ref":"法20の2","items":[],"t":"相続又は遺贈（《相続開始の年》にその相続に係る《被相続人》から受けた《贈与》により取得した財産の価額で《生前贈与加算》の規定により《相続税の課税価格に加算》されるものを含む。以下同じ。）により《法施行地外にある財産》を取得した場合において、その財産について《その地の法令により相続税に相当する税が課せられたとき》は、その財産を取得した者については、算出相続税額（《相次相続控除まで》の規定適用後の金額）からその《課せられた税額》に相当する金額を《控除》した金額をもって、その《納付すべき相続税額》とする。\nただし、その《控除すべき金額》が、《次の金額を超える》場合においては、その《超える部分》の金額についてはその《控除》をしない。\n%%算出相続税額×|《法施行地外》にある財産の価額|相続又は遺贈により取得した財産のうち《相続税の課税価格に算入》された財産の価額"},{"n":"〔2〕","h":"贈与税の外国税額控除","st":2,"ref":"法21の8","items":[],"t":"贈与により《法施行地外にある財産》を取得した場合において、その財産について《その地の法令により贈与税に相当する税が課せられたとき》は、その財産を取得した者については、算出贈与税額からその《課せられた税額》に相当する金額を《控除》した残額をもって、その《納付すべき贈与税額》とする。\nただし、その《控除すべき金額》が、《次の金額を超える》場合においては、その超える部分の金額についてはその《控除》をしない。\n%%算出贈与税額×|《法施行地外》にある財産の価額|贈与税の課税価格に算入された財産の価額"}]},{"no":"4-8","chap":"税額計算","ttl":"贈与税の配偶者控除","sub":"","secs":[{"n":"〔1〕","h":"内容","st":2,"ref":"法21の6①","items":[],"t":"（注）《贈与》により《婚姻期間が20年以上》である《配偶者》から《居住用不動産》又は《金銭》を取得した者（その年の前年以前に《その配偶者から取得した財産》につき《この規定の適用を受けた者》を《除く》。）が、その取得の日の属する年の《翌年3月15日まで》にその居住用不動産をその者の《居住の用に供し》、かつ、その後《引き続き居住の用に供する見込み》である場合又は《同日まで》にその《金銭をもって居住用不動産を取得》して、これをその者の《居住の用に供し》、かつ、その後《引き続き居住の用に供する見込み》である場合においては、その年分の贈与税については、課税価格から《2≤000万円》（《居住用不動産の価額》と《金銭》のうち居住用不動産の取得に充てられた部分の金額との《合計額》が《2≤000万円に満たない場合》には、その《合計額》）を《控除する》。\n（注）　居住用不動産とは、《専ら居住の用》に供する《土地等》又は《家屋》で《法施行地にあるもの》をいう。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"法21の6②、③","items":[],"t":"この規定は、《税務署長がやむを得ない事情があると認める場合を除き》、《贈与税の期限内申告書》（《期限後申告書》及び《修正申告書》を含む。）又は《更正請求書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、《適用する》。"},{"n":"〔3〕","h":"婚姻期間","st":1,"ref":"令4の6①","items":[],"t":"婚姻期間の判定は、《贈与時の現況》による。"}]},{"no":"5-1","chap":"相続時精算課税","ttl":"相続時精算課税制度","sub":"","secs":[{"n":"〔1〕","h":"相続時精算課税の選択","st":0,"ref":"法21の9①、②、④、⑤、⑥","items":[{"mk":"⑴","h":"適用要件","ref":"","st":2,"t":"《贈与により財産を取得した者》がその贈与をした者の《直系卑属である推定相続人》（その《年1月1日》において《18歳以上》である者に限る。）であり、かつ、その《贈与をした者》が《同日において60歳以上》の者である場合には、その《贈与により財産を取得した者》は、その《贈与に係る財産》について、《相続時精算課税》の規定の適用を受けることができる。","lv":1},{"mk":"⑵","h":"届出書","ref":"","st":2,"t":"⑴の規定の適用を受けようとする者は、《贈与税の期限内申告書の提出期間内》に⑴の《贈与をした者》からの《その年中における贈与》により取得した財産について《相続時精算課税選択届出書》を《納税地の所轄税務署長》に提出しなければならない。","lv":1},{"mk":"⑶","h":"適用除外","ref":"","st":1,"t":"その《年1月1日》において《18歳以上》の者が《同日において60歳以上》の者からの贈与により財産を取得した場合に、《その年の中途に》その者の《養子》となったこと等によりその者の《推定相続人となったとき》には、推定相続人となった時《前》にその者からの贈与により取得した財産については、⑴の規定の《適用はない》ものとする。","lv":1},{"mk":"⑷","h":"継続適用","ref":"","st":1,"t":"《相続時精算課税適用者》が、特定贈与者の《推定相続人でなくなった》場合においても、その《特定贈与者》からの《贈与により取得した財産》については、この規定の《適用がある》ものとする。","lv":1},{"mk":"⑸","h":"撤　　回","ref":"","st":1,"t":"《相続時精算課税選択届出書》は《撤回できない》。","lv":1}],"t":""},{"n":"〔2〕","h":"贈与税の計算","st":2,"ref":"法21の9③、21の10、21の11の2、21の12、21の13、措法70の3の2","items":[{"mk":"⑴","h":"課税価格","ref":"","st":0,"t":"《相続時精算課税適用者》が《特定贈与者》からの《贈与により取得した財産》については、《特定贈与者ごと》に《その年中において贈与》により取得した財産の価額を合計し、それぞれの合計額をもって、《贈与税の課税価格》とする。","lv":1},{"mk":"⑵","h":"基礎控除","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《相続時精算課税適用者》が《その年中》において《特定贈与者》からの《贈与により取得した財産》に係る《その年分の贈与税》については、《贈与税の課税価格》から《110万円を控除》する。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"①の相続時精算課税適用者に係る《特定贈与者が2人以上》ある場合における《各特定贈与者》から《贈与により取得した財産》に係る《課税価格から控除する金額》については、一定の金額とする。","lv":2}]},{"mk":"⑶","h":"特別控除","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"内　　容\n〔1〕⑵により適用を受ける《年分以後》、《特定贈与者ごと》の《⑵を控除した》贈与税の課税価格から、それぞれ次に掲げる金額のうち《いずれか低い金額》を控除する。","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《2≤500万円》（《既にこの規定の適用を受けた》部分の金額を控除した《残額》）","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"《特定贈与者ごと》の《⑵を控除した》贈与税の課税価格","lv":3}]},{"mk":"②","h":"","ref":"","st":0,"t":"申告要件\n①の規定は、《税務署長がやむを得ない事情があると認める場合を除き》、贈与税の《期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。","lv":2}]},{"mk":"⑷","h":"贈与税の計算","ref":"","st":0,"t":"（《⑴の課税価格－⑵の金額－⑶①の金額》）×《20％》","lv":1}],"t":""},{"n":"〔3〕","h":"相続税の計算","st":2,"ref":"法21の15、21の16、33の2①、④","items":[{"mk":"⑴","h":"相続又は遺贈により財産を取得した場合","ref":"","st":0,"t":"《特定贈与者から相続又は遺贈》により財産を《取得した相続時精算課税適用者》については、《相続時精算課税適用財産》（その《取得の日の属する年分》の《贈与税の課税価格計算の基礎に算入されるもの》に限る。）の価額から《相続時精算課税に係る基礎控除額》を控除した《残額》を《相続税の課税価格に加算》した価額をもって、相続税の課税価格とする。","lv":1},{"mk":"⑵","h":"相続又は遺贈により財産を取得しなかった場合","ref":"","st":0,"t":"《特定贈与者から相続又は遺贈》により財産を《取得しなかった相続時精算課税適用者》については、《相続時精算課税適用財産》を《特定贈与者》から《相続又は遺贈により取得したものとみなして》相続税の計算規定を適用する。\nこの場合において、その《相続時精算課税適用財産の価額》は《贈与の時における価額》とし、その財産の価額から《相続時精算課税に係る基礎控除額》を控除した《残額》を《相続税の課税価格に算入》する。","lv":1},{"mk":"⑶","h":"贈与税額控除","ref":"","st":0,"t":"⑴⑵の場合において、《相続時精算課税適用財産》につき《課せられた贈与税》があるときは、相続税額から《その贈与税額》（《贈与税の外国税額控除前》の税額とし、《附帯税》を除く。）に相当する金額を《控除》した金額をもって、その《納付すべき相続税額》とする。","lv":1},{"mk":"⑷","h":"還　　付","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《税務署長》は、相続時精算課税適用財産に係る《贈与税額》（《贈与税の外国税額控除前》の税額とし、《附帯税》を除く。）に相当する金額がある場合において、その金額を相続税額から控除してもなお《控除しきれなかった金額》があるときは、その《控除しきれなかった金額》（《贈与税の外国税額控除額》を控除した《残額》）に相当する税額を《還付》する。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"①の規定は、《還付を受けるための申告書》が提出された場合に限り、適用する。","lv":2}]}],"t":""}]},{"no":"5-2","chap":"相続時精算課税","ttl":"相続時精算課税に係る相続税の納付義務の承継等","sub":"","secs":[{"n":"〔1〕","h":"特定贈与者の死亡以前に死亡した場合","st":0,"ref":"","items":[{"mk":"⑴","h":"納付義務の承継等","ref":"法21の17①","st":2,"t":"《特定贈与者の死亡以前》に《相続時精算課税適用者が死亡》した場合には、その相続時精算課税適用者の《相続人又は包括受遺者》（《特定贈与者》を除く。）は、その《相続時精算課税適用者》が有していた《納税》に係る《権利又は義務》を承継する。","lv":1},{"mk":"⑵","h":"承継割合","ref":"法21の17③、令5の5、国通5②","st":2,"t":"相続時精算課税適用者の《相続人》（《包括受遺者》を含む。以下⑵において同じ。）が《2人以上いる場合》の承継の割合は、各《相続人》（《特定贈与者》を《除く》。）の《相続分》（《特定贈与者がないもの》として計算した《相続分》）とする。","lv":1},{"mk":"⑶","h":"再承継","ref":"法21の17④","st":1,"t":"⑴及び⑵の規定は、⑴の《権利又は義務を承継した者》が《特定贈与者の死亡以前に死亡》した場合について、準用する。","lv":1}],"t":""},{"n":"〔2〕","h":"相続時精算課税選択届出書の提出前に死亡した場合","st":2,"ref":"法21の18①、②","items":[{"mk":"⑴","h":"届出書の提出","ref":"","st":0,"t":"相続時精算課税の規定の適用を受けることができる者（以下「《被相続人》」という。）が、《相続時精算課税選択届出書》の提出期限前にその届出書を《提出しないで死亡》した場合には、その被相続人の《相続人又は包括受遺者》（贈与をした者を除く。以下同じ。）は、その《相続開始を知った日の翌日から10月以内》（その相続人又は包括受遺者がその期間内に《納税管理人の届出をしないで》法施行地に《住所及び居所》を《有しないこととなる》ときは、その住所及び居所を有しないこととなる日まで）に、その《届出書》をその《被相続人》の納税地の所轄税務署長に《共同して提出》することができる。","lv":1},{"mk":"⑵","h":"納付義務の承継等","ref":"","st":0,"t":"⑴の規定により《相続時精算課税選択届出書》を《提出した》相続人又は包括受遺者は、被相続人が有することとなる《相続時精算課税》の規定の適用を受けることに伴う《納税》に係る《権利又は義務》を承継する。","lv":1}],"t":""}]},{"no":"5-3","chap":"相続時精算課税","ttl":"住宅取得等資金の贈与を受けた場合の相続時精算課税の特例","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":2,"ref":"措法70の3①、②、③","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《居住無制限納税義務者》又は《非居住無制限納税義務者》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"贈与をした者の《直系卑属である推定相続人》（《孫》を含む。）","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"贈与の年の《1月1日》において《18歳以上》","lv":1}],"t":"《令和8年12月31日》までの間にその年《1月1日》において《60歳未満の者からの贈与》により《住》\n（注）《宅取得等資金》の取得をした《特定受贈者》が、その贈与の年の《翌年3月15日まで》にその住宅取得等資金の全額を《住宅用家屋の新築、取得、増改築等》又はこれらの住宅用家屋の《新築、取得、増改築等とともに》する《その敷地の用に供されている土地等》の取得（家屋の《新築に先行》してする《土地等の取得》を含む。）のための《対価》に充てた場合（《特別の関係がある者》から《新築、取得、増改築等》をする場合を除く。）において、《同日までに》その住宅用家屋をその特定受贈者の《居住の用に供した》とき又は《同日後遅滞なく》居住の用に供することが《確実であると見込まれる》ときは、その特定受贈者については、《相続時精算課税》の規定を準用する。\n（注）　特定受贈者は、次に掲げる要件を満たすものをいう。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"措法70の3⑫","items":[],"t":"この規定は、贈与税の《期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。"},{"n":"〔3〕","h":"届出書の提出","st":2,"ref":"法21の9②","items":[],"t":"〔1〕の規定の適用を受けようとする者は、贈与税の《期限内申告書》の提出期間内に〔1〕の《贈与をした者》からの《その年中における贈与》により取得した財産について《相続時精算課税選択届出書》を《納税地の所轄税務署長》に提出しなければならない。"},{"n":"〔4〕","h":"修正申告","st":2,"ref":"措法70の3④","items":[],"t":"《〔1〕の規定》の適用を受けた《特定受贈者》が、住宅取得等資金の取得をした年の《翌年3月15日後遅滞なく》その特定受贈者の居住の用に供することが《確実であると見込まれる》ことにより《相続時精算課税選択届出書》を提出していた場合において、《住宅用家屋をその年12月31日までにその特定受贈者の居住の用に供していなかったとき》は、その届出書は《提出していなかった》ものとみなす。この場合において、その《特定受贈者》は、《その年12月31日から2月以内》に、〔1〕の規定の《適用を受けた年分の贈与税》についての《修正申告書》を提出し、かつ、その期限内にその申告書の提出により《納付すべき税額》を《納付》しなければならない。"},{"n":"〔5〕","h":"災害による居住要件の免除","st":1,"ref":"措法70の3⑧、⑨","items":[{"mk":"⑴","h":"申告期限前に災害があった場合","ref":"","st":0,"t":"《令和8年12月31日まで》の間にその年《1月1日において60歳未満》の者からの贈与により金銭の取得をした《個人》が、その金銭を《住宅用家屋の新築、取得、増改築等の対価》に充ててその《贈与の年の翌年3月15日まで》にその《新築、取得、増改築等》をした場合には、その《新築、取得、増改築等》をした《住宅用家屋が災害》（《震災》、《風水害》、《火災その他一定のもの》をいう。以下同じ。）によって《滅失》（《通常の修繕》によっては《原状回復が困難な損壊》を《含む》。以下⑵において同じ。）をしたことにより《同日まで》にその《居住の用に供することができなくなったとき》であっても、その《個人》は、《〔1〕の規定の適用を受けることができる》。","lv":1},{"mk":"⑵","h":"申告期限後に災害があった場合","ref":"","st":0,"t":"《住宅取得等資金》について《〔1〕の規定》の適用を受けた《特定受贈者》が、《住宅取得等資金の取得》をした《年の翌年3月15日後遅滞なく》その《特定受贈者の居住の用に供すること》が《確実であると見込まれること》により《〔1〕の規定の適用を受けた場合》において、《住宅用家屋が災害により滅失をしたこと》によって《居住の用に供することができなくなったとき》は、《〔4〕の規定は適用しない》。","lv":1}],"t":""},{"n":"〔6〕","h":"災害による居住期限等の延長","st":1,"ref":"措法70の3⑩、⑪","items":[{"mk":"⑴","h":"申告期限前に災害があった場合","ref":"","st":0,"t":"《令和8年12月31日まで》の間にその《年1月1日において60歳未満》の者からの贈与により金銭の取得をした《個人》が、その金銭を《住宅用家屋の新築、取得、増改築等の対価》に充ててその《新築、取得、増改築等》をする場合には、《災害に基因するやむを得ない事情》によりその《贈与の年の翌年3月15日まで》にその《新築、取得、増改築等ができなかったとき》であっても、その《個人》は、《〔1〕の規定の適用を受けることができる》。この場合、〔1〕〔4〕において、翌年3月15日とあるのは、《翌々年3月15日》とする。","lv":1},{"mk":"⑵","h":"申告期限後に災害があった場合","ref":"","st":0,"t":"《住宅取得等資金》について《〔1〕の規定》の適用を受けた《特定受贈者》が、《住宅取得等資金の取得》をした《年の翌年3月15日後遅滞なく》その《特定受贈者》の《居住の用に供すること》が《確実であると見込まれること》により《〔1〕の規定の適用を受けた場合》において、《災害に基因するやむを得ない事情》により住宅用家屋をその《年12月31日まで》にその《特定受贈者》の《居住の用に供することができなかった》ときにおける《〔4〕の規定の適用》については、その年12月31日とあるのは、贈与の年の《翌々年12月31日》とする。","lv":1}],"t":""}]},{"no":"5-4","chap":"相続時精算課税","ttl":"相続時精算課税適用者の特例","sub":"（孫・特例事業受贈者・特例経営承継受贈者）","secs":[{"n":"〔1〕","h":"孫","st":0,"ref":"措法70の2の6","items":[{"mk":"⑴","h":"内　　容","ref":"","st":2,"t":"《贈与により財産を取得した者》がその贈与をした者の《孫》（その《年1月1日》において《18歳以上》である者に限る。）であり、かつ、その《贈与をした者》が《同日において60歳以上》の者である場合には、その《贈与により財産を取得した者》については、《相続時精算課税の規定》を準用する。","lv":1},{"mk":"⑵","h":"適用除外","ref":"","st":1,"t":"その《年1月1日において18歳以上》の者が《同日において60歳以上》の者からの贈与により財産を取得した場合に、その《贈与により財産を取得した者》がその《年の中途》において《その贈与をした者の孫》となったときは、《孫》となった《時前》にその贈与をした者からの贈与により取得した財産については、《⑴の規定の適用はない》ものとする。","lv":1},{"mk":"⑶","h":"継続適用","ref":"","st":1,"t":"《相続時精算課税適用者》が、《特定贈与者の孫でなくなった》場合においても、その《特定贈与者》からの《贈与により取得した財産》については、《相続時精算課税の規定》の《適用がある》ものとする。","lv":1}],"t":""},{"n":"〔2〕","h":"特例事業受贈者","st":0,"ref":"措法70の2の7","items":[{"mk":"⑴","h":"内　　容","ref":"","st":2,"t":"贈与により《個人の事業用資産の贈与税の納税猶予及び免除の規定》の適用に係る《特例受贈事業用資産》を取得した《特例事業受贈者》が《贈与者》の《直系卑属である推定相続人以外の者》（その《贈与者の孫》を除き、その《年1月1日》において《18歳以上》である者に限る。）であり、かつ、その《贈与者》が《同日において60歳以上》の者である場合には、その贈与によりその《特例受贈事業用資産》を取得した《特例事業受贈者》については、《相続時精算課税の規定》を準用する。","lv":1},{"mk":"⑵","h":"適用除外","ref":"","st":1,"t":"《特例事業受贈者》が《贈与者》（その《年1月1日において60歳以上》の者に限る。）からの贈与により《特例受贈事業用資産》を取得した場合において、その《特例受贈事業用資産》の《取得の時前》にその《贈与者》からの《贈与により取得した財産》については、《⑴の規定の適用はない》ものとする。","lv":1},{"mk":"⑶","h":"継続適用","ref":"","st":1,"t":"相続時精算課税の規定の適用を受ける《特例事業受贈者》が、《納税猶予分の贈与税の全部》につき《納税猶予期限が確定した場合》又は《免除された場合》においても、《贈与者》からの《贈与により取得した財産》については、《相続時精算課税の規定》の《適用がある》ものとする。","lv":1}],"t":""},{"n":"〔3〕","h":"特例経営承継受贈者","st":0,"ref":"措法70の2の8","items":[{"mk":"⑴","h":"内　　容","ref":"","st":2,"t":"贈与により《非上場株式等の贈与税の納税猶予及び免除の特例の規定》の適用に係る《特例対象受贈非上場株式等》を取得した《特例経営承継受贈者》が《特例贈与者》の《直系卑属である推定相続人以外の者》（その《特例贈与者の孫》を除き、その《年1月1日》において《18歳以上》である者に限る。）であり、かつ、その《特例贈与者》が《同日において60歳以上》の者である場合には、その贈与によりその《特例対象受贈非上場株式等》を取得した《特例経営承継受贈者》については、《相続時精算課税の規定》を準用する。","lv":1},{"mk":"⑵","h":"適用除外","ref":"","st":1,"t":"《特例経営承継受贈者》が《特例贈与者》（その《年1月1日において60歳以上》の者に限る。）からの贈与により《特例対象受贈非上場株式等》を取得した場合において、その《特例対象受贈非上場株式等》の《取得の時前》にその《特例贈与者》からの《贈与により取得した財産》については、《⑴の規定の適用はない》ものとする。","lv":1},{"mk":"⑶","h":"継続適用","ref":"","st":1,"t":"相続時精算課税の規定の適用を受ける《特例経営承継受贈者》が、《納税猶予分の贈与税の全部》につき《納税猶予期限が確定した場合》又は《免除された場合》においても、《特例贈与者》からの《贈与により取得した財産》については、《相続時精算課税の規定》の《適用がある》ものとする。","lv":1}],"t":""},{"n":"〔4〕","h":"届出書の提出","st":2,"ref":"法21の9②","items":[],"t":"〔1〕から〔3〕の規定の適用を受けようとする者は、《贈与税の期限内申告書の提出期間内》に〔1〕から〔3〕の《贈与をした者》からの《その年中における贈与》により取得した財産について《相続時精算課税選択届出書》を《納税地の所轄税務署長》に提出しなければならない。"}]},{"no":"5-5","chap":"相続時精算課税","ttl":"相続時精算課税に係る土地又は建物の価額の特例","sub":"","secs":[{"n":"〔1〕","h":"内容","st":2,"ref":"措法70の3の3①","items":[],"t":"《相続時精算課税適用者》が《特定贈与者》からの贈与により取得した《土地又は建物》が、その《贈与を受けた日から》その特定贈与者の死亡に係る《相続税の期限内申告書の提出期限まで》の間に《災害》（《震災、風水害、火災》その他一定の災害をいう。以下同じ。）によって《相当の被害》を受けた場合（その《相続時精算課税適用者》が、その《土地又は建物》をその《災害が発生した日》まで《引き続き所有》していた場合に限る。）において、その《相続時精算課税適用者》が《贈与税の納税地の所轄税務署長の承認》を受けたときは、《相続税の課税価格に加算》する《財産の価額》は、その《土地又は建物》の価額からその《被害を受けた部分に対応するもの》として一定の金額を《控除した金額》とする。"},{"n":"〔2〕","h":"適用除外","st":1,"ref":"措法70の3の3③","items":[],"t":"〔1〕の規定は、《相続時精算課税適用者》が、その《土地又は建物》について《災害被害者に対する租税の減免、徴収猶予等に関する法律》に規定する《免除》又は《贈与税の課税価格の計算》の規定の《適用を受けようとする場合》又は《受けた場合》は、《適用しない》。"},{"n":"〔3〕","h":"申請","st":2,"ref":"措令40の5の3⑤","items":[],"t":"〔1〕の規定の《承認》を受けようとする《相続時精算課税適用者》は、一定の事項を記載した《申請書》を、その《災害が発生した日》から《3年を経過する日》までに、《贈与税の納税地》の所轄税務署長に《提出しなければならない》。問題6−1"}]},{"no":"6-1","chap":"申告","ttl":"相続税の期限内申告","sub":"","secs":[{"n":"〔1〕","h":"提出義務者及び提出期限","st":0,"ref":"","items":[{"mk":"⑴","h":"本来の提出義務者","ref":"法27①、29①","st":2,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"一般の場合\n《相続又は遺贈》（被相続人からの《相続時精算課税》に係る《贈与》を含む。以下同じ。）により財産を取得した者及び《相続時精算課税適用者》は、その《被相続人》からこれらの事由により財産を取得した《全ての者》に係る《相続税の課税価格》（生前贈与加算及び相続時精算課税適用財産の価額を加算した後の《相続税の課税価格とみなされた金額》）《の合計額》が《遺産に係る基礎控除額を超える》場合において、その者に係る《相続税額》（《配偶者の税額軽減》の規定の適用を受けないものとして計算した金額）《がある》ときは、その《相続開始を知った日の翌日から10月以内》（その者がその期間内に《納税管理人の届出をしないで》法施行地に住所及び居所を有しないこととなるときは、その住所及び居所を《有しないこととなる日まで》。以下同じ。）に《期限内申告書》を納税地の所轄税務署長に《提出しなければならない》。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"相続財産分与の事由が生じた場合等\n《相続財産法人に係る相続財産分与の事由》又は《特別寄与料の支払確定の事由》が生じたため《新たに期限内申告書を提出すべき要件》に該当することとなった者は、その《事由が生じたことを知った日の翌日から10月以内》に《期限内申告書》を納税地の所轄税務署長に《提出しなければならない》。","lv":2}]},{"mk":"⑵","h":"提出義務の承継者","ref":"法27②、法29②","st":2,"t":"⑴の規定により期限内申告書を《提出すべき者》がその申告書の提出期限前にその《申告書を提出しないで死亡》した場合には、その者の《相続人又は包括受遺者》は、その《相続開始を知った日の翌日から10月以内》に、その《死亡した者》の期限内申告書を《その死亡した者》の納税地の所轄税務署長に提出しなければならない。","lv":1},{"mk":"⑶","h":"提出期限の特例","ref":"","st":1,"t":"（国通11）\n税務署長等は、《災害等の理由》により、申告期限までに《申告することができない》と認めるときは、その理由のやんだ日から《2月以内》に限り、その期限を《延長》することができる。","lv":1},{"mk":"⑷","h":"提出を要しない場合","ref":"法27⑥、法29②","st":2,"t":"⑴⑵の規定は、《期限内申告書の提出期限前》に相続税について《決定》があった場合には、適用しない。\n問題6−1","lv":1}],"t":""},{"n":"〔2〕","h":"納付","st":2,"ref":"法33","items":[],"t":"期限内申告書を提出した者は、その《申告書の提出期限まで》に、その申告書に記載した相続税を《国に納付しなければならない》。"},{"n":"〔3〕","h":"その他","st":1,"ref":"法27④、⑤、法29②","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"期限内申告書を提出する場合には、一定の事項を記載した《明細書等を添付》しなければならない。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《同一の被相続人》から相続又は遺贈により財産を取得した者又はその者の《相続人》又は《包括受遺者》が2人以上ある場合において、申告書の《提出先の税務署長》が《同一》であるときは、これらの者は、その申告書を《共同して提出》することができる。問題6−2","lv":1}],"t":""}]},{"no":"6-2","chap":"申告","ttl":"贈与税の期限内申告","sub":"","secs":[{"n":"〔1〕","h":"提出義務者及び提出期限","st":0,"ref":"","items":[{"mk":"⑴","h":"本来の提出義務者","ref":"法28①","st":2,"t":"《贈与》により財産を取得した者は、その年分の《贈与税額》（《贈与税の配偶者控除》の規定の適用を《受けない》ものとして計算した金額。以下同じ。）《がある場合》、又はその財産が《相続時精算課税適用財産である場合》（《相続時精算課税に係る基礎控除額》を控除後の《贈与税の課税価格がある場合》に限る。）には、その年の《翌年2月1日から3月15日まで》（同年《1月1日》から《3月15日》までに《納税管理人の届出をしないで》法施行地に住所及び居所を有しないこととなるときは、その住所及び居所を《有しないこととなる日まで》）に、《期限内申告書》を納税地の所轄税務署長に《提出しなければならない》。","lv":1},{"mk":"⑵","h":"提出義務の承継者","ref":"法28②","st":2,"t":"次の場合には、その死亡した者の《相続人又は包括受遺者》は、その《相続開始を知った日の翌日から10月以内》（その者がその期間内に《納税管理人の届出をしないで》法施行地に住所及び居所を有しないこととなるときは、その住所及び居所を《有しないこととなる日まで》）に、その《死亡した者》の期限内申告書を《その死亡した者》の納税地の所轄税務署長に《提出しなければならない》。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《年の中途において死亡》した者がその年1月1日から《死亡の日まで》に贈与により取得した財産の価額につき《贈与税額がある》こととなるとき","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"相続時精算課税適用者が《年の中途において死亡》した場合に、その年1月1日から《死亡の日まで》に《相続時精算課税適用財産を贈与により取得》したとき（《相続時精算課税に係る基礎控除額》を控除後の《贈与税の課税価格がある場合》に限る。）","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"《期限内申告書》を《提出》すべき者がその《申告書の提出期限前》にその申告書を《提出しないで死亡》した場合","lv":2}]},{"mk":"⑶","h":"提出期限の特例","ref":"","st":0,"t":"（国通11）　★税務署長等は、《災害等の理由》により、申告期限までに《申告することができない》と認めるときは、その理由のやんだ日から《2月以内》に限り、その期限を《延長》することができる。\n問題6−2","lv":1},{"mk":"⑷","h":"提出を要しない場合","ref":"法28③、④","st":2,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"⑴⑵の規定は、《期限内申告書の提出期限前》に贈与税について《決定》があった場合には、適用しない。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《相続時精算課税適用者》が相続時精算課税適用財産を取得した場合において、《特定贈与者》がその《贈与をした年の中途に死亡》したときは、その財産については、期限内申告書を提出することを《要しない》。","lv":2}]}],"t":""},{"n":"〔2〕","h":"納付","st":2,"ref":"法33","items":[],"t":"期限内申告書を提出した者は、その《申告書の提出期限まで》に、その申告書に記載した贈与税を《国に納付しなければならない》。問題6−3"}]},{"no":"6-3","chap":"申告","ttl":"相続税法の納税地","sub":"","secs":[{"n":"〔1〕","h":"原則","st":2,"ref":"法62","items":[{"mk":"⑴","h":"法施行地に住所を有するもの","ref":"","st":0,"t":"《居住無制限納税義務者》、《居住制限納税義務者》又は《特定納税義務者》は、法施行地にある《住所地》（法施行地に住所を有しないこととなった場合には、《居所地》）をもって、その《納税地》とする。","lv":1},{"mk":"⑵","h":"法施行地に住所を有しないもの及び有しなくなるもの","ref":"","st":0,"t":"《非居住無制限納税義務者》又は《非居住制限納税義務者》及び《居住無制限納税義務者》、《居住制限納税義務者》又は《特定納税義務者》で法施行地に住所及び居所を有しないこととなるものは、《納税地を定めて》、納税地の所轄税務署長に《申告しなければならない》。\nその申告がないときは、《国税庁長官》が納税地を指定し、これを《通知》する。","lv":1},{"mk":"⑶","h":"納税義務者が死亡した場合における納税地","ref":"","st":0,"t":"《納税義務者が死亡》した場合においては、その者に係る《相続税》又は《贈与税》については、その者の《死亡当時の納税地》をもって、その納税地とする。","lv":1}],"t":""},{"n":"〔2〕","h":"相続税の納税地の特例","st":2,"ref":"法附則3","items":[],"t":"《相続又は遺贈》により財産を取得した者（《相続時精算課税適用者》を含む。）の《被相続人の死亡時の住所》が《法施行地にある場合》の《相続税》の納税地は、〔1〕⑴⑵の規定にかかわらず、《被相続人の死亡時の住所地》とする。問題6−4"}]},{"no":"6-4","chap":"申告","ttl":"期限後申告（国税通則法の期限後申告を除く。）","sub":"","secs":[{"n":"〔1〕","h":"相続税法の特則（相続税）","st":2,"ref":"法30①","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《未分割遺産に対する課税》の規定により《分割されていない財産》について《民法》（《寄与分を除く。》）の規定による《相続分又は包括遺贈の割合》に従って《課税価格》が計算されていた場合において、その後その財産の《分割が行われ》、《共同相続人又は包括受遺者》がその《分割により取得した財産》に係る《課税価格》がその《相続分又は包括遺贈の割合》に従って計算された《課税価格》と《異なること》となったこと。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"民法の規定による認知、相続人の廃除又はその取消しに関する裁判の確定、相続の回復、相続の放棄の取消し等により《相続人に異動》を生じたこと。","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"《遺留分侵害額の請求》に基づき《支払うべき金銭の額》が確定したこと。","lv":1},{"mk":"⑷","h":"","ref":"","st":0,"t":"遺贈に係る《遺言書が発見》され、又は《遺贈の放棄》があったこと。","lv":1},{"mk":"⑸","h":"","ref":"","st":0,"t":"物納手続（物納申請の却下に係る《再申請》をする場合を含む。）の規定により《条件を付して物納の許可がされた》場合（《物納の許可の取消し》の規定によりその許可が《取り消され》、又は《取り消されることとなる》場合に《限る》。）において、その物納に充てた財産に関し一定の事由が生じたこと。","lv":1},{"mk":"⑹","h":"","ref":"","st":0,"t":"⑴から⑸の事由に準ずる事由が生じたこと。","lv":1}],"t":"相続税の《期限内申告書》の提出期限《後》において次の事由が生じたため《新たに期限内申告書を提出すべき要件》に該当することとなった者は、《期限後申告書》を《提出することができる》。"},{"n":"〔2〕","h":"措置法の特則（相続税）","st":2,"ref":"措法70⑦、⑩","items":[],"t":"《国等に対して相続財産を贈与した場合等の相続税の非課税の規定》の適用を受けた者は、その規定の適用を受けた財産についてその贈与又は受入れの日から《2年を経過した日》までに《取消しの規定に該当》したことに伴いその《財産の価額》を《相続税の課税価格に算入》すべきこととなったことにより、《相続税の期限内申告書を提出すべきこととなった場合》には、《その2年を経過した日の翌日から4月以内》に《期限後申告書》を《提出しなければならない》。"},{"n":"〔3〕","h":"相続税法の特則（贈与税）","st":2,"ref":"法30②","items":[],"t":"贈与税の期限内申告書の提出期限後において〔1〕⑴から⑹までの事由が生じたことにより《相続又は遺贈による財産の取得をしない》こととなったため《新たに期限内申告書を提出すべき要件》に該当することとなった者は、《期限後申告書》を《提出することができる》。\n問題6−4"},{"n":"〔4〕","h":"納付（国通35②一、措法70⑦）","st":2,"ref":"","items":[],"t":"期限後申告書を提出した者は、その《申告書を提出した日まで》又はその《申告書の提出期限内》にその申告書に記載した税額を《国に納付しなければならない》。"},{"n":"〔5〕","h":"その他","st":1,"ref":"法51②一、措法70⑨、国通18③","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《任意的期限後申告書》の提出により納付すべき税額に係る《延滞税》については、法定納期限の翌日からその《申告書の提出があった日》までの期間は、《延滞税の計算期間》に算入しない。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"措置法の特則の《義務的期限後申告書》で《提出期限内》に提出されたものについては、《期限内申告書》と《みなす》。","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"期限後申告書には、一定の事項を記載し、かつ、一定の書類を添付しなければならない。問題6−5","lv":1}],"t":""}]},{"no":"6-5","chap":"申告","ttl":"修正申告","sub":"（医療法人に関する事項、国税通則法の修正申告を除く。）","secs":[{"n":"〔1〕","h":"相続税法の特則（相続税）","st":2,"ref":"法31①、②、③","items":[{"mk":"⑴","h":"任意的修正申告","ref":"","st":0,"t":"《期限内申告書》又は《期限後申告書》を提出した者（相続税について《決定》を受けた者を含む｡）は、次の事由が生じたため《既に確定した相続税額に不足を生じた》場合には、《修正申告書》を《提出することができる》。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《未分割遺産に対する課税》の規定により《分割されていない財産》について《民法》（《寄与分を除く》。）の規定による《相続分又は包括遺贈の割合》に従って《課税価格》が計算されていた場合において、その後その財産の《分割が行われ》、《共同相続人又は包括受遺者》がその《分割により取得した財産》に係る《課税価格》がその《相続分又は包括遺贈の割合》に従って計算された《課税価格》と《異なること》となったこと。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"民法の規定による認知、相続人の廃除又はその取消しに関する裁判の確定、相続の回復、相続の放棄の取消し等により《相続人に異動》を生じたこと。","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"《遺留分侵害額の請求》に基づき《支払うべき金銭の額》が確定したこと。","lv":2},{"mk":"④","h":"","ref":"","st":0,"t":"遺贈に係る《遺言書が発見》され、又は《遺贈の放棄》があったこと。","lv":2},{"mk":"⑤","h":"","ref":"","st":0,"t":"物納手続（物納申請の却下に係る《再申請》をする場合を含む。）の規定により《条件を付して物納の許可がされた》場合（《物納の許可の取消し》の規定によりその許可が《取り消され》、又は《取り消されることとなる》場合に《限る》。）において、その物納に充てた財産に関し一定の事由が生じたこと。","lv":2},{"mk":"⑥","h":"","ref":"","st":0,"t":"①から⑤の事由に準ずる事由が生じたこと。","lv":2}]},{"mk":"⑵","h":"義務的修正申告","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"⑴に規定する者は、《相続財産法人に係る相続財産分与の事由》又は《特別寄与料の支払確定の事由》が生じたため《既に確定した相続税額に不足を生じた》場合には、その《事由が生じたことを知った日の翌日から10月以内》（その者がその期間内に《納税管理人の届出をしない》で法施行地に住所及び居所を有しないこととなるときは、その住所及び居所を《有しないこととなる日》まで）に修正申告書を納税地の所轄税務署長に《提出しなければならない》。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"①の規定は、《修正申告書の提出期限前》に相続税について《更正》があった場合には、適用しない。\n問題6−5","lv":2}]}],"t":""},{"n":"〔2〕","h":"措置法の特則（相続税）","st":2,"ref":"措法70⑥、⑩","items":[],"t":"《国等に対して相続財産を贈与した場合等の相続税の非課税の規定》の適用を受けて《相続税の期限内申告書を提出した者》（その者の《相続人》及び《包括受遺者》を含む。）は、その規定の適用を受けた財産についてその贈与又は受入れの日から《2年を経過した日》までに《取消しの規定に該当》した場合には、《その2年を経過した日の翌日から4月以内》に《修正申告書》を《提出しなければならない》。"},{"n":"〔3〕","h":"相続税法の特則（贈与税）","st":2,"ref":"法31④","items":[],"t":"《期限内申告書》又は《期限後申告書》を提出した者（贈与税について《決定》を受けた者を含む。）は、〔1〕⑴①から⑥までの事由が生じたことにより《相続又は遺贈による財産の取得をしない》こととなったため《既に確定した贈与税額に不足を生じた》場合には、《修正申告書》を《提出することができる》。"},{"n":"〔4〕","h":"措置法の特則（贈与税）","st":2,"ref":"措法70の2④、70の3④","items":[{"mk":"⑴","h":"贈与税の非課税","ref":"","st":0,"t":"《住宅取得等資金の贈与を受けた場合の贈与税の非課税》の規定の適用を受けた《特定受贈者》が、住宅取得等資金の取得をした年の《翌年3月15日後遅滞なく》その特定受贈者の居住の用に供することが《確実であると見込まれる》ことによりその規定の適用を受けていた場合において、《住宅用家屋をその年12月31日までにその特定受贈者の居住の用に供していなかったとき》は、その規定は適用しない。この場合において、その特定受贈者は、その年12月31日から《2月以内》に、その規定の適用を受けた年分の贈与税についての《修正申告書》を《提出しなければならない》。","lv":1},{"mk":"⑵","h":"相続時精算課税の特例","ref":"","st":0,"t":"《住宅取得等資金の贈与を受けた場合の相続時精算課税の特例》の規定の適用を受けた《特定受贈者》が、住宅取得等資金の取得をした年の《翌年3月15日後遅滞なく》その特定受贈者の居住の用に供することが《確実であると見込まれる》ことにより相続時精算課税選択届出書を提出していた場合において、《住宅用家屋をその年12月31日までにその特定受贈者の居住の用に供していなかったとき》は、その届出書は提出していなかったものとみなす。この場合において、その特定受贈者は、その年12月31日から《2月以内》に、その規定の適用を受けた年分の贈与税についての修正申告書を《提出しなければならない》。問題6−5","lv":1}],"t":""},{"n":"〔5〕","h":"納付（国通35②一、法33、措法70⑥、70の2④、70の3④）","st":2,"ref":"","items":[],"t":"修正申告書を提出した者は、その《申告書を提出した日まで》又はその《申告書の提出期限内》にその申告書に記載した《税額を国に納付しなければならない》。"},{"n":"〔6〕","h":"その他","st":1,"ref":"法50②一、51②一、措法70⑨、70の2⑥一、70の3⑥一、国通19④","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《任意的修正申告書》の提出により納付すべき税額に係る《延滞税》については、法定納期限の翌日からその《申告書の提出があった日》までの期間は、《延滞税の計算期間》に算入しない。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"相続税法の特則及び措置法の特則の《義務的修正申告書》で《提出期限内》に提出されたものについては、《期限内申告書》と《みなす》。","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"修正申告書には、一定の事項を記載し、かつ、一定の書類を添付しなければならない。問題6−6","lv":1}],"t":""}]},{"no":"6-6","chap":"申告","ttl":"更正の請求（国税通則法の更正の請求を除く。）","sub":"","secs":[{"n":"〔1〕","h":"相続税法及び措置法の特則","st":2,"ref":"法32①、措法69の4⑤、69の5⑥","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《未分割遺産に対する課税》の規定により《分割されていない財産》について《民法》（《寄与分を除く。》）の規定による《相続分又は包括遺贈の割合》に従って《課税価格》が計算されていた場合において、その後その財産の《分割が行われ》、《共同相続人又は包括受遺者》がその《分割により取得した財産》に係る《課税価格》がその《相続分又は包括遺贈の割合》に従って計算された《課税価格》と《異なること》となったこと。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"民法の規定による認知、相続人の廃除又はその取消しに関する裁判の確定、相続の回復、相続の放棄の取消し等により《相続人に異動》を生じたこと。","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"《遺留分侵害額の請求》に基づき《支払うべき金銭の額》が確定したこと。","lv":1},{"mk":"⑷","h":"","ref":"","st":0,"t":"遺贈に係る《遺言書が発見》され、又は《遺贈の放棄》があったこと。","lv":1},{"mk":"⑸","h":"","ref":"","st":0,"t":"物納手続（物納申請の却下に係る《再申請》をする場合を含む。）の規定により《条件を付して物納の許可がされた》場合（《物納の許可の取消し》の規定によりその許可が《取り消され》、又は《取り消されることとなる》場合に《限る》。）において、その物納に充てた財産に関し一定の事由が生じたこと。","lv":1},{"mk":"⑹","h":"","ref":"","st":0,"t":"⑴から⑸の事由に準ずる事由が生じたこと。","lv":1},{"mk":"⑺","h":"","ref":"","st":0,"t":"《相続財産法人に係る相続財産分与の事由》又は《特別寄与料の支払確定の事由》が生じたこと。","lv":1},{"mk":"⑻","h":"","ref":"","st":0,"t":"申告期限までに《分割されていない財産》が申告期限から《3年以内》（その期間内にその財産が分割されなかったことにつき、《やむを得ない事情》がある場合において、《納税地の所轄税務署長》の《承認》を受けたときは、その《財産の分割ができることとなった日》として定める日の翌日から《4月以内》。以下同じ。）に分割されたことにより、その《分割が行われた時以後》において《配偶者の税額軽減》の規定を適用して計算した《相続税額》が、《その時前》において《配偶者の税額軽減》の規定を適用して計算した《相続税額》と《異なること》となったこと（《⑴の場合》を除く。）。\n問題6−6","lv":1},{"mk":"⑼","h":"","ref":"","st":0,"t":"申告期限までに《分割されていない特例対象宅地等》が申告期限から《3年以内》に分割されたこと等により、その《分割が行われた時以後》において《小規模宅地等の特例》の規定を適用して計算した《相続税額》が、《その時前》において《小規模宅地等の特例》の規定を適用して計算した《相続税額》と《異なること》となったこと（《⑴の場合》を除く。）。","lv":1},{"mk":"⑽","h":"","ref":"","st":0,"t":"申告期限までに《分割されていない特定計画山林》が申告期限から《3年以内》に分割されたこと等により、その《分割が行われた時以後》において《特定計画山林の特例》の規定を適用して計算した《相続税額》が、《その時前》において《特定計画山林の特例》の規定を適用して計算した《相続税額》と《異なること》となったこと（《⑴の場合》を除く。）。","lv":1},{"mk":"⑾","h":"","ref":"","st":0,"t":"所得税法に規定する《国外転出時課税》に係る納税猶予又は《国外転出（贈与・相続）時課税》に係る納税猶予の適用を受けていた者の《相続人又は包括受遺者》が、その《納税猶予分の所得税額を納付》することとなったこと等。","lv":1},{"mk":"⑿","h":"","ref":"","st":0,"t":"贈与税の《課税価格に算入した》財産のうちに《相続開始の年》にその相続に係る《被相続人》から受けた贈与により取得した財産の価額で《生前贈与加算》の規定により《相続税の課税価格》に《加算されるもの》があったこと。問題6−7","lv":1}],"t":"《相続税》又は《贈与税》について《申告書》を提出した者又は《決定》を受けた者は、次の事由によりその《申告》又は《決定》に係る《課税価格》及び《相続税額》又は《贈与税額》が《過大となったとき》は、その事由が生じたことを知った日の翌日から《4月以内》に限り、《納税地の所轄税務署長》に《更正の請求》を《することができる》。"}]},{"no":"6-7","chap":"申告","ttl":"国税通則法に規定する期限後申告、修正申告及び更正の請求","sub":"","secs":[{"n":"〔1〕","h":"期限後申告","st":0,"ref":"","items":[],"t":"（国通18①）《期限内申告書》を提出すべきであった者は、その提出期限後においても、《決定》があるまでは、《期限後申告書》を税務署長に提出することができる。"},{"n":"〔2〕","h":"修正申告（国通19①、②）","st":0,"ref":"","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"先の申告書に記載した又は更正通知書・決定通知書に記載された税額に《不足額》があるとき","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"先の申告書に記載した又は更正通知書・決定通知書に記載された還付金の額に相当する税額が《過大》であるとき","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"先の申告書又は更正において、納付すべき税額がないとされていた場合において納付すべき税額が《ある》とき","lv":1}],"t":"《納税申告書》を提出した者及び《更正》又は《決定》を受けた者は、次のいずれかに該当する場合には、《更正》があるまでは、《修正申告書》を税務署長に提出することができる。"},{"n":"〔3〕","h":"更正の請求の原則（国通23①）","st":0,"ref":"","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"その申告書に記載した課税価格若しくは税額の計算が《国税に関する法律》の規定に従っていなかったこと又はその計算に《誤り》があったことにより、その申告書の提出により納付すべき税額が《過大》であるとき","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"⑴の理由により、その申告書に記載した還付金の額に相当する税額が《過少》であるとき、又はその申告書に還付金の額に相当する税額の《記載がなかった》とき\n問題6−7","lv":1}],"t":"《納税申告書》を提出した者は、次のいずれかに該当する場合には、その申告書に係る国税の法定申告期限から《5》年以内に限り、税務署長に対し、更正の請求をすることができる。"},{"n":"〔4〕","h":"更正の請求の特則（国通23②）","st":0,"ref":"","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"その申告等に係る課税価格又は税額の計算の基礎となった《事実》に関する《訴え》についての《判決等》により、その事実がその計算の基礎としたところと異なることが確定したとき","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"その申告等をした者に帰属するものとされていた所得その他課税物件が《他の者に帰属》するものとする当該他の者に係る国税の《更正》又は《決定》があったとき","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"その他国税の法定申告期限後に生じた⑴及び⑵に類する《やむを得ない》理由があると参　考贈与税の更正の請求（法32②）贈与税について申告書を提出した者に係る更正の請求期間は、法定申告期限から6年以内とする。問題6−8","lv":1}],"t":"《納税申告書》を提出した者又は《決定》を受けた者は、次のいずれかに該当する場合には、《〔3〕にかかわらず》、次の事実が確定した日又は更正等があった日の翌日から《2》月以内（《納税申告書を提出した者》については、その期間終了の日が〔3〕の《請求期限後に到来》する場合に限る。）に税務署長に対し、《更正の請求》をすることができる。"}]},{"no":"6-8","chap":"申告","ttl":"還付を受けるための申告及び還付","sub":"","secs":[{"n":"〔1〕","h":"還付を受けるための申告","st":0,"ref":"法27③、④、⑥、基通27－8","items":[{"mk":"⑴","h":"内　　容","ref":"","st":2,"t":"《相続時精算課税適用者》は、相続税の《期限内申告書を提出すべき場合のほか》、〔2〕⑴の規定による《還付を受けるため》、《相続開始の日の翌日から5年を経過する日まで還付を受けるための申告書》を《納税地の所轄税務署長》に《提出することができる》。","lv":1},{"mk":"⑵","h":"提出不要","ref":"","st":2,"t":"⑴の規定は、その《申告書の提出期限前》に相続税について《決定》があった場合には、《適用しない》。","lv":1},{"mk":"⑶","h":"書類添付","ref":"","st":1,"t":"《還付を受けるための申告書》を提出する場合には、一定の事項を記載した《明細書等を添付》しなければならない。","lv":1}],"t":""},{"n":"〔2〕","h":"還付","st":2,"ref":"法33の2①、④","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"税務署長は、《相続時精算課税適用財産に係る贈与税額》（《贈与税の外国税額控除前》の税額とし、《附帯税》を《除く》。）に相当する金額がある場合において、その金額を《相続税額から》控除してもなお《控除しきれなかった金額》があるときは、その《控除しきれなかった金額》（《贈与税の外国税額控除額》を《控除した残額》）に相当する税額を《還付する》。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"⑴の規定は、《〔1〕⑴の申告書》が提出された場合に限り、《適用する》。","lv":1}],"t":""},{"n":"〔3〕","h":"還付加算金","st":0,"ref":"","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"税務署長等は、還付金を還付する場合には、《⑵の期間の日数に応じ》、その金額に原則として年7≥3％の割合を乗じて計算した《還付加算金》をその《還付すべき金額に加算しなければならない》。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"還付加算金の計算の基礎となる期間は、次の区分に応じ《それぞれに定める日の翌日から還付のための支払決定等をする日まで》の期間とする。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"申告書が《基準日まで》に提出された場合…《基準日》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"申告書が《基準日後》に提出された場合…《提出日》\n※　基準日…被相続人の《相続開始日の翌日から10月を経過する日》問題6−9","lv":2}]}],"t":"（国通58①、法33の2②、③、⑦）　★"}]},{"no":"6-9","chap":"申告","ttl":"相続財産法人に係る相続財産の分与があった場合等の申告等（災害に関する規定を除く）","sub":"","secs":[{"n":"〔1〕","h":"遺贈により取得したものとみなす場合","st":2,"ref":"法4","items":[{"mk":"⑴","h":"相続財産法人に係る相続財産の分与","ref":"","st":0,"t":"《民法》の規定により《相続財産法人》に係る《相続財産の全部又は一部》を与えられた場合においては、その《与えられた者》が、その《与えられた時》におけるその《財産の時価》に相当する金額を《被相続人》から《遺贈》により取得したものとみなす。","lv":1},{"mk":"⑵","h":"特別寄与料の支払確定","ref":"","st":0,"t":"《特別寄与者》が支払を受けるべき《特別寄与料の額が確定》した場合においては、その《特別寄与者》が、その《特別寄与料の額》に相当する金額を《その特別寄与者による特別の寄与を受けた被相続人》から《遺贈》により取得したものと《みなす》。","lv":1}],"t":""},{"n":"〔2〕","h":"債務控除","st":2,"ref":"法13④、21の15②","items":[],"t":"《特別寄与者》が支払を受けるべき《特別寄与料の額》がその《特別寄与者》の《課税価格に算入される場合》においては、その《特別寄与料を支払うべき相続人》が《相続又は遺贈》（《包括遺贈》及び被相続人からの《相続人に対する遺贈》に限る。）《により取得した財産》及び《相続時精算課税適用財産》については、《課税価格に算入すべき価額》は、《相続時精算課税に係る基礎控除額》を控除後の《これら》の《財産の価額から》その《特別寄与料の額》のうち《その者の負担に属する部分の金額》を控除した金額による。"},{"n":"〔3〕","h":"相続税額の加算","st":2,"ref":"法18","items":[],"t":"《相続又は遺贈》により財産を取得した者が被相続人の《一親等の血族》（その被相続人の《直系卑属である代襲相続人》を含む。）《及び配偶者以外》の者である場合においては、その者に係る相続税額は、その者の《算出相続税額》に《その100分の20》に相当する金額を《加算》した金額とする。\n問題6−9"},{"n":"〔4〕","h":"手続規定","st":2,"ref":"法27②、⑥、29①、②、31②、③、32①七","items":[{"mk":"⑴","h":"期限内申告","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"相続財産分与の事由が生じた場合等\n〔1〕の事由が生じたため《新たに期限内申告書を提出すべき要件》に該当することとなった者は、その《事由が生じたことを知った日の翌日から10月以内》（その者がその期間内に《納税管理人の届出をしないで》法施行地に住所及び居所を有しないこととなるときは、その住所及び居所を《有しないこととなる日》まで。以下同じ。）に期限内申告書を納税地の所轄税務署長に《提出しなければならない》。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"提出義務の承継者\n①の規定により《期限内申告書》を《提出すべき者》がその申告書の提出期限前にその《申告書を提出しないで死亡》した場合には、その者の《相続人又は包括受遺者》は、その《相続開始を知った日の翌日から10月以内》に、その死亡した者の期限内申告書をその死亡した者の納税地の所轄税務署長に《提出しなければならない》。","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"提出を要しない場合\n①②の規定は、《期限内申告書の提出期限前》に相続税について《決定》があった場合には、適用しない。","lv":2}]},{"mk":"⑵","h":"修正申告","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《期限内申告書》又は《期限後申告書》を提出した者（相続税について《決定》を受けた者を含む｡）は、〔1〕の事由が生じたため《既に確定した相続税額に不足を生じた場合》には、その《事由が生じたことを知った日の翌日から10月以内》に修正申告書を納税地の所轄税務署長に《提出しなければならない》。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"①の規定は、《修正申告書の提出期限前》に相続税について《更正》があった場合には、適用しない。","lv":2}]},{"mk":"⑶","h":"更正の請求","ref":"","st":0,"t":"相続税について《申告書》を提出した者又は《決定》を受けた者は、〔1〕の事由によりその申告又は決定に係る《課税価格》及び《相続税額》が《過大となったとき》は、その事由が生じたことを知った日の翌日から《4月以内》に限り、納税地の所轄税務署長に更正の請求を《することができる》。","lv":1}],"t":""},{"n":"〔5〕","h":"納付","st":2,"ref":"法33","items":[],"t":"《期限内申告書》又は《修正申告書》を提出した者は、これらの《申告書の提出期限まで》にその申告書に記載した《税額を国に納付しなければならない》。"},{"n":"〔6〕","h":"その他","st":1,"ref":"法50②一","items":[],"t":"〔4〕⑵の申告書で提出期限内に提出されたものについては、《期限内申告書》とみなす。"}]},{"no":"7-1","chap":"納付","ttl":"延　　　納","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":0,"ref":"","items":[{"mk":"⑴","h":"内　　容","ref":"法38①、③","st":2,"t":"《税務署長》は、相続税又は贈与税の《申告書の提出》又は《更正》若しくは《決定を受けたこと》により《納付すべき相続税額》又は《贈与税額が10万円を超え》、かつ、《納期限まで》又は《納付すべき日》に《金銭で納付すること》を《困難とする事由がある場合》においては、《納税義務者の申請》により、その《納付を困難とする金額として一定の額を限度》として、年賦《延納の許可》を《することができる》。","lv":1},{"mk":"⑵","h":"延納期間","ref":"法38①、③、措法70の8の2①、70の10①","st":2,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"相続税","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《一般》の場合　《5年以内》","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"《不動産等》の割合が《10分の5以上》の場合\n…《不動産等》部分の相続税額　《15年以内》\n…《動産等》部分の相続税額　《10年以内》","lv":3},{"mk":"ハ","h":"","ref":"","st":0,"t":"《森林計画立木》の割合が《10分の2以上》であり、《かつ》、《不動産等》の割合が《10分の5以上》の場合\n…《森林計画立木》部分の相続税額　《20年以内》（《特定森林計画立木》部分の相続税額\nは《40年以内》）","lv":3},{"mk":"ニ","h":"","ref":"","st":0,"t":"《不動産等》の割合が《4分の3以上》の場合\n…《不動産等》部分の相続税額　《20年以内》","lv":3}]},{"mk":"②","h":"","ref":"","st":0,"t":"贈与税\n《5年以内》","lv":2}]},{"mk":"⑶","h":"相続税の延納期間の特則","ref":"法38①、措法70の8の2①、70の10①","st":2,"t":"《延納税額が50万円》（⑵①ロの場合には《150万円》、⑵①ハニの場合には《200万円》、《特定森林計画立木》の場合には《400万円》）《未満》であるときは、その延納期間は、《延納税額》を《10万円で除して得た数》（《1未満の端数切上》）に相当する年数を《超えることができない》。","lv":1},{"mk":"⑷","h":"相続税の延納年割額","ref":"法38②","st":1,"t":"延納年割額は、《延納税額》を《延納期間に相当する年数》で《除して計算》した金額（⑵①ロハニの場合には、延納税額を《不動産等に係る延納相続税額》と《動産等に係る延納相続税額》とに区分し、これらの税額を《それぞれの延納期間》に相当する年数で《除して計算した金額》）とする。","lv":1},{"mk":"⑸","h":"相続税の分納税額の特例","ref":"措法70の8の2②","st":1,"t":"《税務署長》は、課税相続財産の価額のうちに《森林計画立木》の価額の占める割合が《10分の2以上》であるときは、《森林計画立木部分の税額》については、《納税義務者の申請》により、その立木の《伐採時期及び材積を基礎》として《分納税額を定めることができる》。","lv":1},{"mk":"⑹","h":"担　　保","ref":"法38④","st":2,"t":"《税務署長》は、《延納の許可をする場合》には、延納税額に相当する《担保を徴さなければならない》。\nただし、その《延納税額が100万円以下》で、かつ、《延納期間が3年以下》である場合は、《この限りでない》。","lv":1}],"t":""},{"n":"〔2〕","h":"申請","st":2,"ref":"法39①、\u001a","items":[],"t":"《延納の許可を申請しようとする者》は、相続税又は贈与税の《納期限まで》又は《納付すべき日》に、一定の事項を記載した《申請書》に《担保提供関係書類》を添付し、これを《納税地の所轄税務署長》に《提出しなければならない》。"},{"n":"〔3〕","h":"延納申請の許可又は却下","st":1,"ref":"法39②、\u001a","items":[],"t":"《税務署長》は、《延納の申請書の提出があった場合》においては、調査に基づき、その申請書の提出期限の翌日から《3月以内》（その調査に《3月を超える期間を要する》と認めるときは《6月以内》）にその《申請に係る税額の全部又は一部》につきその《申請に係る条件》若しくは《これを変更した条件》により《延納の許可》をし、又はその《申請の却下をする》。ただし、延納の許可をする場合において、その申請者の提供しようとする《担保が適当でないと認めるとき》は、その《変更を求めることができる》。"},{"n":"〔4〕","h":"許可の取消し","st":2,"ref":"法40②","items":[],"t":"《税務署長》は、延納の許可を受けた者が、《延納税額の滞納その他延納》の《条件に違反》したとき、《担保変更の命令》に応じなかったとき、担保物につき《強制換価手続》が開始されたとき又は《延納の許可を受けた者が死亡し、その相続人が限定承認》をしたときは、その《許可を取り消すことができる》。"},{"n":"〔5〕","h":"利子税","st":1,"ref":"法52①","items":[],"t":"《延納の許可を受けた者》は、《分納税額を納付する場合》においては、その《延納税額を基礎》とし、一定の割合を乗じて算出した《利子税を併せて納付しなければならない》。"}]},{"no":"7-2","chap":"納付","ttl":"物納の要件等","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":0,"ref":"","items":[{"mk":"⑴","h":"内　　容","ref":"法41①","st":2,"t":"《税務署長》は、相続税の《申告書の提出》又は《更正》若しくは《決定を受けたこと》により《納付すべき相続税額》を《延納によっても金銭で納付すること》を《困難とする事由がある場合》においては、《納税義務者の申請》により、その《納付を困難とする金額として一定の額を限度》として、《物納の許可》をすることが《できる》。この場合において、物納財産の特徴により《一定の額を超える価額の物納財産を収納》することについて、《税務署長がやむを得ない事情があると認めるとき》は、その《一定の額を超えて》物納の許可をすることが《できる》。","lv":1},{"mk":"⑵","h":"物納財産","ref":"法41②、措法70の6の9③、70の7の3③、70の7の7③","st":2,"t":"物納財産は、《納税義務者の課税価格計算の基礎》となった財産（《その財産により取得した財産》を含み、《相続時精算課税適用財産》及び《相続又は遺贈により取得したものとみなされる特例受贈事業用資産》、《対象受贈非上場株式等》、《特例対象受贈非上場株式等》を除く。）で《法施行地にあるもの》のうち次に掲げるもの（《管理処分不適格財産》を除く。）とする。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《不動産》・《船舶》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"次に掲げる《有価証券》","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《国債証券》・《地方債証券》","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"《社債券》・《株券》・《証券投資信託》又は《貸付信託》の《受益証券》","lv":3},{"mk":"ハ","h":"","ref":"","st":0,"t":"《金融商品取引所》に《上場》されている《有価証券》で一定のもの","lv":3}]},{"mk":"③","h":"","ref":"","st":0,"t":"《動産》","lv":2}]},{"mk":"⑶","h":"物納順位","ref":"法41④、⑤","st":2,"t":"⑵の財産を物納に充てるときは、《税務署長において特別の事情があると認める場合を除き》、次の順位によることとし、納税義務者が物納の許可の《申請の際現に有するもの》のうちに《適当な価額のものがない場合》のみ《後順位の財産》を《物納に充てることができる》。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《不動産》・《船舶》及び《⑵②》に掲げる《有価証券》で《換価が容易》なもの","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"①のうち《物納劣後財産》","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"《社債券》・《株券》・《証券投資信託》又は《貸付信託》の《受益証券》（《①》に該当するものを除く。）","lv":2},{"mk":"④","h":"","ref":"","st":0,"t":"③のうち《物納劣後財産》","lv":2},{"mk":"⑤","h":"","ref":"","st":0,"t":"《動産》","lv":2}]},{"mk":"⑷","h":"物納の特例","ref":"措法70の12①","st":1,"t":"《税務署長》は、⑴に規定する納税義務者が物納の許可を申請しようとする場合において、その物納に充てようとする財産が《特定登録美術品》であるときは、その特定登録美術品については、《納税義務者の申請》により、《⑶にかかわらず》、《物納を許可》することが《できる》。","lv":1}],"t":""},{"n":"〔2〕","h":"収納価額","st":1,"ref":"法43①","items":[],"t":"物納財産の《収納価額》は、《課税価格計算の基礎となったその財産の価額》による。ただし、《税務署長》は、《収納の時まで》にその《財産の状況》に《著しい変化が生じたとき》は、《収納の時の現況》によりその財産の《収納価額を定めることができる》。"},{"n":"〔3〕","h":"納付時期","st":1,"ref":"法43②","items":[],"t":"《物納の許可を受けた税額》に相当する相続税は、《物納財産の引渡し》、《所有権の移転の登記》その他《法令により第三者に対抗することができる要件》を《充足した時》において、《納付があったものとする》。"},{"n":"〔4〕","h":"申請","st":2,"ref":"法42①、措法70の12②","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《物納の許可を申請しようとする者》は、相続税の《納期限まで》又は《納付すべき日》に、一定の事項を記載した《申請書》に《物納手続関係書類》を添付し、これを《納税地の所轄税務署長》に《提出しなければならない》。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"〔1〕⑷の規定の適用を受けようとする者は、⑴の《申請書》に一定の《書類》を添付し、これを《納税地の所轄税務署長》に《提出しなければならない》。","lv":1}],"t":""},{"n":"〔5〕","h":"物納申請の許可又は却下","st":0,"ref":"法42②、⑯、⑰、\u001a","items":[{"mk":"⑴","h":"許可又は却下","ref":"","st":1,"t":"《税務署長》は、物納の申請書の提出があった場合においては、調査に基づき、その《申請書の提出期限の翌日から3月以内》（《物納財産が多数であること等》によりその調査に《3月を超える期間を要する》と認めるときは《6月以内》、《積雪等》によりその調査に《6月を超える期間を要する》と認めるときは《9月以内》）にその《申請に係る税額の全部又は一部》につき《物納財産ごと》に《物納の許可》をし、又はその《申請の却下をする》。","lv":1},{"mk":"⑵","h":"条件付許可","ref":"","st":2,"t":"《税務署長》は、《物納の許可をする場合》において、物納財産の性質等により必要と認めるときは、《必要な限度》においてその《許可に条件を付することができる》。この場合において、その条件を《書面》によりその《申請者に通知する》。","lv":1}],"t":""},{"n":"〔6〕","h":"許可の取消し","st":2,"ref":"法48①、②","items":[],"t":"《税務署長》は、《〔5〕⑵の規定》により《物納の許可をした場合》において、一定の事項の《履行を求めるとき》は、《期限を定めて》その履行を求める旨等を記載した《書面》によりその《申請者に通知する》。その《期限まで》にその《履行がない場合》には、〔5〕⑵の規定による《通知をした日の翌日から5年を経過する日まで》に履行を求める通知をした場合に限り、《物納の許可》を《取り消すことができる》。"},{"n":"〔7〕","h":"物納の撤回","st":2,"ref":"法46①","items":[],"t":"《税務署長》は、物納の許可をした不動産のうちに《賃借権等が設定されている不動産》がある場合において、その《物納の許可を受けた者》が、その後物納に係る《相続税を金銭で一時に納付》し、又は《延納の許可を受けて納付するとき》は、その不動産については、その《収納後においても》、その《物納の許可を受けた日の翌日から1年以内》にされた《その者の申請》により、その《物納の撤回の承認》を《することができる》。ただし、その不動産が《換価されていたとき等》を《除く》。"},{"n":"〔8〕","h":"特定物納","st":0,"ref":"法48の2①、②、⑤","items":[{"mk":"⑴","h":"内　　容","ref":"","st":2,"t":"（注）《税務署長》は、《延納の許可を受けた者》について、《特定物納対象税額》を《変更された条件による延納》によっても《金銭で納付することを困難とする事由が生じた場合》においては、その者の《申請》により、特定物納対象税額のうちその《納付を困難とする金額として一定の額を限度》として《物納の許可》をすることが《できる》。\n（注）　特定物納対象税額…《延納税額》－《納期限の到来した》分納税額","lv":1},{"mk":"⑵","h":"申　　請","ref":"","st":2,"t":"《特定物納の許可を受けようとする者》は、その特定物納に係る《相続税の申告期限の翌日から10年を経過する日まで》に、一定の事項を記載した《申請書》に《物納手続関係書類》を添付し、これを《納税地の所轄税務署長》に《提出しなければならない》。","lv":1},{"mk":"⑶","h":"収納価額","ref":"","st":1,"t":"《特定物納》に係る財産の《収納価額》は、その《特定物納に係る申請時の価額》による。ただし、《税務署長》は、《収納の時まで》にその《財産の状況》に《著しい変化が生じたとき》は、《収納の時の現況》によりその財産の《収納価額を定めることができる》。","lv":1}],"t":""}]},{"no":"7-3","chap":"納付","ttl":"連帯納付","sub":"","secs":[{"n":"〔1〕","h":"相続人又は受遺者が2人以上いる場合の相続税","st":2,"ref":"法34①","items":[{"mk":"⑴","h":"内　　容","ref":"","st":0,"t":"同一の被相続人から《相続又は遺贈》（《相続時精算課税に係る贈与を含む》。以下〔1〕〔2〕において同じ。）により《財産を取得した全ての者》は、その《相続税》について、その《相続又は遺贈により受けた利益の価額》に相当する金額を《限度》として、《互いに連帯納付の責めに任ずる》。","lv":1},{"mk":"⑵","h":"連帯納付義務の解除","ref":"","st":0,"t":"次に掲げる者の区分に応じ、それぞれに定める相続税については、⑴の規定は適用しない。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"納税義務者の相続税について、《期限内申告書の提出期限又は納付すべき日等から5年を経過する日まで》に税務署長等が《連帯納付義務者》に対し、《納付通知書による通知を発していない場合》におけるその連帯納付義務者…その《納付すべき相続税額に係る相続税》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"納税義務者が《延納の許可を受けた場合》におけるその連帯納付義務者…その《延納の許可を受けた相続税額に係る相続税》","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"納税義務者の相続税について《納税の猶予がされた場合》におけるその連帯納付義務者…その《納税の猶予がされた相続税額に係る相続税》","lv":2}]}],"t":""},{"n":"〔2〕","h":"被相続人に係る相続税又は贈与税","st":2,"ref":"法34②","items":[],"t":"同一の被相続人から《相続又は遺贈》により《財産を取得した全ての者》は、その被相続人に係る《相続税》又は《贈与税》について、その《相続又は遺贈により受けた利益の価額》に相当する金額を《限度》として、《互いに連帯納付の責めに任ずる》。"},{"n":"〔3〕","h":"贈与、遺贈、寄附行為があった場合の連帯納付の義務","st":2,"ref":"法34③","items":[{"mk":"⑴","h":"相続税","ref":"","st":0,"t":"《贈与、遺贈又は寄附行為をし》\n%%《た者》のその財産を課税価格に×|その《財産の価額》|相続税の《課税価格に算入された財産の価額》\n算入した《相続税額》","lv":1},{"mk":"⑵","h":"贈与税","ref":"","st":0,"t":"《贈与、遺贈又は寄附行為をし》\n%%《た者》のその財産を課税価格に×|その《財産の価額》|贈与税の《課税価格に算入された財産の価額》\n算入した年分の《贈与税額》","lv":1}],"t":"相続税又は贈与税の《課税価格計算の基礎となった財産》につき《贈与》、《遺贈》又は《寄附行為による移転があった場合》においては、その《贈与》若しくは《遺贈により財産を取得した者》又はその《寄附行為により設立された法人》は、次の《相続税》又は《贈与税》について、その《受けた利益の価額》に相当する金額を《限度》として、《連帯納付の責めに任ずる》。"},{"n":"〔4〕","h":"財産の贈与者の連帯納付の義務","st":2,"ref":"法34④","items":[],"t":"《財産を贈与した者》は、次の《贈与税》について、その《財産の価額》に相当する金額を《限度》として、《連帯納付の責めに任ずる》。\n%%《贈与により財産を取得した者》のその財産を取得した年分の《贈与税額》×|その《財産の価額》|贈与税の《課税価格に算入された財産の価額》"}]},{"no":"7-4","chap":"納付","ttl":"農地等の贈与税の納税猶予及び免除","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":2,"ref":"措法70の4①、②","items":[],"t":"《農業を営む個人》で一定の者（以下「《贈与者》」という。）が、その農業の用に供している\n（注）《農地等》（《特定市街化区域農地等》その他一定のものを除く。）をその贈与者の《推定相続人》のうちの一人の者に《贈与した場合》（その贈与者が《既にこの》規定の《適用に係る贈与をしている場合》を《除く》。）には、その《農地等の贈与を受けた者》（以下「《受贈者》」という。）《の納付すべき贈与税額》のうち、その《農地等に係る納税猶予分の贈与税》については、《申告期限までに》その《贈与税額相当額》の《担保を提供》した場合に限り、《贈与者の死亡の日まで納税を猶予する》。\n（注）《　特定市街化区域農地等》とは、都市計画法に規定する《市街化区域内》に所在する農地等で一定のもの（《都市営農農地等を除く》。）をいう。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"措法70の4\u001a","items":[],"t":"この規定は、贈与税の《期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。"},{"n":"〔3〕","h":"継続届出書","st":1,"ref":"措法70の4\u001a、\u001a","items":[],"t":"受贈者は、《税務署長がやむを得ない事情があると認める場合を除き》、《申告期限の翌日から3年ごと》に、一定の事項を記載した《継続届出書》を《納税地の所轄税務署長》に《提出しなければならない》。"},{"n":"〔4〕","h":"納税猶予期限","st":0,"ref":"措法70の4①、④、⑤、\u001a、\u001a","items":[{"mk":"⑴","h":"原　　則","ref":"","st":2,"t":"《贈与者》の《死亡の日》","lv":1},{"mk":"⑵","h":"特　　則","ref":"","st":1,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"全部打ち切りの場合\n《⑴の日前》に《次の事由が生じた場合》には、《⑴の規定にかかわらず》、《次に掲げる日から2月を経過する日》（下記ニに該当した場合には、《その掲げる日》）まで《納税を猶予》し、受贈者が《納税猶予額》の《全額と利子税》を《納付しなければならない》。","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"農地等の《20％超の譲渡等》（《収用等を除く》。）をした場合…《譲渡等をした日》","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"《農業経営を廃止》した場合…《廃止の日》","lv":3},{"mk":"ハ","h":"","ref":"","st":0,"t":"《推定相続人》でなくなった場合…《推定相続人でなくなった日》","lv":3},{"mk":"ニ","h":"","ref":"","st":0,"t":"《納税猶予の適用を受けることをやめる旨を記載した届出書》を納税地の所轄税務署長に提出した場合…《届出書の提出があった日》","lv":3},{"mk":"ホ","h":"","ref":"","st":0,"t":"《継続届出書》が《提出期限までに提出されない》場合…《提出期限の翌日》","lv":3}]},{"mk":"②","h":"","ref":"","st":0,"t":"一部打ち切りの場合\n《⑴の日前》に《次の事由が生じた場合》には、《⑴の規定にかかわらず》、《次に掲げる日から2月を経過する日》まで《納税を猶予》し、受贈者が《納税猶予額》のうち《一定額と利子税》を《納付しなければならない》。","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"農地等の《20％以内の譲渡等》をした場合…《譲渡等をした日》","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"農地等の《収用等による譲渡等》をした場合…《譲渡等をした日》","lv":3},{"mk":"ハ","h":"","ref":"","st":0,"t":"《申告期限後10年を経過する日》において《農業の用に供していない準農地》がある場合…《10年を経過する日の翌日》","lv":3},{"mk":"ニ","h":"","ref":"","st":0,"t":"《都市営農農地等》について《生産緑地法の規定による買取りの申出等》があった場合…《申出等があった日の翌日》","lv":3},{"mk":"ホ","h":"","ref":"","st":0,"t":"農地等が《特定市街化区域農地等》となった場合…《告示があった日等の翌日》","lv":3}]}]}],"t":""},{"n":"〔5〕","h":"贈与税の免除","st":2,"ref":"措法70の4\u001a","items":[],"t":"《贈与者が死亡》したとき又はその《贈与者の死亡以前に受贈者が死亡》したときは、《納税猶予分の贈与税》は《免除する》。"},{"n":"〔6〕","h":"農地等の贈与者が死亡した場合の相続税の課税の特例","st":2,"ref":"措法70の5①","items":[],"t":"《農地等の贈与税の納税猶予があった場合》において、《受贈者の死亡前に贈与者が死亡》したときは、その贈与者の死亡に係る相続税については、その《受贈者》がその《農地等》をその《贈与者から相続又は遺贈》により《取得したものとみなす》。\nこの場合において、相続税の《課税価格に算入すべき農地等の価額》は、その《死亡の日における価額》による。"},{"n":"〔7〕","h":"相続時精算課税との関係","st":1,"ref":"措法70の4③","items":[],"t":"《相続時精算課税適用者等》がその者に係る《特定贈与者からの贈与により取得した農地等》について《〔1〕の規定の適用を受ける場合》には、その農地等については、《相続時精算課税》の規定は《適用しない》。"}]},{"no":"7-5","chap":"納付","ttl":"農地等の相続税の納税猶予及び免除","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":2,"ref":"措法70の6①","items":[],"t":"（注）《農業相続人》が《相続又は遺贈》によりその農業の用に供されていた《農地等》（《特定市街化区域農地等》その他一定のものを除く。）《の取得をした場合》（《農地等の贈与者が死亡した場合の相続税の課税の特例》の規定により、その贈与者から《相続又は遺贈》により《取得したとみなされる場合》を《含む》。）には、その《農業相続人》の《納付すべき相続税額》のうち、《この規定の適用を受けようとする農地等》（以下「《特例農地等》」という。）《に係る納税猶予分の相続税》については、《申告期限まで》にその《相続税額相当額》の《担保を提供》した場合に限り、《農業相続人の死亡の日等まで納税を猶予する》。\n（注）《　特定市街化区域農地等》とは、都市計画法に規定する《市街化区域内》に所在する農地等で一定のもの（《都市営農農地等を除く》。）をいう。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"措法70の6\u001a","items":[],"t":"この規定は、相続税の《期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。"},{"n":"〔3〕","h":"継続届出書","st":1,"ref":"措法70の6\u001a、\u001a","items":[],"t":"農業相続人は、《税務署長がやむを得ない事情があると認める場合を除き》、《申告期限の翌日から3年ごと》に、一定の事項を記載した《継続届出書》を《納税地の所轄税務署長》に《提出しなければならない》。"},{"n":"〔4〕","h":"未分割である場合","st":2,"ref":"措法70の6⑤","items":[],"t":"《申告期限まで》に、相続又は遺贈により取得した農地等の全部又は一部が分割されていない場合には、その《分割されていない農地等》は、その《申告書にこの規定の適用を受ける旨の記載》を《することができない》。"},{"n":"〔5〕","h":"納税猶予期限","st":0,"ref":"措法70の6①、⑥、⑦、⑧、\u001a、\u001a","items":[{"mk":"⑴","h":"原　　則","ref":"","st":2,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《農業相続人の死亡の日》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《特例農地等の全て》が《一定》の《市街化区域内農地等》である農業相続人については、その《死亡の日》と《申告期限の翌日から20年を経過する日》のいずれか《早い日》","lv":2},{"mk の相続税の納税猶予及び免除の規定》の適用を受けている《他の特例事業相続人等》がいる場合には、その《特定事業用資産》については、《適用しない》。"},{"n":"〔6〕","h":"免除","st":2,"ref":"措法70の6の8⑥、⑭、⑮","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《贈与者の死亡の時以前》に《特例事業受贈者が死亡》した場合","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《贈与者が死亡》した場合","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"《特定申告期限》（〔1〕の規定の適用を受ける《特例事業受贈者》の《最初》の《この規定の適用》に係る《贈与税の申告期限》又は《最初》の《個人の事業用資産の相続税の納税猶予及び免除の規定》の適用に係る《相続税の申告期限》の《いずれか早い日》をいう。）の《翌日から5年を経過する日後》に、《特例事業受贈者》が《特例受贈事業用資産》の《全て》につき《〔1〕の規定の適用》に係る《贈与》をした場合","lv":1},{"mk":"⑷","h":"","ref":"","st":0,"t":"《特例事業受贈者》が《事業を継続すること》が《できなくなった場合》（《やむを得ない理由》がある場合に《限る》。）","lv":1}],"t":"次に該当する場合には、一定の《贈与税を免除》する。\nこの場合において、《特例事業受贈者》又はその《相続人及び包括受遺者》は、《税務署長がやむを得ない事情があると認める場合を除き》、その《該当することとなった日》から《同日》（《⑶の場合》には、《贈与税の申告書》を《提出した日》）《以後6月を経過する日》までに、一定の事項を記載した《届出書》を《納税地の所轄税務署長》に提出しなければならない。"},{"n":"〔7〕","h":"事業用資産の贈与者が死亡した場合の相続税の課税の特例","st":2,"ref":"措法70の6の9①","items":[],"t":"《個人の事業用資産の贈与税の納税猶予があった場合》において、《特例事業受贈者の死亡前に贈与者が死亡》したときは、その贈与者の死亡に係る相続税については、その《特例事業受贈者》がその《特例受贈事業用資産》をその《贈与者から相続又は遺贈》により《取得したものとみなす》。\nこの場合において、相続税の《課税価格に算入すべき特例受贈事業用資産》の価額は、その《贈与の時における価額》による。"},{"n":"〔8〕","h":"相続時精算課税との関係","st":2,"ref":"措法70の2の7①","items":[],"t":"贈与により〔1〕の規定の適用に係る《特例受贈事業用資産》を取得した《特例事業受贈者》が《贈与者》の《直系卑属である推定相続人以外の者》（その《贈与者の孫》を除き、その《年1月1日》において《18歳以上》である者に《限る》。）であり、かつ、その《贈与者》が《同日において60歳以上》の者である場合には、その贈与によりその《特例受贈事業用資産》を取得した《特例事業受贈者》については、《相続時精算課税の規定》を準用する。"}]},{"no":"7-7","chap":"納付","ttl":"個人の事業用資産の相続税の納税猶予及び免除","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":2,"ref":"措法70の6の9①、70の6の10①、\u001a","items":[],"t":"《特定事業用資産を有していた個人》として一定の者（以下「《被相続人》」という。）から《相続又は遺贈》により《特定事業用資産の全て》（《数人の共有》に属する場合には、その《被相続人以外》の者が有していた部分を《除く》。）の《取得》（《平成31年1月1日》から《令和10年12月31日》までの間の《取得》で、《最初》の《この規定の適用》に係る《相続又は遺贈》及びその《取得の日等》から《1年を経過する日》までの《相続又は遺贈》による《取得に限る》ものとし、《事業用資産の贈与者が死亡した場合の相続税の課税の特例》の規定により、その《贈与者》から《相続又は遺贈》により《取得したものとみなされる》場合の《取得》を《含む》。）をした《特例事業相続人等》の《納付すべき相続税額》のうち、その《特定事業用資産》で《この規定の適用を受けるもの》（以下「《特例事業用資産》」という。）に係る《納税猶予分の相続税》については、《申告期限》までにその《相続税額相当額》の《担保を提供》した場合に《限り》、《特例事業相続人等》の《死亡の日》まで《納税を猶予》する。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"措法70の6の10⑨","items":[],"t":"この規定は、相続税の《期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。"},{"n":"〔3〕","h":"継続届出書","st":1,"ref":"措法70の6の10⑩、⑯","items":[],"t":"特例事業相続人等は、《税務署長がやむを得ない事情があると認める場合を除き》、《届出期限》までに、一定の事項を記載した《継続届出書》を《納税地の所轄税務署長》に《提出しなければならない》。"},{"n":"〔4〕","h":"未分割である場合","st":2,"ref":"措法70の6の10⑦","items":[],"t":"《申告期限》までに、《事業の用に供されていた資産》の《全部又は一部》が《分割されていない》場合には、《その分割されていない資産》は、その《申告書》に《この規定の適用を受ける旨》の記載をすることが《できない》。"},{"n":"〔5〕","h":"納税猶予期限","st":0,"ref":"措法70の6の10①、③、④、⑫、\u001a","items":[{"mk":"⑴","h":"原　　則","ref":"","st":2,"t":"《特例事業相続人等》の《死亡の日》","lv":1},{"mk":"⑵","h":"特　　則","ref":"","st":1,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"全部打ち切りの場合\n次の事由が生じた場合には、《〔1〕の規定にかかわらず》、《次に掲げる日から2月を経過する日》まで《納税を猶予》し、特例事業相続人等が《納税猶予額》の《全額と利子税》を《納付しなければならない》。","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《事業を廃止》した場合又は《破産手続開始の決定》があった場合…《事業を廃止》した日又は《決定》があった日","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"《資産保有型事業等》に《該当すること》となった場合…《該当すること》となった日","lv":3},{"mk":"ハ","h":"","ref":"","st":0,"t":"《特例事業相続人等》のその年のその事業に係る《事業所得の総収入金額》が《零》となった場合…《その年の12月31日》","lv":3},{"mk":"ニ","h":"","ref":"","st":0,"t":"《特例事業用資産》の《全て》が《特例事業相続人等》のその年の事業所得に係る《青色申告書》の《貸借対照表》に《計上されなくなった場合》…《その年の12月31日》","lv":3},{"mk":"ホ","h":"","ref":"","st":0,"t":"《青色申告》の《承認を取り消された場合》又は《青色申告書》の《提出をやめる旨》の《届出書》を《提出した場合》…《承認が取り消された日》又は《届出書の提出があった日》","lv":3},{"mk":"ヘ","h":"","ref":"","st":0,"t":"《納税猶予の適用を受けることをやめる旨を記載した届出書》を納税地の所轄税務署長に提出した場合…《届出書の提出》があった日","lv":3},{"mk":"ト","h":"","ref":"","st":0,"t":"《継続届出書》が《届出期限》までに《提出されない場合》…《届出期限の翌日》","lv":3},{"mk":"チ","h":"","ref":"","st":0,"t":"その他一定の場合…一定の日","lv":3}]},{"mk":"②","h":"","ref":"","st":0,"t":"一部打ち切りの場合\n《特例事業用資産》の《全部又は一部》が《特例事業相続人等》の《事業の用に供されなくなった場合》その他一定の場合には、《〔1〕の規定にかかわらず》、その一定の日から《2月を経過する日》まで《納税を猶予》し、特例事業相続人等が《納税猶予額》の《一定額と利子税》を《納付しなければならない》。","lv":2}]}],"t":""},{"n":"〔6〕","h":"適用除外","st":1,"ref":"措法70の6の10⑧","items":[],"t":"〔1〕の規定は、被相続人から相続又は遺贈により取得した特定事業用資産に係る事業と《同一の事業の用に供される資産》について、《〔1〕の規定の適用を受けている他の特例事業相続人等》 1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"全部打ち切りの場合\n《⑴の日前》に次の事由が生じた場合には、《⑴の規定にかかわらず》、《次に掲げる日から2月を経過する日》まで《納税を猶予》し、林業経営相続人が《納税猶予額》の《全額と利子税》を《納付しなければならない》。","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"《林業経営相続人》による《特定森林経営計画》に従った《特例山林の経営》が《適正かつ確実》に《行われていない場合》において農林水産大臣等から《納税地の所轄税務署長に通知》があったとき…その《通知があった日》","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"《林業経営相続人》が《20％を超える特例山林の譲渡等》をしたとき…農林水産大臣等から《納税地の所轄税務署長》に《その通知があった日》","lv":3},{"mk":"ハ","h":"","ref":"","st":0,"t":"特例山林に係る《山林の経営を廃止》した場合…その《廃止した日》","lv":3},{"mk":"ニ","h":"","ref":"","st":0,"t":"《林業経営相続人》のその《年分の山林所得に係る収入金額》が《零となった場合》…その《年の12月31日》","lv":3},{"mk":"ホ","h":"","ref":"","st":0,"t":"《納税猶予の適用を受けることをやめる旨》を記載した《届出書》を納税地の所轄税務署長に提出した場合…《届出書の提出があった日》","lv":3},{"mk":"ヘ","h":"","ref":"","st":0,"t":"《継続届出書》がその《届出期限》までに《提出されない場合》…《届出期限の翌日》","lv":3}]},{"mk":"②","h":"","ref":"","st":0,"t":"一部打ち切りの場合\n《納税猶予税額の全部につき納税猶予期限が確定する日まで》に、《林業経営相続人が特例山林の一部の譲渡等》をした場合等には、《⑴の規定にかかわらず》、農林水産大臣等から林業経営相続人の《納税地の所轄税務署長》に《譲渡等があった旨の通知があった日から2月を経過する日》まで《納税を猶予》し、林業経営相続人が《納税猶予額》のうち《一定額と利子税》を《納付しなければならない》。","lv":2}]}],"t":""},{"n":"〔7〕","h":"相続税の免除","st":2,"ref":"措法70の6の6⑰","items":[],"t":"《林業経営相続人が死亡》した場合には、納税猶予分の《相続税を免除する》。"}]},{"no":"7-9","chap":"納付","ttl":"非上場株式等の贈与税の納税猶予及び免除","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":2,"ref":"措法70の7①","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《Ａ＋Ｂ≧Ｃ×3分の2》……（《Ｃ×3分の2－Ｂ》）《以上》の認定贈与承継会社の非上場株式等の《贈与》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《Ａ＋Ｂ＜Ｃ×3分の2》……\u0007《贈与者が有していた》認定贈与承継会社の非上場株式等の《全ての》\n《贈与》\nＡ……《贈与直前》の《贈与者の保有株式数》\nＢ……《贈与直前》の《経営承継受贈者の保有株式数》\nＣ……《贈与直前》の《認定贈与承継会社の発行済株式総数》","lv":1}],"t":"《認定贈与承継会社》の《非上場株式等》を有していた個人で一定の者（その《認定贈与承継会社の非上場株式等》について《既にこの》規定の《適用に係る贈与をしているもの》を除く。以下「《贈与者》」という。）が、《経営承継受贈者》に《その認定贈与承継会社の非上場株式等》の贈与（《経営贈与承継期間の末日》までに《申告期限》が到来する《贈与》に限る。）をした場合において、その贈与が次の《それぞれに定める贈与》であるときは、その《経営承継受贈者の納付すべき贈与税額》のうち、その《非上場株式等》（《贈与時》におけるその《認定贈与承継会社の発行済株式総数の3分の2に達するまで》の部分として一定のものに限る。以下「《対象受贈非上場株式等》」という。）《に係る納税猶予分の贈与税》については、《申告期限までに》その《贈与税額相当額》の《担保を提供》した場合に限り、《贈与者の死亡の日まで納税を猶予する》。"},{"n":"〔2〕
