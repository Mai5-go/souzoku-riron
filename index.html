h":"","ref":"","st":0,"t":"受贈者が《贈与税の申告期限から認定医療法人の認定移行計画に記載された移行期限までの間》に認定医療法人の持分に基づき《出資額に応じた払戻しを受けた》場合…その《払戻しを受けた日》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"受贈者が《贈与税の申告期限から認定医療法人の認定移行計画に記載された移行期限までの間》に認定医療法人の《持分の譲渡》をした場合…その《譲渡をした日》","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"認定医療法人の《認定移行計画に記載された移行期限まで》に新医療法人への《移行をしなかった》場合…その《移行期限》","lv":1},{"mk":"⑷","h":"","ref":"","st":0,"t":"認定医療法人の《認定移行計画について厚生労働大臣認定が取り消された》場合…その厚生労働大臣認定が《取り消された日》","lv":1},{"mk":"⑸","h":"","ref":"","st":0,"t":"認定医療法人が《解散》をした場合（《⑹に該当する場合》を除く。）…その《解散をした日》","lv":1},{"mk":"⑹","h":"","ref":"","st":0,"t":"認定医療法人が《合併により消滅》をした場合（一定の場合を除く。）…その《消滅をした》","lv":1}],"t":"次の事由が生じた場合には、《〔1〕の規定にかかわらず》、《次に掲げる日から2月を経過する日》まで《納税を猶予》し、受贈者が《納税猶予額》の《全額と利子税》を《納付しなければならない》。"},{"n":"〔5〕","h":"贈与税の免除","st":2,"ref":"措法70の7の9⑪","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"受贈者が有している認定医療法人の《持分の全てを放棄した場合》…《納税猶予分の贈与税額》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"認定医療法人が《基金拠出型医療法人への移行をする場合》において、受贈者が有している認定医療法人の《持分の一部を放棄》し、その《残余の部分を基金拠出型医療法人の基金として拠出》したとき…《納税猶予分の贈与税額から》納税猶予分の贈与税額のうち《基金として拠出した額に対応する部分の金額に相当する贈与税》を《控除した残額》","lv":1}],"t":"認定医療法人の《認定移行計画に記載された移行期限まで》に次のいずれかに掲げる場合に該当することとなった場合には、次に掲げる区分に応じ《それぞれに定める金額に相当する贈与税》は《免除する》。"},{"n":"〔6〕","h":"受贈者が死亡した場合","st":1,"ref":"措法70の7の9⑬","items":[],"t":"〔1〕の規定の適用に係る《認定移行計画に記載された移行期限まで》に《受贈者が死亡した場合》には、その受贈者に係る納税猶予分の贈与税額に係る《納付の義務》は、その《受贈者》の《相続人及び包括受遺者》が《承継する》。"},{"n":"〔7〕","h":"贈与税の税額控除","st":2,"ref":"措法70の7の10①、④、⑤","items":[{"mk":"⑴","h":"内　　容","ref":"","st":0,"t":"贈与者がその《持分の全部又は一部の放棄》をしたことにより受贈者に対して《贈与税が課される場合》において、《受贈者》がその《放棄の時からその放棄による経済的利益に係る贈与税の申告期限までの間》にその有する認定医療法人の《持分の全部又は一部を放棄》したときは、その受贈者については《贈与税額から放棄相当贈与税額を控除した残額をもって》、その《納付すべき贈与税額》とする。","lv":1},{"mk":"⑵","h":"申告要件","ref":"","st":0,"t":"この規定は、《贈与税の期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、《適用する》。","lv":1},{"mk":"⑶","h":"適用除外","ref":"","st":0,"t":"⑴の規定の適用を受けようとする受贈者が、その贈与者による認定医療法人の《持分の放棄があった日から経済的利益に係る贈与税の申告期限までの間》に認定医療法人の持分に基づき《出資額に応じた払戻しを受けた場合》又はその《持分の譲渡をした場合》には、⑴の規定は、《適用しない》。","lv":1}],"t":""},{"n":"〔8〕","h":"相続時精算課税との関係","st":1,"ref":"措法70の7の9③、70の7の10③","items":[],"t":"《相続時精算課税適用者等》がその者に係る《特定贈与者が認定医療法人の持分を放棄したことにより経済的利益》について《〔1〕又は〔7〕の規定の適用を受ける場合》には、その《経済的利益》については《相続時精算課税》の規定は《適用しない》。"}]},{"no":"7-16","chap":"納付","ttl":"医療法人の持分の相続税の納税猶予及び免除並びに税額控除","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":2,"ref":"措法70の7の12①","items":[],"t":"個人が《経過措置医療法人》の《持分を有していた他の個人》から《相続又は遺贈によりその経過措置医療法人の持分を取得した場合》において、その《経過措置医療法人が相続税の申告期限において認定医療法人であるとき》は、その個人の《納付すべき相続税額》のうち、その《持分の価額に係る納税猶予分の相続税》については、《申告期限まで》にその《相続税額相当額の担保を提供》した場合に限り、《認定移行計画に記載された移行期限まで納税を猶予する。》"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"措法70の7の12⑧","items":[],"t":"この規定は、《相続税の期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、《適用する》。"},{"n":"〔3〕","h":"適用除外","st":2,"ref":"措法70の7の12③","items":[],"t":"〔1〕の規定の適用を受けようとする個人が、《相続開始の時から相続税の申告期限までの間》に経過措置医療法人の持分に基づき《出資額に応じた払戻しを受けた場合》若しくはその《持分の譲渡をした場合》又は《〔8〕の規定の適用を受ける場合》には、〔1〕の規定は、《適用しない》。"},{"n":"〔4〕","h":"未分割である場合","st":2,"ref":"措法70の7の12④","items":[],"t":"《申告期限まで》に、《経過措置医療法人の持分の全部又は一部が分割されていない場合》には、その《分割されていない持分》は、その《申告書にこの規定の適用を受ける旨の記載をすることができない》。"},{"n":"〔5〕","h":"納税猶予期限","st":1,"ref":"措法70の7の12⑤、⑫","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"個人が《相続税の申告期限から認定医療法人の認定移行計画に記載された移行期限までの間》に認定医療法人の持分に基づき《出資額に応じた払戻しを受けた》場合…その《払戻しを受けた日》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"個人が《相続税の申告期限から認定医療法人の認定移行計画に記載された移行期限までの間》に認定医療法人の《持分の譲渡》をした場合…その《譲渡をした日》","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"認定医療法人の《認定移行計画に記載された移行期限まで》に新医療法人への《移行をしなかった》場合…その《移行期限》","lv":1},{"mk":"⑷","h":"","ref":"","st":0,"t":"認定医療法人の《認定移行計画について厚生労働大臣認定が取り消された》場合…その厚生労働大臣認定が《取り消された日》","lv":1},{"mk":"⑸","h":"","ref":"","st":0,"t":"認定医療法人が《解散》をした場合（《⑹に該当する場合》を除く。）…その《解散をした日》","lv":1},{"mk":"⑹","h":"","ref":"","st":0,"t":"認定医療法人が《合併により消滅》をした場合（一定の場合を除く。）…その《消滅をした》","lv":1}],"t":"次の事由が生じた場合には、《〔1〕の規定にかかわらず》、《次に掲げる日から2月を経過する日》まで《納税を猶予》し、個人が《納税猶予額》の《全額と利子税》を《納付しなければならない》。"},{"n":"〔6〕","h":"相続税の免除","st":2,"ref":"措法70の7の12⑪","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"個人が有している認定医療法人の《持分の全てを放棄した場合》…《納税猶予分の相続税》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"認定医療法人が《基金拠出型医療法人への移行をする場合》において、個人が有している認定医療法人の《持分の一部を放棄》し、その《残余の部分を基金拠出型医療法人の基金として拠出》したとき…《納税猶予分の相続税額から》納税猶予分の相続税額のうち《基金として拠出した額に対応する部分の金額に相当する相続税》を《控除した残額》","lv":1}],"t":"認定医療法人の《認定移行計画に記載された移行期限まで》に次のいずれかに掲げる場合に該当することとなった場合には、次に掲げる区分に応じ《それぞれに定める金額に相当する相続税》は《免除する》。"},{"n":"〔7〕","h":"個人が死亡した場合","st":1,"ref":"措法70の7の12⑬","items":[],"t":"〔1〕の規定の適用に係る《認定移行計画に記載された移行期限まで》に《個人が死亡した場合》には、その個人に係る納税猶予分の相続税額に係る《納付の義務》は、その《個人》の《相続人及び包括受遺者》が《承継する》。"},{"n":"〔8〕","h":"相続税の税額控除","st":2,"ref":"措法70の7の13①、③、④","items":[{"mk":"⑴","h":"内　　容","ref":"","st":0,"t":"個人（以下「《相続人等》」という。）が被相続人から相続又は遺贈によりその《経過措置医療法人の持分》を取得した場合において、その《経過措置医療法人》が《相続開始の時において認定医療法人》（一定の経過措置医療法人を含む。）であり、かつ、その持分を取得した相続人等が《相続開始の時から相続税の申告期限までの間》にその有する経過措置医療法人で厚生労働大臣認定を受けたものの《持分の全部又は一部を放棄》したときは、その相続人等については、《相続税額から放棄相当相続税額を控除した残額》をもって、その《納付すべき相続税額》とする。","lv":1},{"mk":"⑵","h":"申告要件","ref":"","st":0,"t":"この規定は、《相続税の期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、《適用する》。","lv":1},{"mk":"⑶","h":"適用除外","ref":"","st":0,"t":"⑴の規定の適用を受けようとする相続人等が、《相続開始の時から相続税の申告期限までの間》に経過措置医療法人の持分に基づき《出資額に応じた払戻しを受けた場合》又は《その持分の譲渡をした場合》には、⑴の規定は、《適用しない》。","lv":1}],"t":""}]},{"no":"7-17","chap":"納付","ttl":"特定の美術品の相続税の納税猶予及び免除","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":2,"ref":"措法70の6の7①","items":[],"t":"《寄託先美術館》の《設置者》と《特定美術品の寄託契約》を締結し、《認定保存活用計画》に基づきその《特定美術品》をその《寄託先美術館》の《設置者に寄託していた者》から《相続又は遺贈》によりその《特定美術品》を取得した《寄託相続人》が、その《特定美術品》のその《寄託先美術館の設置者》への《寄託を継続する場合》には、その《寄託相続人の納付すべき相続税額》のうち、その《特定美術品に係る納税猶予分の相続税》については、《申告期限までに》その《相続税額相当額》の《担保を提供》した場合に限り、《寄託相続人の死亡の日》まで《納税を猶予》する。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"措法70の6の7⑧","items":[],"t":"この規定は、相続税の《期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。"},{"n":"〔3〕","h":"継続届出書","st":1,"ref":"措法70の6の7⑨、⑮","items":[],"t":"寄託相続人は、《税務署長がやむを得ない事情があると認める場合を除き》、《申告期限の翌日から3年ごと》に、一定の事項を記載した《継続届出書》を《納税地の所轄税務署長》に《提出しなければならない》。"},{"n":"〔4〕","h":"未分割である場合","st":2,"ref":"措法70の6の7⑦","items":[],"t":"《申告期限》までに、《特定美術品》が《分割されていない》場合には、その《分割されていない特定美術品》は、その申告書に《この規定の適用を受ける旨の記載》をすることができない。"},{"n":"〔5〕","h":"納税猶予期限","st":0,"ref":"措法70の6の7①、③、⑪、⑯","items":[{"mk":"⑴","h":"原　　則","ref":"","st":2,"t":"《寄託相続人》の《死亡の日》","lv":1},{"mk":"⑵","h":"特　　則","ref":"","st":1,"t":"次の事由が生じた場合には、《〔1〕の規定にかかわらず》、《次に掲げる日から2月を経過する日》まで《納税を猶予》し、寄託相続人が《納税猶予額》の《全額と利子税》を《納付しなければならない》。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《寄託相続人》が《特定美術品》を《譲渡》した場合…《譲渡があったこと》について、《文化庁長官から》の通知を《納税地の所轄税務署長》が《受けた日》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"特定美術品が《滅失》、《亡失》、《盗み取られた》場合…これらの事由が生じたことについて、《文化庁長官から》の通知を《納税地の所轄税務署長》が《受けた日》","lv":2},{"mk":"③","h":"","ref":"","st":0,"t":"特定美術品に係る《寄託契約》の《契約期間が終了》した場合…《終了の日》","lv":2},{"mk":"④","h":"","ref":"","st":0,"t":"特定美術品に係る《認定保存活用計画の認定》が《取り消された》場合…《認定が取り消された日》","lv":2},{"mk":"⑤","h":"","ref":"","st":0,"t":"特定美術品に係る《認定保存活用計画の計画期間が満了》した日から《4月を経過する日》において《新たな認定を受けていない》場合…《満了した日》から《4月を経過する日》","lv":2},{"mk":"⑥","h":"","ref":"","st":0,"t":"特定美術品について、《重要文化財の指定》が《解除された》場合又は《登録有形文化財の登録》が《抹消された》場合…《指定が解除された日》又は《登録が抹消された日》","lv":2},{"mk":"⑦","h":"","ref":"","st":0,"t":"《寄託先美術館》について、《登録を取り消された》場合又は《登録を抹消された》場合…《取り消された日》又は《抹消された日》","lv":2},{"mk":"⑧","h":"","ref":"","st":0,"t":"《継続届出書》が《届出期限》までに《提出されない》場合…《届出期限の翌日》","lv":2}]}],"t":""},{"n":"〔6〕","h":"免除","st":2,"ref":"措法70の6の7⑭","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《寄託相続人が死亡》した場合","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"寄託相続人が《寄託先美術館の設置者》に《特定美術品の贈与》をした場合","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"特定美術品が《災害により滅失》した場合","lv":1}],"t":"次に該当する場合には、納税猶予分の《相続税額は免除》する。"}]},{"no":"8-1","chap":"その他","ttl":"特定非常災害に関する特例","sub":"","secs":[{"n":"〔1〕","h":"課税価格の計算の特例","st":0,"ref":"","items":[{"mk":"⑴","h":"特定土地等及び特定株式等に係る相続税の課税価格の計算の特例","ref":"","st":0,"t":"\b（措法69の6①、②）　★★","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"一般の場合\n特定非常災害に係る《特定非常災害発生日前》に《相続又は遺贈》（被相続人からの《相続時精算課税に係る贈与を含む》。以下同じ。）により《財産を取得した者があり》、かつ、相続税の《期限内申告書の提出期限がその特定非常災害発生日以後である場合》において、その者がその《相続若しくは遺贈により取得した財産》又は《贈与により取得した財産》（その《特定非常災害発生日》の《属する年》（その《特定非常災害発生日》が《1月1日》から《贈与税の期限内申告書》の《提出期限》までの間にある場合には、その《前年》。《以下同じ》。）の《1月1日》からその《特定非常災害発生日》の《前日》までの間に取得したもので、《生前贈与加算》又は《相続時精算課税》の規定の適用を受けるものに《限る》。）でその《特定非常災害発生日において所有していたもの》のうちに《特定土地等》又は《特定株式等があるとき》は、その特定土地等又は特定株式等については、《相続税の課税価格に算入すべき価額》又は《相続税の課税価格に加算される贈与財産の価額》は、その《特定非常災害の発生直後の価額》とすることができる。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"相続財産分与の事由が生じた場合\n①の規定は、《特定非常災害発生日前》に民法の規定により《相続財産法人に係る相続財産の全部又は一部を与えられた者》があり、かつ、その相続財産の全部又は一部の遺贈に係る《期限内申告書》又は《修正申告書》の《提出期限がその特定非常災害発生日以後》である場合において、その相続財産の全部又は一部でその《特定非常災害発生日においてその者が所有していたもの》のうちに《特定土地等》又は《特定株式等があるとき》について準用する。","lv":2}]},{"mk":"⑵","h":"特定土地等及び特定株式等に係る贈与税の課税価格の計算の特例","ref":"","st":0,"t":"\b（措法69の7①）　★★\n個人が《特定非常災害発生日の属する年》の《1月1日から》その《特定非常災害発生日の前日まで》の間に《贈与により取得した財産》でその《特定非常災害発生日において所有していたもの》のうちに、《特定土地等》又は《特定株式等がある場合》には、その特定土地等又は特定株式等については、《贈与税の課税価格に算入すべき価額》は、その《特定非常災害の発生直後の価額》とすることができる。","lv":1},{"mk":"⑶","h":"申告要件","ref":"措法69の6③、69の7②","st":2,"t":"⑴⑵の規定は、《税務署長がやむを得ない事情があると認める場合を除き》、相続税又は贈与税の《期限内申告書》（《期限後申告書》及び《修正申告書》を含む。）又は《更正請求書》に一定の事項を記載した場合に限り、適用する。","lv":1}],"t":""},{"n":"〔2〕","h":"申告書の提出期限の特例","st":0,"ref":"","items":[{"mk":"⑴","h":"相続税の申告書の提出期限の特例","ref":"措法69の8①、②","st":2,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"一般の場合\n同一の被相続人から《相続又は遺贈により財産を取得した全ての者》のうちに《〔1〕⑴①の規定の適用を受けることができる者がいる場合》において、その《相続若しくは遺贈により財産を取得した者》又は《その相続人若しくは包括受遺者》が提出すべき相続税の《期限内申告書の提出期限が特定日》（国税通則法の規定により《延長》された《申告期限》と《特定非常災害発生日》の《翌日から10月を経過する日》との《いずれか遅い日》をいう。以下同じ。）《の前日以前であるとき》は、その《申告書の提出期限》は、《特定日とする》。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"相続財産分与の事由が生じた場合\n同一の被相続人から《遺贈により財産を取得した全ての者》のうちに《〔1〕⑴②の規定の適用を受けることができる者がいる場合》において、その《遺贈により財産を取得した者》又は《その相続人若しくは包括受遺者》が提出すべき相続税の《期限内申告書》又は《修正申告書の提出期限が特定日の前日以前であるとき》は、その《申告書の提出期限》は、《特定日とする》。","lv":2}]},{"mk":"⑵","h":"贈与税の申告書の提出期限の特例","ref":"措法69の8③、④","st":2,"t":"《特定非常災害発生日の属する年》の《1月1日から12月31日まで》の間に《贈与により財産を取得した個人》で《〔1〕⑵の適用を受けることができるもの》又は《その相続人若しくは包括受遺者》が提出すべき贈与税の《期限内申告書の提出期限が特定日の前日以前である場合》には、その《申告書の提出期限》は、《特定日とする》。","lv":1}],"t":""}]},{"no":"8-2","chap":"その他","ttl":"災害被害者に対する租税の減免、徴収猶予等に関する法律","sub":"","secs":[{"n":"〔1〕","h":"相続税又は贈与税の課税価格の計算","st":0,"ref":"","items":[{"mk":"⑴","h":"内　容","ref":"","st":0,"t":"相続 const KEY="souzoku-riron:v3";const mem={};
const store={
 async get(k){try{if(window.storage){const r=await window.storage.get(k);return r?r.value:null}}catch(e){}return k in mem?mem[k]:null},
 async set(k,v){mem[k]=v;try{if(window.storage)await window.storage.set(k,v)}catch(e){}}
};
let P={ok:{},quiz:{}},saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>store.set(KEY,JSON.stringify(P)),300)}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const kwm=s=>esc(s).replace(/《(.+?)》/g,'<span class="kw">$1</span>');
const stars=n=>n?"★".repeat(n):"";
const plain=s=>String(s).replace(/《|》/g,"");

/* 段落ID付与 */
RIRON.forEach(r=>{
  r.flat=[];
  r.secs.forEach((s,si)=>{
    s.id=r.no+":"+si; if(s.t) r.flat.push(s);
    const w=(arr,pid)=>arr.forEach((it,ii)=>{
      it.id=pid+":"+ii; if(it.t) r.flat.push(it);
      if(it.items) w(it.items,it.id);
    });
    w(s.items,s.id);
  });
});
const rDone=r=>r.flat.filter(x=>P.ok[x.id]).length;
const CHAPS=[...new Set(RIRON.map(r=>r.chap))];

/* 本文描画 */
function body(t){
  return t.split("\n").map(line=>{
    if(line.startsWith("%%")){
      const p=line.slice(2).split("|");
      return '<div class="frac-row">'+(p[0]?'<span>'+kwm(p[0])+'</span>':'')+
        '<span class="frac"><span class="n">'+kwm(p[1]||"")+'</span><span class="d">'+kwm(p[2]||"")+'</span></span></div>';
    }
    return '<p class="ln">'+kwm(line)+'</p>';
  }).join("");
}
/* てにをは骨格 */
const KEEP=/[ぁ-んー、。，．・（）「」〔〕]/;
function skel(t){
  const src=plain(t).replace(/^%%.*$/gm,"［算式］");
  let runs=[],cur="";
  for(const ch of src){
    if(KEEP.test(ch)) cur+=ch;
    else { if(cur.trim()){runs.push(cur)} cur=""; }
  }
  if(cur.trim())runs.push(cur);
  runs=runs.map(x=>x.trim()).filter(x=>x&&x!=="、"&&x!=="。");
  if(!runs.length)return '<span class="blank">（漢字のみ）</span>';
  return runs.map(esc).join('<span class="sep">/</span>');
}


/* ===== 復習スケジュール(忘却曲線・2週間で1周) ===== */
const DAY=86400000, LADDER=[1,2,4,7,11,14];
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const dayDiff=(a,b)=>Math.round((pd(a)-b)/DAY);
function initSched(){
  if(!P.sched)P.sched={};
  const t=today(),n=RIRON.length;
  RIRON.forEach((r,i)=>{
    if(P.sched[r.no])return;
    P.sched[r.no]={due:ds(new Date(t.getTime()+Math.floor(i*14/n)*DAY)),step:-1,seen:0};
  });
}
function grade(no,g){
  const s=P.sched[no]||{step:-1,seen:0};
  const base=(s.step==null||s.step<0)?-1:s.step;
  let step = g===0 ? 0 : Math.min(base+(g===2?2:1),LADDER.length-1);
  if(step<0)step=0;
  P.sched[no]={due:ds(new Date(today().getTime()+LADDER[step]*DAY)),step:step,seen:(s.seen||0)+1,last:ds(today())};
  save();
}
function dueList(){
  const t=today();
  return RIRON.map((r,i)=>({r:r,i:i,s:P.sched[r.no]}))
    .filter(x=>x.s&&dayDiff(x.s.due,t)<=0)
    .sort((a,b)=>dayDiff(a.s.due,t)-dayDiff(b.s.due,t)||a.i-b.i);
}
function nextIv(no,g){
  const s=P.sched[no]||{step:-1};
  const base=(s.step==null||s.step<0)?-1:s.step;
  return LADDER[g===0?0:Math.min(base+(g===2?2:1),LADDER.length-1)];
}
function renderToday(){
  const t=today(),list=dueList(),box=$("#todayBox");
  const late=list.filter(x=>dayDiff(x.s.due,t)<0).length;
  const donetoday=RIRON.filter(r=>P.sched[r.no]&&P.sched[r.no].last===ds(t)).length;
  let h='<div class="today-hd"><b>'+list.length+'</b><span>問が今日の対象'+(late?'（うち繰越 '+late+'）':'')+'</span></div>';
  h+='<p class="sect-note">全'+RIRON.length+'問を約2週間で1周します。1問終えたら手ごたえを押すと、次回の日程が自動で決まります。今日すでに '+donetoday+' 問を記録しました。</p>';
  const fc=[];
  for(let d=0;d<14;d++){
    const dd=new Date(t.getTime()+d*DAY);
    fc.push(RIRON.filter(r=>P.sched[r.no]&&P.sched[r.no].due===ds(dd)).length);
  }
  const mx=Math.max(1,...fc);
  h+='<div class="fc">'+fc.map((v,d)=>'<div'+(d===0?' data-t="1"':'')+' title="'+v+'問"><span style="height:'+(v/mx*100)+'%"></span></div>').join('')+'</div>';
  h+='<div class="fcx">'+fc.map((v,d)=>'<span>'+(d===0?'今日':(d%2===0?v:''))+'</span>').join('')+'</div>';
  h+='<p class="sect-note" style="margin-top:6px">これから14日間の予定件数</p>';
  if(!list.length){
    h+='<p class="empty">今日の分は終わりました。<br>先に進めたいときは、下の予定から前倒しで開けます。</p>';
  }
  list.forEach(x=>{
    const over=dayDiff(x.s.due,t);
    const done=x.s.last===ds(t);
    h+='<div class="due" data-late="'+(over<0?1:0)+'" data-done="'+(done?1:0)+'">';
    h+='<div class="due-top"><span class="no">'+esc(x.r.no)+'</span>';
    if(over<0)h+='<span class="tag">'+(-over)+'日遅れ</span>';
    else if(!x.s.seen)h+='<span class="tag new">初回</span>';
    h+='<span class="st">'+esc(x.r.chap)+'</span></div>';
    h+='<span class="tt">'+esc(x.r.ttl)+'</span>';
    h+='<div class="acts"><button class="open" data-go="'+x.i+'">開く</button>'+
       '<button class="g0" data-g="0" data-no="'+x.r.no+'">あやふや<em>'+nextIv(x.r.no,0)+'日後</em></button>'+
       '<button class="g1" data-g="1" data-no="'+x.r.no+'">まあまあ<em>'+nextIv(x.r.no,1)+'日後</em></button>'+
       '<button class="g2" data-g="2" data-no="'+x.r.no+'">完璧<em>'+nextIv(x.r.no,2)+'日後</em></button></div>';
    h+='</div>';
  });
  box.innerHTML=h;
  box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    cur=+b.dataset.go;chap=null;OPEN={};TOPEN={};render();show("riron")});
  box.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    grade(b.dataset.no,+b.dataset.g);renderToday();renderRate()});
}
function renderRate(){
  const r=RIRON[cur],s=P.sched[r.no]||{},box=$("#rateBox");
  const t=today();
  let nx='';
  if(s.due){const d=dayDiff(s.due,t);nx=d<0?('予定日を'+(-d)+'日過ぎています'):d===0?'今日が予定日です':('次回は'+d+'日後（'+s.due+'）');}
  let h='<h4>'+esc(r.no)+' の手ごたえを記録</h4><p>'+esc(nx)+(s.seen?('　/　'+s.seen+'回目'):'　/　未記録')+'</p>';
  h+='<div class="acts">'+
     '<button class="g0" data-g="0">あやふや<em>'+nextIv(r.no,0)+'日後</em></button>'+
     '<button class="g1" data-g="1">まあまあ<em>'+nextIv(r.no,1)+'日後</em></button>'+
     '<button class="g2" data-g="2">完璧<em>'+nextIv(r.no,2)+'日後</em></button></div>';
  box.innerHTML=h;
  box.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    grade(r.no,+b.dataset.g);renderRate();renderToday();buildChips();
    box.scrollIntoView({block:"center"});});
}

let cur=0, chap=null, OPEN={}, TOPEN={};
function inChap(){return RIRON.map((r,i)=>[r,i]).filter(([r])=>!chap||r.chap===chap)}
function buildChips(){
  [["#chapChips","#picker"],["#chapChips2","#picker2"]].forEach(([ca,pa])=>{
    const cb=$(ca);cb.innerHTML="";
    const mk=(k,label)=>{const b=document.createElement("button");b.className="pk";b.textContent=label;
      b.setAttribute("aria-pressed",String(chap===k));
      b.onclick=()=>{chap=k;buildChips()};cb.appendChild(b)};
    mk(null,"全分野");CHAPS.forEach(c=>mk(c,c));
    const pb=$(pa);pb.innerHTML="";
    inChap().forEach(([r,i])=>{
      const b=document.createElement("button");b.className="pk num";b.textContent=r.no;
      b.setAttribute("aria-pressed",String(i===cur));
      b.dataset.done=(r.flat.length&&rDone(r)===r.flat.length)?"1":"0";
      b.onclick=()=>{cur=i;OPEN={};TOPEN={};render();window.scrollTo({top:0})};
      pb.appendChild(b);
    });
  });
}
function head(r){
  let h='<div class="rhead"><span class="chap">'+esc(r.chap)+'</span>';
  h+='<div class="no"><small>問題</small>'+esc(r.no)+'</div>';
  h+='<div class="ttl">'+esc(r.ttl)+'</div>';
  if(r.sub)h+='<div class="sub">'+esc(r.sub)+'</div>';
  return h+'</div>';
}
function itemHTML(it,lv){
  const open=OPEN[it.id]?1:0,ok=P.ok[it.id]?1:0;
  let h='<div class="pi" data-lv="'+lv+'" data-open="'+open+'" data-ok="'+ok+'" data-id="'+it.id+'">';
  h+='<button class="pi-h" data-t="1"><span class="mk">'+esc(it.mk||"")+'</span>';
  h+=it.h?'<span class="hd">'+esc(it.h)+'</span>':'<span class="hd plain">本文</span>';
  if(it.ref)h+='<span class="ref">('+esc(it.ref)+')</span>';
  if(it.st)h+='<span class="st">'+stars(it.st)+'</span>';
  if(ok)h+='<span class="ok">✓</span>';
  h+='</button>';
  if(open){
    h+='<div class="pi-b">';
    if(it.t)h+=body(it.t);
    if(it.items)it.items.forEach(c=>h+=itemHTML(c,Math.min(lv+1,4)));
    if(it.t)h+='<div class="pi-act"><button data-ok="'+it.id+'" class="'+(ok?"on":"")+'">'+(ok?"✓ 言えた":"言えた")+'</button></div>';
    h+='</div>';
  }
  return h+'</div>';
}
function renderRiron(){
  const r=RIRON[cur];
  let h=head(r);
  const tot=r.flat.length,dn=rDone(r);
  h+='<div class="rmeter"><span>段落 '+tot+'</span><span>言えた <b>'+dn+' / '+tot+'</b></span></div>';
  h+='<div class="bar"><span style="width:'+(tot?dn/tot*100:0)+'%"></span></div>';
  h+='<div class="ctrl"><button id="cSheet" aria-pressed="'+(document.body.dataset.sheet==="1")+'">赤シート</button>'+
     '<button id="cOpen">すべて開く</button><button id="cClose">すべて閉じる</button></div>';
  r.secs.forEach(s=>{
    h+='<div class="sec"><div class="sec-h"><span class="n">'+esc(s.n)+'　'+esc(s.h)+'</span>';
    if(s.ref)h+='<span class="ref">('+esc(s.ref)+')</span>';
    if(s.st)h+='<span class="st">'+stars(s.st)+'</span>';
    h+='</div>';
    if(s.t)h+=itemHTML({id:s.id,mk:"",h:"",t:s.t,ref:"",st:0},1);
    s.items.forEach(it=>h+=itemHTML(it,1));
    h+='</div>';
  });
  $("#rironBox").innerHTML=h;
  $("#cSheet").onclick=e=>{const on=document.body.dataset.sheet==="1";document.body.dataset.sheet=on?"0":"1";
    e.currentTarget.setAttribute("aria-pressed",String(!on))};
  $("#cOpen").onclick=()=>{r.flat.forEach(x=>OPEN[x.id]=true);
    const w=a=>a.forEach(z=>{OPEN[z.id]=true;if(z.items)w(z.items)});r.secs.forEach(s=>w(s.items));renderRiron()};
  $("#cClose").onclick=()=>{OPEN={};renderRiron()};
  $("#rironBox").querySelectorAll(".pi").forEach(el=>{
    const id=el.dataset.id;
    el.querySelector(":scope > .pi-h").onclick=e=>{e.stopPropagation();OPEN[id]=!OPEN[id];renderRiron()};
  });
  $("#rironBox").querySelectorAll("[data-ok]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();const id=b.dataset.ok;
    if(P.ok[id])delete P.ok[id];else P.ok[id]=1;save();renderRiron();buildChips()});
  $("#rironBox").querySelectorAll(".kw").forEach(k=>k.onclick=e=>{e.stopPropagation();k.classList.toggle("on")});
}
/* てにをは */
let TWH=false;
function twItem(it,lv){
  let h='<div class="tw" data-lv="'+lv+'">';
  h+='<div class="tw-h"><span class="mk">'+esc(it.mk||"")+'</span><span class="sk" data-id="'+it.id+'">';
  if(it.h&&TWH)h+='<span class="hd">'+esc(it.h)+'</span>　';
  h+=it.t?skel(it.t):(it.h&&!TWH?'<span class="blank">＿＿＿</span>':'');
  h+='</span></div>';
  if(TOPEN[it.id]&&(it.t||it.h)){
    h+='<div class="full">';
    if(it.h)h+='<div class="fh">'+esc(it.h)+(it.ref?'（'+esc(it.ref)+'）':'')+'</div>';
    if(it.t)h+=body(it.t);
    h+='</div>';
  }
  h+='</div>';
  if(it.items)it.items.forEach(c=>h+=twItem(c,Math.min(lv+1,4)));
  return h;
}
function renderTW(){
  const r=RIRON[cur];
  let h=head(r);
  h+='<div class="ctrl"><button id="tHead" aria-pressed="'+TWH+'">見出しを出す</button><button id="tAll">全部の本文を出す</button><button id="tNone">全部隠す</button></div>';
  r.secs.forEach(s=>{
    h+='<div class="twsec">'+esc(s.n)+(TWH?'　'+esc(s.h):'　<span class="blank">＿＿＿</span>')+(s.st?'　'+stars(s.st):'')+'</div>';
    if(s.t)h+=twItem({id:s.id,mk:"",h:"",t:s.t},1);
    s.items.forEach(it=>h+=twItem(it,1));
  });
  $("#twBox").innerHTML=h;
  $("#tHead").onclick=()=>{TWH=!TWH;renderTW()};
  $("#tAll").onclick=()=>{r.flat.forEach(x=>TOPEN[x.id]=true);
    const w=a=>a.forEach(z=>{TOPEN[z.id]=true;if(z.items)w(z.items)});r.secs.forEach(s=>w(s.items));renderTW()};
  $("#tNone").onclick=()=>{TOPEN={};renderTW()};
  $("#twBox").querySelectorAll(".sk").forEach(el=>el.onclick=()=>{
    const id=el.dataset.id;TOPEN[id]=!TOPEN[id];renderTW()});
  $("#twBox").querySelectorAll(".kw").forEach(k=>k.onclick=e=>{e.stopPropagation();k.classList.toggle("on")});
}
function render(){buildChips();renderRiron();renderTW();renderRate()}
const step=d=>{const l=inChap();let k=l.findIndex(([r,i])=>i===cur);k=(k+d+l.length)%l.length;
  cur=l[k][1];OPEN={};TOPEN={};render();window.scrollTo({top:0})};
$("#pPrev").onclick=()=>step(-1);$("#pNext").onclick=()=>step(1);
$("#tPrev").onclick=()=>step(-1);$("#tNext").onclick=()=>step(1);
/* タブ */
$$(".tab").forEach(t=>t.onclick=()=>show(t.dataset.view));
function show(v){
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===v)));
  $$(".panel").forEach(p=>p.hidden=(p.id!=="v-"+v));
  if(v==="today")renderToday();
  if(v==="list")renderList();
  if(v==="stats")renderStats();
  window.scrollTo({top:0});
}
/* 一覧 */
$("#q").addEventListener("input",renderList);
function renderList(){
  const q=$("#q").value.trim(),box=$("#listBox");box.innerHTML="";
  if(q){
    let n=0;
    RIRON.forEach((r,ri)=>r.flat.forEach(x=>{
      const txt=plain((x.h||"")+" "+(x.t||""));
      const pos=txt.indexOf(q);if(pos<0)return;n++;
      const s=Math.max(0,pos-22);
      const frag=(s>0?"…":"")+esc(txt.slice(s,pos))+"<mark>"+esc(q)+"</mark>"+esc(txt.slice(pos+q.length,pos+q.length+38))+"…";
      const w=document.createElement("div");
      w.innerHTML='<button class="li"><span class="no">'+esc(r.no)+'</span><span class="tt">'+esc(x.h||r.ttl)+'</span></button><div class="hit">'+frag+'</div>';
      w.querySelector("button").onclick=()=>{cur=ri;OPEN={};OPEN[x.id]=true;render();show("riron")};
      box.appendChild(w);
    }));
    if(!n)box.innerHTML='<p class="empty">該当する本文がありません。</p>';
    return;
  }
  CHAPS.forEach(c=>{
    const g=document.createElement("div");g.className="chapgrp";g.innerHTML='<h3>'+esc(c)+'</h3>';
    RIRON.forEach((r,ri)=>{
      if(r.chap!==c)return;
      const b=document.createElement("button");b.className="li";
      b.innerHTML='<span class="no">'+esc(r.no)+'</span><span class="tt">'+esc(r.ttl)+'</span><span class="pg">'+rDone(r)+'/'+r.flat.length+'</span>';
      b.onclick=()=>{cur=ri;OPEN={};render();show("riron")};
      g.appendChild(b);
    });
    box.appendChild(g);
  });
}
/* クイズ */
let qi=0,si=0,state="run",pick0=-1;
function renderCase(){
  if(typeof QUIZ==="undefined"||!QUIZ.length){$("#caseBox").innerHTML='<p class="empty">事例がありません。</p>';return}
  const c=QUIZ[qi];let h='<div class="cat">CASE '+String(qi+1).padStart(2,"0")+' / '+QUIZ.length+'</div><h3>'+esc(c.t)+'</h3>'+
    '<p class="sit">'+esc(c.s)+'</p><div class="steps">';
  c.st.forEach((_,i)=>{let s="";if(i<si)s="ok";else if(i===si&&state==="run")s="now";else if(i===si&&state==="ng")s="ng";
    h+='<i'+(s?' data-s="'+s+'"':'')+'></i>'});
  h+='</div>';
  const cu=c.st[Math.min(si,c.st.length-1)];
  h+='<p class="qtext">'+esc(cu.q)+'</p><div class="opts">';
  cu.o.forEach((o,i)=>{
    if(state==="run")h+='<button class="opt" data-i="'+i+'">'+esc(o)+'</button>';
    else{const r=(i===cu.a)?"ok":(i===pick0?"ng":"");h+='<button class="opt" disabled'+(r?' data-r="'+r+'"':'')+'>'+esc(o)+'</button>'}
  });
  h+='</div>';
  if(state!=="run")h+='<div class="note">'+cu.n+'</div><p class="verdict" data-v="'+(state==="ok"?"ok":"ng")+'">'+
    (state==="ok"?"全問正解 — 突破":"ここで不正解")+'</p>';
  $("#caseBox").innerHTML=h;
  $("#caseBox").querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;pick0=i;
    if(i===cu.a){if(si===c.st.length-1){state="ok";P.quiz[c.id]="ok";save()}else si++}
    else{state="ng";P.quiz[c.id]="ng";save()}
    renderCase();});
}
$("#btnRetry").onclick=()=>{si=0;state="run";pick0=-1;renderCase()};
$("#btnNextCase").onclick=()=>{qi=(qi+1)%QUIZ.length;si=0;state="run";pick0=-1;renderCase()};
/* 記録 */
function renderStats(){
  $("#sR").textContent=RIRON.length;
  $("#sP").textContent=Object.keys(P.ok).length;
  $("#sT").textContent=RIRON.reduce((a,r)=>a+r.flat.length,0);
  $("#sQ").textContent=Object.values(P.quiz).filter(v=>v==="ok").length;
  const g=$("#gauges");g.innerHTML="";
  RIRON.forEach((r,i)=>{
    const t=r.flat.length,d=rDone(r);
    const el=document.createElement("div");el.className="gauge";
    el.innerHTML='<div class="g-top"><span>'+esc(r.no)+'　'+esc(r.ttl)+'</span><em>'+d+' / '+t+'</em></div>'+
      '<div class="g-bar"><span style="width:'+(t?d/t*100:0)+'%"></span></div>';
    el.onclick=()=>{cur=i;OPEN={};render();show("riron")};
    g.appendChild(el);
  });
}
$("#btnReset").onclick=()=>{if(!confirm("学習記録をすべて消します。よろしいですか。"))return;
  P={ok:{},quiz:{},sched:{}};initSched();save();render();renderToday();renderStats()};
(async()=>{
  const raw=await store.get(KEY);
  if(raw){try{const o=JSON.parse(raw);P={ok:o.ok||{},quiz:o.quiz||{},sched:o.sched||{}}}catch(e){}}
  initSched();save();render();renderToday();renderCase();
})();
</script>
</body>
</html>
