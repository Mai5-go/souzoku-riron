<title>相続税法 理論道場</title>
<meta name="description" content="税理士試験・相続税法の理論を、柱・てにをはから丸暗記するアプリ。">
<style>
:root{
  --ink:#0D1729;--ink-2:#14213A;--ink-3:#1B2B49;
  --raise:rgba(255,255,255,.035);--raise2:rgba(255,255,255,.06);
  --gold:#C9A24A;--gold-soft:#E3C685;--paper:#EDE7DA;--muted:#8FA0BA;
  --jade:#5FAE8C;--suou:#C9647A;--kw:#F0A2AC;--kwmask:rgba(226,120,140,.34);
  --line:rgba(201,162,74,.22);--glow:rgba(201,162,74,.10);
  --mincho:"Hiragino Mincho ProN","HiraMinProN-W3","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",Meiryo,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root{
    --ink:#FFFFFF;--ink-2:#FFFFFF;--ink-3:#FBF9F5;
    --raise:rgba(0,0,0,.035);--raise2:rgba(0,0,0,.06);
    --gold:#9A7A2C;--gold-soft:#6E5518;--paper:#000000;--muted:#555F6B;
    --jade:#1C7A52;--suou:#B02A44;--kw:#D0021B;--kwmask:rgba(208,2,27,.22);
    --line:rgba(0,0,0,.2);--glow:rgba(201,162,74,.06);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);background-image:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 60%);
  color:var(--paper);font-family:var(--gothic);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(70px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.wrap{max-width:700px;margin:0 auto;padding:0 16px}
header{padding:20px 0 10px;text-align:center}
.crest{width:28px;height:28px;margin:0 auto 8px;position:relative}
.crest i{position:absolute;inset:0;border:1px solid var(--gold);transform:rotate(45deg);opacity:.85}
.crest i:nth-child(2){inset:8px;background:var(--gold);border:0;opacity:.9}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.28em;color:var(--gold);opacity:.8;margin:0}
h1{font-family:var(--mincho);font-size:27px;letter-spacing:.14em;margin:6px 0 4px;font-weight:600}
.lede{color:var(--muted);font-size:12px;margin:0}
nav{position:sticky;top:env(safe-area-inset-top);z-index:30;background:var(--ink);border-bottom:1px solid var(--line);margin-top:12px}
.tabs{display:flex;gap:2px;max-width:700px;margin:0 auto;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;color:var(--muted);font-family:var(--gothic);font-size:13px;
  padding:12px 11px 10px;letter-spacing:.04em;cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--gold-soft);border-bottom-color:var(--gold);font-weight:600}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
main{padding-top:16px}
.panel[hidden]{display:none}
.sect-note{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.8}
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:10px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.pk{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:2px;
  padding:6px 12px;font-size:12px;cursor:pointer;letter-spacing:.04em;position:relative;font-family:var(--gothic);white-space:nowrap}
.pk.num{font-family:var(--mono)}
.pk[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--ink);font-weight:700}
.pk[data-done="1"]::after{content:"";position:absolute;top:-3px;right:-3px;width:6px;height:6px;background:var(--jade);transform:rotate(45deg)}
.pk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rhead{border-top:3px solid var(--paper);border-bottom:3px solid var(--paper);padding:11px 2px;margin-bottom:6px;position:relative}
.rhead .chap{position:absolute;top:-10px;right:0;background:var(--ink);padding:0 8px;font-family:var(--mincho);font-size:11.5px;letter-spacing:.2em;color:var(--gold-soft)}
.rhead .no{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;color:var(--paper)}
.rhead .no small{font-size:11px;letter-spacing:.2em;font-weight:400;margin-right:8px;vertical-align:middle;font-family:var(--mincho)}
.rhead .ttl{font-family:var(--mincho);font-size:16.5px;line-height:1.6;margin-top:6px;letter-spacing:.02em}
.rhead .sub{font-family:var(--mincho);font-size:12.5px;color:var(--muted);margin-top:2px}
.rmeter{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;margin:9px 0 5px}
.rmeter b{color:var(--gold-soft);font-weight:500}
.bar{height:2px;background:var(--raise2);margin-bottom:16px}
.bar span{display:block;height:100%;background:var(--gold);transition:width .3s}
.ctrl{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.ctrl button{flex:1;min-width:90px;background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:9px 4px;font-size:12px;font-family:var(--gothic);cursor:pointer;border-radius:2px}
.ctrl button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-soft);background:var(--raise);font-weight:600}
.ctrl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--paper);padding:5px 11px;margin-bottom:11px;background:var(--raise)}
.sec-h .n{font-family:var(--mincho);font-size:15px;letter-spacing:.1em;font-weight:600}
.sec-h .ref{font-family:var(--mincho);font-size:11px;color:var(--muted)}
.sec-h .st{font-size:12px;color:var(--gold);margin-left:auto}
.pi{margin-bottom:6px}
.pi-h{width:100%;text-align:left;background:var(--raise);border:0;border-left:2px solid var(--line);color:inherit;
  font-family:inherit;cursor:pointer;padding:9px 11px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.pi-h:hover{border-left-color:var(--gold)}
.pi-h:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.pi[data-lv="2"]{margin-left:14px}.pi[data-lv="3"]{margin-left:28px}.pi[data-lv="4"]{margin-left:42px}
.pi[data-open="1"] .pi-h{background:var(--raise2);border-left-color:var(--gold)}
.pi[data-ok="1"] .pi-h{border-left-color:var(--jade)}
.pi-h .mk{font-family:var(--mono);font-size:12px;color:var(--gold);flex:0 0 auto;min-width:22px}
.pi-h .hd{font-family:var(--mincho);font-size:15px;font-weight:600;letter-spacing:.03em}
.pi-h .hd.plain{font-weight:400;color:var(--muted);font-size:13px}
.pi-h .ref{font-family:var(--mincho);font-size:11px;color:var(--muted)}
.pi-h .st{font-size:11px;color:var(--gold);margin-left:auto}
.pi-h .ok{color:var(--jade);font-size:12px;margin-left:5px}
.pi-b{padding:11px 10px 3px 13px;border-left:2px solid var(--line);animation:rise .2s ease}
@keyframes rise{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.ln{margin:0 0 .35em;font-family:var(--mincho);font-size:15.5px;line-height:2.0;letter-spacing:.01em;text-indent:1em}
.frac-row{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin:.6em 0;font-family:var(--mincho);font-size:13px}
.frac{display:inline-flex;flex-direction:column;text-align:center}
.frac .n{border-bottom:1px solid var(--paper);padding:0 6px 1px}
.frac .d{padding:1px 6px 0}
.kw{color:var(--kw)}
body[data-sheet="1"] .kw{background:var(--kwmask);color:transparent;border-radius:2px;cursor:pointer}
body[data-sheet="1"] .kw.on{background:transparent;color:var(--kw)}
.pi-act{display:flex;gap:8px;margin:9px 0 3px}
.pi-act button{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:11.5px;padding:6px 14px;border-radius:2px;cursor:pointer;font-family:var(--gothic)}
.pi-act button.on{border-color:var(--jade);color:var(--jade);background:var(--raise2);font-weight:600}
.pager{display:flex;gap:9px;margin-top:22px}
.pager button{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);padding:12px;font-size:13px;font-family:var(--gothic);cursor:pointer;border-radius:2px}
/* てにをは */
.tw{margin-bottom:5px}
.tw-h{display:flex;gap:8px;align-items:baseline}
.tw .mk{font-family:var(--mono);font-size:12.5px;color:var(--gold);flex:0 0 30px}
.tw .sk{flex:1;font-family:var(--mincho);font-size:15px;line-height:2.2;letter-spacing:.02em;
  border-bottom:1px solid var(--line);padding-bottom:3px;cursor:pointer;min-height:1.9em}
.tw .sk .sep{color:var(--gold);opacity:.55;padding:0 .35em}
.tw .sk .blank{color:var(--muted);opacity:.35}
.tw[data-lv="2"]{margin-left:16px}.tw[data-lv="3"]{margin-left:32px}.tw[data-lv="4"]{margin-left:48px}
.tw .full{font-family:var(--mincho);font-size:14.5px;line-height:1.95;padding:8px 0 6px;text-indent:1em;animation:rise .2s ease}
.tw .hd{font-family:var(--mincho);font-size:13px;color:var(--muted)}
.tw .full .fh{font-family:var(--mincho);font-size:13.5px;color:var(--gold-soft);text-indent:0;margin-bottom:2px;font-weight:600}
.twsec{font-family:var(--mincho);font-size:14.5px;letter-spacing:.1em;margin:18px 0 8px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}

⑴","h":"無制限納税義務者","ref":"法2の2①、21の2①","st":0,"t":"《居住無制限納税義務者》又は《非居住無制限納税義務者》に該当する者については、その者が贈与により取得した《財産の全部》に対し《贈与税を課し》、《その年中において》贈与により取得した《財産の価額の合計額》をもって、《贈与税の課税価格》とする。","lv":1},{"mk":"⑵","h":"制限納税義務者","ref":"法2の2②、21の2②","st":0,"t":"《居住制限納税義務者》又は《非居住制限納税義務者》に該当する者については、その者が贈与により取得した《財産で法施行地にあるもの》に対し《贈与税を課し》、《その年中において》贈与により取得した《財産で法施行地にあるものの価額の合計額》をもって、《贈与税の課税価格》とする。","lv":1},{"mk":"⑶","h":"年の中途において課税財産の範囲が異なることとなった場合","ref":"法21の2③、令4の4の2","st":0,"t":"《贈与》により財産を取得した者が《その年中における》贈与による財産の取得について《⑴》かつ《⑵》に該当する場合には、その者については、《⑴の期間内》に《贈与により取得した財産の価額》及び《⑵の期間内》に《贈与により取得した財産で法施行地にあるものの価額》の合計額をもって《贈与税の課税価格》とする。","lv":1},{"mk":"⑷","h":"相続開始の年において被相続人から贈与を受けた場合","ref":"法21の2④","st":0,"t":"《相続又は遺贈により》財産を取得した者が《相続開始の年》においてその相続に係る《被相続人から受けた贈与》により取得した財産の価額で《生前贈与加算》の規定により《相続税の課税価格に加算》されるものは、《贈与税の課税価格に算入しない》。","lv":1}],"t":""},{"n":"〔3〕","h":"用語の意義","st":2,"ref":"法1の4③","items":[{"mk":"⑴","h":"一時居住者","ref":"","st":0,"t":"《贈与時》において《在留資格》で一定のものを有する者であってその《贈与前15年以内》において《法施行地に住所を有していた期間》の合計が《10年以下》であるものをいう。","lv":1},{"mk":"⑵","h":"外国人贈与者","ref":"","st":0,"t":"《贈与時》において《在留資格》で一定のものを有し、かつ、《法施行地に住所を有していた贈与者》をいう。","lv":1},{"mk":"⑶","h":"非居住贈与者","ref":"","st":0,"t":"《贈与時》において《法施行地に住所を有していなかった贈与者》であってその《贈与前10年以内》の《いずれかの時》において《法施行地に住所を有していたことがあるもの》のうちその《いずれの時において》も《日本国籍を有していなかったもの》又はその《贈与前10年以内》の《いずれの時》においても《法施行地に住所を有していたことがない》ものをいう。","lv":1}],"t":""}]},{"no":"1-3","chap":"納税義務者","ttl":"所得税法に規定する国外転出時課税等があった場合の相続税の関連規定","sub":"","secs":[{"n":"〔1〕","h":"納税義務者","st":2,"ref":"","items":[{"mk":"⑴","h":"居住無制限納税義務者","ref":"法1の3①一","st":0,"t":"《相続又は遺贈》により財産を取得した次に掲げる者であって、その《財産を取得した時》において《法施行地に住所を有するもの》","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《一時居住者》で《ない個人》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《一時居住者》で《ある個人》（被相続人が《外国人被相続人》又は《非居住被相続人》である場合を《除く》。）","lv":2}]},{"mk":"⑵","h":"非居住無制限納税義務者","ref":"法1の3①二","st":0,"t":"《相続又は遺贈》により財産を取得した次に掲げる者であって、その《財産を取得した時》において《法施行地に住所を有しないもの》","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《日本国籍》を有する《個人》であって次に掲げるもの","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"その《相続開始前10年以内》のいずれかの時において《法施行地に住所を有していたことがある》もの","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"その《相続開始前10年以内》のいずれの時においても《法施行地に住所を有していたことがない》もの（被相続人が《外国人被相続人》又は《非居住被相続人》である場合を《除く》。）","lv":3}]},{"mk":"②","h":"","ref":"","st":0,"t":"《日本国籍》を有しない《個人》（被相続人が《外国人被相続人》又は《非居住被相続人》である場合を《除く》。）","lv":2}]}],"t":"次に掲げる者は、《相続税を納める義務がある》。"},{"n":"〔2〕","h":"国外転出等","st":1,"ref":"法1の3②","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《国外転出時課税に係る納税猶予》（その納税猶予に係る《期限の延長》を受ける場合を《含む》。以下同じ。）の規定の適用を受ける《個人が死亡》した場合には、その個人の死亡に係る相続税の《〔1〕⑴②》又は《〔1〕⑵①ロ》若しくは《②》の規定の適用については、その個人は、その個人の死亡に係る《相続開始前10年以内》のいずれかの時において《法施行地に住所を有していた》ものとみなす。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《国外転出（贈与）時課税に係る納税猶予》の規定の適用を受ける者からその《贈与により財産を取得した者》（以下「《受贈者》」という。）《が死亡》した場合には、その《受贈者の死亡》に係る相続税の《〔1〕⑴②》又は《〔1〕⑵①ロ》若しくは《②》の規定の適用については、その《受贈者》は、その受贈者の死亡に係る《相続開始前10年以内》のいずれかの時において《法施行地に住所を有していた》ものとみなす。ただし、その受贈者がその規定の適用に係る《贈与前10年以内》のいずれの時においても《法施行地に住所を有していたことがない》場合は、この限りでない。","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"《国外転出（相続）時課税に係る納税猶予》の規定の適用を受ける《相続人》（《包括受遺者》を含む。以下⑶において同じ。）《が死亡》（以下⑶において「《二次相続》」という。）した場合には、その二次相続に係る相続税の《〔1〕⑴②》又は《〔1〕⑵①ロ》若しくは《②》の規定の適用については、その《相続人》は、その《二次相続開始前10年以内》のいずれかの時において《法施行地に住所を有していた》ものとみなす。ただし、その相続人がその規定の適用に係る《相続開始前10年以内》のいずれの時においても《法施行地に住所を有していたことがない》場合は、この限りでない。","lv":1}],"t":""},{"n":"〔3〕","h":"債務控除との関連","st":2,"ref":"法14③","items":[],"t":"控除すべき公租公課の金額には、被相続人が《〔2〕の納税猶予》の適用を受けていた場合におけるその《納税猶予分の所得税額》を《含まない》。\nただし、その被相続人の納付の義務を承継した《相続人》又は《包括受遺者》が《納付することとなった納税猶予分の所得税額》等については、《この限りでない》。"},{"n":"〔4〕","h":"更正の請求との関連","st":2,"ref":"法32①","items":[],"t":"相続税について申告書を提出した者又は決定を受けた者は、《〔2〕の納税猶予》の適用を受けていた者の《相続人》又は《包括受遺者》が、その《納税猶予分の所得税額》を《納付することとなったこと等》の事由により、その申告又は決定に係る《課税価格》及び《相続税額》が《過大となったとき》は、その《事由が生じたことを知った日》の翌日から《4月以内》に限り、《納税地の所轄税務署長》に《更正の請求》を《することができる》。"}]},{"no":"1-4","chap":"納税義務者","ttl":"所得税法に規定する国外転出時課税等があった場合の贈与税の関連規定","sub":"","secs":[{"n":"〔1〕","h":"納税義務者","st":2,"ref":"","items":[{"mk":"⑴","h":"居住無制限納税義務者","ref":"法1の4①一","st":0,"t":"《贈与》により財産を取得した次に掲げる者であって、その《財産を取得した時》において《法施行地に住所を有するもの》","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《一時居住者》で《ない個人》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《一時居住者》で《ある個人》（贈与者が《外国人贈与者》又は《非居住贈与者》である場合を《除く》。）","lv":2}]},{"mk":"⑵","h":"非居住無制限納税義務者","ref":"法1の4①二","st":0,"t":"《贈与》により財産を取得した次に掲げる者であって、その《財産を取得した時》において《法施行地に住所を有しないもの》","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《日本国籍》を有する《個人》であって次に掲げるもの","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"その《贈与前10年以内》のいずれかの時において《法施行地に住所を有していたことがある》もの","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"その《贈与前10年以内》のいずれの時においても《法施行地に住所を有していたことがない》もの（贈与者が《外国人贈与者》又は《非居住贈与者》である場合を《除く》。）","lv":3}]},{"mk":"②","h":"","ref":"","st":0,"t":"《日本国籍》を有しない《個人》（贈与者が《外国人贈与者》又は《非居住贈与者》である場合を《除く》。）","lv":2}]}],"t":"次に掲げる者は、《贈与税を納める義務がある》。"},{"n":"〔2〕","h":"国外転出等","st":1,"ref":"法1の4②","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《国外転出時課税に係る納税猶予》（その納税猶予に係る《期限の延長》を受ける場合を含む。以下同じ。）の規定の適用を受ける《個人が財産の贈与》をした場合には、その贈与に係る贈与税の《〔1〕⑴②》又は《〔1〕⑵①ロ》若しくは《②》の規定の適用については、その個人は、その《贈与前10年以内》のいずれかの時において《法施行地に住所を有していた》ものとみなす。","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《国外転出（贈与）時課税に係る納税猶予》の規定の適用を受ける者からその《贈与により財産を取得した者》（以下「《受贈者》」という。）《が財産の贈与》（以下⑵において「《二次贈与》」という。）をした場合には、その《二次贈与》に係る贈与税の《〔1〕⑴②》又は《〔1〕⑵①ロ》若しくは《②》の規定の適用については、その《受贈者》は、その《二次贈与前10年以内》のいずれかの時において《法施行地に住所を有していた》ものとみなす。ただし、その受贈者がその規定の適用に係る《贈与前10年以内》のいずれの時においても《法施行地に住所を有していたことがない》場合は、この限りでない。","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"《国外転出（相続）時課税に係る納税猶予》の規定の適用を受ける《相続人》（《包括受遺者》を含む。以下同じ。）《が財産の贈与》をした場合には、その贈与に係る贈与税の《〔1〕⑴②》又は《〔1〕⑵①ロ》若しくは《②》の規定の適用については、その《相続人》は、その《贈与前10年以内》のいずれかの時において《法施行地に住所を有していた》ものとみなす。ただし、その相続人がその規定の適用に係る《相続開始前10年以内》のいずれの時においても《法施行地に住所を有していたことがない》場合は、この限りでない。","lv":1}],"t":""}]},{"no":"1-5","chap":"納税義務者","ttl":"自然人以外のものが納税義務を負う場合等","sub":"（信託の受託者及び認定医療法人が納税義務を負う場合を除く。）","secs":[{"n":"〔1〕","h":"人格のない社団等又は持分の定めのない法人に対する課税","st":0,"ref":"","items":[{"mk":"⑴","h":"人格のない社団等","ref":"法66①、②","st":2,"t":"《人格のない社団等》に対し財産の《贈与》、《遺贈》又は設立のための《提供》があった場合においては、その人格のない社団等を《個人とみなして》、《贈与税又は相続税を課する》。","lv":1},{"mk":"⑵","h":"持分の定めのない法人","ref":"法66④","st":2,"t":"《持分の定めのない法人》に対し財産の《贈与》、《遺贈》又は設立のための《提供》があった場合において、その贈与、遺贈又は提供により《その贈与、遺贈又は提供をした者の親族その他これらの者と特別の関係がある者》の《相続税又は贈与税》の負担が《不当に減少すると認められる》ときは、その持分の定めのない法人を《個人とみなして》、《贈与税又は相続税を課する》。","lv":1},{"mk":"⑶","h":"法人税等相当額の控除","ref":"法66⑤","st":2,"t":"個人とみなされるものの《贈与税又は相続税の額》については、その個人とみなされるものに課される《法人税等相当額》を控除する。","lv":1},{"mk":"⑷","h":"住所の判定","ref":"法66③","st":1,"t":"納税義務者の規定の適用については、個人とみなされるものの《住所》は、その《主たる営業所又は事務所の所在地》にあるものと《みなす》。","lv":1},{"mk":"⑸","h":"贈与税額の計算","ref":"法66①","st":2,"t":"個人とみなされるものの《贈与税額》は、《贈与者の異なるごと》に、その《贈与者の各一人のみ》から財産を取得したものと《みなして算出》した場合の贈与税額の《合計額》とする。","lv":1}],"t":""},{"n":"〔2〕","h":"特別の法人から受ける利益に対する課税","st":2,"ref":"法65①、③","items":[],"t":"《持分の定めのない法人》で、《設立者、社員、理事、監事若しくは評議員、その法人に対し贈与、遺贈若しくは設立のための提供をした者》又はその《親族》その他これらの者と《特別の関係がある者》に《特別の利益》を与えるものに対して財産の《贈与》、《遺贈》又は設立のための《提供》があった場合においては、《〔1〕⑵の規定の適用がある場合を除き》、その贈与、遺贈又は設立のための提供があった時において、その《法人から特別の利益を受ける者》が、その《受ける利益の価額に相当する金額》をその贈与、遺贈又は設立のための提供を《した者》から《贈与又は遺贈》により取得したものと《みなす》。"},{"n":"〔3〕","h":"特定の一般社団法人等に対する課税","st":0,"ref":"","items":[{"mk":"⑴","h":"特定の一般社団法人等","ref":"法66の2①","st":2,"t":"《一般社団法人等の理事》である者（その《一般社団法人等の理事》でなくなった日から《5年を経過していない者》を含む。）が《死亡した場合》において、その《一般社団法人等》が《特定一般社団法人等》に該当するときは、その《特定一般社団法人等》はその《死亡した者》（以下「《被相続人》」という。）の《相続開始時》におけるその特定一般社団法人等の次に掲げる金額をその《被相続人》から《遺贈》に《より取得したもの》と、その特定一般社団法人等は《個人とそれぞれみなし》て、その《特定一般社団法人等》に《相続税》を課する。\n%%|《純資産額（財産の価額の合計額−債務の価額の合計額）》|《その時の同族理事の数＋1》","lv":1},{"mk":"⑵","h":"贈与税及び相続税の控除","ref":"法66の2③","st":2,"t":"⑴の規定により《特定一般社団法人等に相続税》が課される場合には、その特定一般社団法人等の相続税の額については、〔1〕⑵の規定によりその特定一般社団法人等に課された《贈与税及び相続税》の税額を控除する。","lv":1},{"mk":"⑶","h":"住所の判定","ref":"法66の2④","st":1,"t":"⑴の規定の適用がある場合における相続税の納税義務者の規定の適用については、⑴の《特定一般社団法人等》の《住所》は、その《主たる事務所の所在地》にあるものとする。","lv":1},{"mk":"⑷","h":"生前贈与加算の不適用","ref":"法66の2⑤","st":2,"t":"⑴の規定の適用がある場合において、その特定一般社団法人等が被相続人に係る《相続開始前7年以内》にその被相続人から《贈与により取得した財産》の価額については、《生前贈与加算》の規定は、《適用しない》。","lv":1},{"mk":"⑸","h":"用語の意義","ref":"法66の2②","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"一般社団法人等","ref":"","st":1,"t":"《一般社団法人》又は《一般財団法人》（被相続人の相続開始時において《公益社団法人》又は《公益財団法人》、法人税法に規定する《非営利型法人》その他一定のものを《除く》。）をいう。","lv":2},{"mk":"②","h":"同族理事","ref":"","st":2,"t":"一般社団法人等の《理事》のうち、《被相続人》又はその《配偶者》、《三親等内の親族》その他のその被相続人と《特殊の関係》のある者をいう。","lv":2},{"mk":"③","h":"特定一般社団法人等","ref":"","st":2,"t":"一般社団法人等で次に掲げる要件の《いずれかを満たすもの》をいう。","lv":2,"items":[{"mk":"イ","h":"","ref":"","st":0,"t":"被相続人の《相続開始直前》におけるその《被相続人に係る同族理事の数》の《理事の総数のうちに占める割合》が《2分の1》を《超える》こと。","lv":3},{"mk":"ロ","h":"","ref":"","st":0,"t":"被相続人の《相続開始前5年以内》においてその《被相続人に係る同族理事の数》の《理事の総数のうちに占める割合》が《2分の1》を《超える期間》の《合計が3年以上》であること。","lv":3}]}]}],"t":""}]},{"no":"1-6","chap":"納税義務者","ttl":"医療法人の持分の放棄があった場合の贈与税の課税の特例","sub":"","secs":[{"n":"〔1〕","h":"課税の特例","st":2,"ref":"措法70の7の14①、⑤、⑥","items":[{"mk":"⑴","h":"課税されない場合","ref":"","st":0,"t":"《認定医療法人》の《持分を有する個人》がその持分の《全部又は一部の放棄》（その《認定医療法人》がその《移行期限まで》に《新医療法人への移行をする場合》におけるその移行の基因となる《放棄》に限るものとし、その《個人の遺言による放棄》を除く。）をしたことによりその《認定医療法人》が《持分の放棄による利益》（以下「《経済的利益》」という。）を受けた場合であっても、その《認定医療法人が受けた》その《経済的利益》については、《持分の定めのない法人に対する課税の規定は適用しない》。","lv":1},{"mk":"⑵","h":"申告要件","ref":"","st":0,"t":"⑴の規定は、《税務署長がやむを得ない事情があると認める場合を除き》、贈与税の《期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。","lv":1}],"t":""},{"n":"〔2〕","h":"課税される場合","st":2,"ref":"措法70の7の14②、④","items":[{"mk":"⑴","h":"内　　容","ref":"","st":0,"t":"〔1〕の規定の適用を受けた《認定医療法人》（その《認定医療法人が合併》により《消滅》した場合には、その《合併後存続する医療法人》で一定のもの）が、〔1〕の規定の適用に係る《贈与税の期限内申告書の提出期限》からその《認定医療法人が新医療法人への移行をした日》から《6年を経過する日》までの間に、《厚生労働大臣認定が取り消された場合》には、〔1〕の規定にかかわらず、その《認定医療法人》を《個人とみなして》、その《経済的利益》について《贈与税》を《課する》。","lv":1},{"mk":"⑵","h":"修正申告","ref":"","st":0,"t":"⑴の場合において、その《認定医療法人》は、その《厚生労働大臣認定が取り消された日》の《翌日》から《2月以内》に、〔1〕の規定の適用を受けた《年分の贈与税》についての《修正申告書》を提出し、かつ、その《期限内》にその《申告書》の《提出により納付すべき税額》を《納付しなければならない》。","lv":1},{"mk":"⑶","h":"その他","ref":"","st":0,"t":"修正申告書で《提出期限内》に提出されたものについては、《期限内申告書》とみなす。","lv":1}],"t":""}]},{"no":"2-1","chap":"みなし取得財産","ttl":"相続又は遺贈により取得したものとみなす場合","sub":"","secs":[{"n":"〔1〕","h":"発生時","st":2,"ref":"","items":[{"mk":"⑴","h":"生命保険金等","ref":"法3①一","st":0,"t":"《被相続人の死亡》により相続人等が《生命保険契約の保険金》又は《損害保険契約の保険金》（《偶然な事故に基因する死亡》に伴い支払われるものに《限る》。）を取得した場合においては、その《保険金受取人》について、次の《保険金》\n%%（《保険金》（《⑵〔3〕⑴⑵》を除く。））×|《被相続人が負担》した保険料|被相続人の死亡の時までの《払込保険料の全額》","lv":1},{"mk":"⑵","h":"退職手当金等","ref":"法3①二","st":0,"t":"《被相続人の死亡》により相続人等が《その被相続人に支給されるべきであった退職手当金、功労金その他これらに準ずる給与》で被相続人の死亡後《3年以内》に支給が確定したものの支給を受けた場合においては、その《給与の支給を受けた者》について、その《給与》","lv":1}],"t":"次の《場合》には、次の《者》が、次の《財産》を《相続又は遺贈》により取得したものと《みなす》。\nこの場合において、その者が《相続人》であるときはその財産を《相続》により取得したものと《みなし》、その者が《相続人以外の者》であるときはその財産を《遺贈》により取得したものと《みなす》。"},{"n":"〔2〕","h":"発生前","st":2,"ref":"","items":[{"mk":"⑴","h":"生命保険契約に関する権利","ref":"法3①三","st":0,"t":"相続開始時において、まだ《保険事故が発生していない生命保険契約》（《一定期間内に保険事故が発生しなかった》場合において、《返還金等の支払がない》生命保険契約を除く。）で《被相続人が保険料の全部又は一部を負担》し、かつ、《被相続人以外の者》がその契約の《契約者》である場合においては、その《契約者》について、次の《権利》\n%%（生命保険契約に関する権利）×|《被相続人が負担》した保険料|相続開始時までの《払込保険料の全額》","lv":1},{"mk":"⑵","h":"定期金に関する権利","ref":"法3①四","st":0,"t":"相続開始時において、まだ《定期金給付事由が発生していない定期金給付契約》（《生命保険契約を除く。》）で《被相続人が保険料等の全部又は一部を負担》し、かつ、《被相続人以外の者》がその契約の契約者である場合においては、その《契約者》について、次の《権利》\n%%（定期金に関する権利）×|《被相続人が負担》した保険料等|相続開始時までの《払込保険料等の全額》","lv":1}],"t":"次の《場合》には、次の《者》が、次の《財産》を《相続又は遺贈》により取得したものと《みなす》。\nこの場合において、その者が《相続人》であるときはその財産を《相続》により取得したものと《みなし》、その者が《相続人以外の者》であるときはその財産を《遺贈》により取得したものと《みなす》。"},{"n":"〔3〕","h":"発生後","st":2,"ref":"","items":[{"mk":"⑴","h":"保証期間付定期金に関する権利","ref":"法3①五","st":0,"t":"《定期金給付契約》で《定期金受取人》に対しその《生存中》又は《一定期間》にわたり《定期金》を給付し、かつ、その者が死亡したときは《遺族その他の者》に対して定期金又は一時金を給付するものに基づき《定期金受取人である被相続人》の死亡後相続人等が《継続受取人》となった場合においては、その《継続受取人》について、次の《権利》\n%%（保証期間付定期金に関する権利）×|《被相続人が負担》した保険料等|相続開始時までの《払込保険料等の全額》","lv":1},{"mk":"⑵","h":"契約に基づかない定期金に関する権利","ref":"法3①六","st":0,"t":"被相続人の死亡により相続人等が《定期金》（《一時金》を含む。）《に関する権利》で《契約に基づくもの以外のもの》を取得した場合においては、その《権利の取得者》について、その《権利》（《〔1〕⑵》を除く。）","lv":1}],"t":"次の《場合》には、次の《者》が、次の《財産》を《相続又は遺贈》により取得したものと《みなす》。\nこの場合において、その者が《相続人》であるときはその財産を《相続》により取得したものと《みなし》、その者が《相続人以外の者》であるときはその財産を《遺贈》により取得したものと《みなす》。"},{"n":"〔4〕","h":"保険料等の取扱い","st":1,"ref":"","items":[{"mk":"⑴","h":"被相続人の被相続人が負担した保険料等","ref":"法3②","st":0,"t":"〔1〕⑴〔2〕〔3〕⑴については、《被相続人の被相続人》が負担した保険料等は、《被相続人が負担》した保険料等とみなす。ただし、《契約者》がその被相続人の被相続人から《生命保険契約に関する権利》又は《定期金に関する権利》を相続又は遺贈により取得したものとみなされた場合においては、その《被相続人の被相続人が負担した保険料等》については、《この限りでない》。","lv":1},{"mk":"⑵","h":"遺言により払い込まれた保険料等","ref":"法3③","st":0,"t":"〔2〕については、被相続人の《遺言により払い込まれた保険料等》は、《被相続人が負担》した《保険料等とみなす》。","lv":1}],"t":""}]},{"no":"2-2","chap":"みなし取得財産","ttl":"贈与税の生命保険金等・定期金の課税関係","sub":"","secs":[{"n":"〔1〕","h":"発生時","st":2,"ref":"","items":[{"mk":"⑴","h":"生命保険金等","ref":"法5①","st":0,"t":"《生命保険契約》の《保険事故》（《傷害》、《疾病》等の《保険事故》で《死亡を伴わないものを除く》。）又は《損害保険契約》の《保険事故》（《偶然な事故》に基因する保険事故で《死亡を伴うものに限る》。）が《発生》した場合において、《保険金受取人以外》の者が保険料負担者であるときは、その《保険事故発生時》に、その《保険金受取人》が、次の《保険金》をその《保険料負担者》から《贈与》により取得したものと《みなす》。\n%%保険金（損害保険契約の保険金は、一定のものに限る。）×|《保険金受取人以外の者が負担》した保険料|保険事故発生時までの払込保険料の全額","lv":1},{"mk":"⑵","h":"定期金","ref":"法6①","st":0,"t":"《定期金給付契約》（《生命保険契約を除く。》）の《定期金給付事由が発生》した場合において、《定期金受取人以外》の者が保険料等負担者であるときは、その《定期金給付事由発生時》に、その《定期金受取人》が、次の《権利》をその《保険料等負担者》から《贈与》により取得したものと《みなす》。\n%%（定期金給付契約に関する権利）×|《定期金受取人以外の者が負担》した保険料等|定期金給付事由発生時までの払込保険料等の全額","lv":1},{"mk":"⑶","h":"相続又は遺贈により取得したものとみなされる場合","ref":"法5④","st":0,"t":"⑴の規定は、保険金受取人が《生命保険金等》又は《退職手当金等》を《相続又は遺贈》により取得したものとみなされる場合においては、その《保険金又は給与》に相当する部分については《適用しない》。","lv":1}],"t":""},{"n":"〔2〕","h":"発生前","st":2,"ref":"","items":[{"mk":"⑴","h":"返還金等","ref":"法5②、6②","st":0,"t":"〔1〕⑴⑵の規定は、その契約について《返還金等の取得》があった場合について準用する。","lv":1}],"t":""},{"n":"〔3〕","h":"発生後","st":2,"ref":"","items":[{"mk":"⑴","h":"保証期間付定期金に関する権利","ref":"法6③","st":0,"t":"《定期金給付契約》で《定期金受取人》に対しその《生存中》又は《一定期間》にわたり《定期金》を給付し、かつ、その者が死亡したときは《遺族その他の者》に対して定期金又は一時金を給付するものに基づき《定期金受取人である被相続人》の死亡後相続人等が《継続受取人》となった場合において、継続受取人及び被相続人以外の《第三者が保険料等負担者》であるときは、その《相続開始時》に、その《継続受取人》が、次の《権利》をその《第三者》から《贈与》により取得したものとみなす。\n%%（保証期間付定期金に関する権利）×|《第三者が負担》した保険料等|相続開始時までの払込保険料等の全額","lv":1}],"t":""},{"n":"〔4〕","h":"保険料等の取扱い","st":1,"ref":"","items":[{"mk":"⑴","h":"保険料等負担者の被相続人が負担した保険料等","ref":"法5③、6④","st":0,"t":"〔1〕⑴⑵〔2〕〔3〕については、《保険料等負担者の被相続人》が負担した保険料等は、《その者が負担》した保険料等とみなす。ただし、《受取人》若しくは《返還金等の取得者》又は《継続受取人》がその被相続人から《生命保険契約に関する権利》又は《定期金に関する権利》を相続又は遺贈により取得したものとみなされた場合においては、《その被相続人が負担した保険料等》については、この限りでない。","lv":1}],"t":""}]},{"no":"2-3","chap":"みなし取得財産","ttl":"低額譲受・債務免除等・その他の利益の享受","sub":"","secs":[{"n":"〔1〕","h":"低額譲受","st":2,"ref":"法7","items":[{"mk":"⑴","h":"課税される場合","ref":"","st":0,"t":"《著しく低い価額の対価》で財産の《譲渡を受けた場合》においては、その《財産の譲渡があった時》に、その《財産の譲渡を受けた者》が、その《対価》とその《譲渡時の財産の時価》との《差額》に相当する金額をその《財産を譲渡した者》から《贈与又は遺贈》により取得したものとみなす。","lv":1},{"mk":"⑵","h":"課税されない場合","ref":"","st":0,"t":"その財産の譲渡が、その譲渡を受ける者が《資力を喪失して債務の弁済が困難》である場合において、その者の《扶養義務者》からその《債務の弁済に充てるため》になされたときは、その《債務の弁済が困難な金額》については、《課税しない》。","lv":1}],"t":""},{"n":"〔2〕","h":"債務免除等","st":2,"ref":"法8","items":[{"mk":"⑴","h":"課税される場合","ref":"","st":0,"t":"対価を支払わないで、又は著しく低い価額の対価で《債務》の《免除》、《引受け》又は《弁済》（以下「《債務免除等》」という。）による《利益を受けた場合》においては、その《債務免除等があった時》に、その《債務免除等による利益を受けた者》が、その《債務》の金額に相当する金額（《対価の支払》があった場合には、その価額を控除した金額）をその《債務免除等をした者》から《贈与又は遺贈》により取得したものとみなす。","lv":1},{"mk":"⑵","h":"課税されない場合","ref":"","st":0,"t":"その債務免除等が次のいずれかに該当する場合には、その《債務の弁済が困難な金額》については、《課税しない》。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"債務者が《資力を喪失して債務の弁済が困難》である場合において、その債務の《免除》を受けたとき","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"債務者が《資力を喪失して債務の弁済が困難》である場合において、その者の《扶養義務者》によってその債務の《引受け》又は《弁済》がなされたとき","lv":2}]}],"t":""},{"n":"〔3〕","h":"その他の利益の享受","st":2,"ref":"法9","items":[{"mk":"⑴","h":"課税される場合","ref":"","st":0,"t":"《一定のみなし課税の規定に該当する場合》を除くほか、対価を支払わないで、又は著しく低い価額の対価で《利益を受けた場合》においては、その《利益を受けた時》に、その《利益を受けた者》が、その《利益》の価額に相当する金額（《対価の支払》があった場合には、その価額を控除した金額）をその《利益を受けさせた者》から《贈与又は遺贈》により取得したものとみなす。","lv":1},{"mk":"⑵","h":"課税されない場合","ref":"","st":0,"t":"その行為が、その利益を受ける者が《資力を喪失して債務の弁済が困難》である場合において、その者の《扶養義務者》からその《債務の弁済に充てるため》になされたときは、その《債務の弁済が困難な金額》については、《課税しない》。","lv":1}],"t":""}]},{"no":"2-4","chap":"みなし取得財産","ttl":"信託に関する権利","sub":"","secs":[{"n":"〔1〕","h":"信託に関する権利","st":2,"ref":"法9の2①、②、③、④","items":[{"mk":"⑴","h":"信託効力発生時","ref":"","st":0,"t":"《信託》（《退職年金の支給》を目的とする信託を除く。以下同じ｡）《の効力が生じた場合》において、《適正な対価を負担せずに》その信託の《受益者等》となる者があるときは、その《信託の効力が生じた時》において、その信託の《受益者等となる者》は、その《信託に関する権利》をその信託の《委託者》から《贈与又は遺贈》により取得したものとみなす。","lv":1},{"mk":"⑵","h":"受益者等の変更","ref":"","st":0,"t":"受益者等の存する信託について、《適正な対価を負担せずに》新たにその信託の《受益者等が存するに至った場合》（⑷の場合を除く。）には、その《受益者等が存するに至った時》において、その信託の《受益者等となる者》は、その《信託に関する権利》をその信託の《受益者等》であった者から《贈与又は遺贈》により取得したものとみなす。","lv":1},{"mk":"⑶","h":"受益者等の一部不存在","ref":"","st":0,"t":"《受益者等の存する》信託について、その信託の《一部の受益者等が存しなくなった》場合において、《適正な対価を負担せずに》既にその信託の《受益者等である者》がその信託に関する権利について《新たに利益を受けることとなるとき》は、その信託の《一部の受益者等が存しなくなった時》において、その《利益を受ける者》は、その《利益》をその信託の《一部の受益者等》であった者から《贈与又は遺贈》により取得したものとみなす。","lv":1},{"mk":"⑷","h":"信託終了時","ref":"","st":0,"t":"《受益者等の存する信託が終了》した場合において、《適正な対価を負担せずに》その信託の《残余財産》の《給付》を受けるべき、又は《帰属》すべき者となる者があるときは、その《給付を受けるべき》、又は《帰属すべき者となった時》において、その信託の《残余財産の給付を受けるべき、又は帰属すべき者となった者》は、その信託の《残余財産》（その信託の終了の直前において《その者がその信託の受益者等であった場合》には、その受益者等として有していたその《信託に関する権利》に相当するものを除く。）をその信託の《受益者等》から《贈与又は遺贈》により取得したものとみなす。","lv":1}],"t":""},{"n":"〔2〕","h":"信託財産等の承継","st":1,"ref":"法9の2⑥","items":[],"t":"〔1〕⑴〜⑶の規定により《贈与》又は《遺贈》により取得したものとみなされる《信託に関する権利》又は《利益》を取得した者は、その信託の信託財産に属する《資産》及び《負債》を取得し、又は承継したものとみなす。"}]},{"no":"2-5","chap":"みなし取得財産","ttl":"受益者等が存しない信託等の特例","sub":"","secs":[{"n":"〔1〕","h":"受益者等が存しない信託等の特例","st":0,"ref":"法9の4、令1の12①","items":[{"mk":"⑴","h":"受益者等が存しない信託","ref":"","st":0,"t":"《受益者等が存しない》信託（《退職年金の支給》を目的とする信託を除く。以下同じ。）の《効力が生ずる》場合において、その信託の受益者等となる者がその信託の《委託者》の《親族》であるとき（受益者等となる者が明らかでない場合には、信託終了時に《親族》が《残余財産》の給付を受けることとなるとき）は、その《信託の効力が生ずる時》において、その信託の《受託者》は、その《信託に関する権利》をその《委託者》から《贈与又は遺贈》により取得したものとみなす。","lv":1},{"mk":"⑵","h":"受益者等が不存在となった場合","ref":"","st":0,"t":"《受益者等の存する》信託について、その信託の《受益者等が不存在となった》場合において、その受益者等の次に受益者等となる者がその信託の効力が生じた時の《委託者》又はその《前の受益者等》の《親族》であるとき（次に受益者等となる者が明らかでない場合には、信託終了時に《委託者》又はその《前の受益者等》の《親族》が《残余財産》の給付を受けることとなるとき）は、その《受益者等が不存在となった時》において、その信託の《受託者》は、その《信託に関する権利》をその《前の受益者等》から《贈与又は遺贈》により取得したものとみなす。","lv":1},{"mk":"⑶","h":"受託者が個人以外である場合","ref":"","st":0,"t":"⑴⑵の規定の適用がある場合において、これらの信託の《受託者》が《個人以外》であるときは、その《受託者を個人とみなし》て、相続税又は贈与税を課する。","lv":1},{"mk":"⑷","h":"法人税等相当額の控除","ref":"","st":0,"t":"⑴〜⑶の規定の適用がある場合において、《受託者》に課される贈与税又は相続税の額については、その《受託者》に課される《法人税等相当額》を控除する。","lv":1},{"mk":"⑸","h":"住所等の判定","ref":"","st":0,"t":"納税義務者の規定の適用については、⑴⑵の信託の《受託者の住所》は、その信託の《引受けをした営業所、事務所等の所在地》にあるものとし、⑴⑵の信託の受託者は、《日本国籍》を有するものとする。","lv":1}],"t":""},{"n":"〔2〕","h":"受益者等が存することとなる場合","st":0,"ref":"法9の5","items":[],"t":"《受益者等が存しない》信託について、その信託の《契約締結時等》において《存しない者》がその信託の《受益者等》となる場合において、その信託の受益者等となる者がその信託の契約締結時等における《委託者》の《親族》であるときは、その《存しない者がその信託の受益者等となる時》において、その信託の《受益者等となる者》は、その《信託に関する権利》を《個人》から《贈与》により取得したものとみなす。"},{"n":"〔3〕","h":"信託財産等の承継","st":0,"ref":"法9の2⑥、令1の12⑤","items":[],"t":"〔1〕〔2〕の規定により《贈与》又は《遺贈》により取得したものとみなされる《信託に関する権利》又は《利益》を取得した者は、その信託の信託財産に属する《資産》及び《負債》を取得し、又は承継したものとみなす。"}]},{"no":"3-1","chap":"課税価格","ttl":"相続税の非課税財産","sub":"（租税特別措置法の非課税財産を除く。）","secs":[{"n":"〔1〕","h":"相続税の非課税財産","st":2,"ref":"法12、15②","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"皇室経済法の規定により皇位とともに《皇嗣が受けた物》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《墓所》、《霊びょう》及び《祭具》並びにこれらに準ずるもの","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《宗教、慈善、学術》その他《公益を目的とする事業》を行う者で一定のものが《相続又は遺贈》により取得した財産でその《公益を目的とする事業の用》に供することが《確実なもの》（《⑷》を除く。）","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"①の財産を取得した者がその《取得した日》から《2年を経過した日》までにその財産をその《公益を目的とする事業の用に供しない場合》又は《供しなくなった場合》には、その財産の価額は、《相続税の課税価格》に算入する。","lv":2}]},{"mk":"⑷","h":"","ref":"","st":0,"t":"《公益信託》の《受託者》が《遺贈》により取得した財産（その《信託財産》として取得したものに《限る》。）","lv":1},{"mk":"⑸","h":"","ref":"","st":0,"t":"条例の規定により《地方公共団体》が実施する《心身障害者共済制度》に基づき支給される《給付金の受給権》","lv":1},{"mk":"⑹","h":"","ref":"","st":0,"t":"《相続人》の取得した《相続税が課税される保険金》（《⑸》を除く。以下同じ。）については、次の区分に応じ、次の金額に相当する部分","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"A≦Bの場合","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"A＞Bの場合\nB×A分のCA…《全ての相続人》が取得した保険金の合計額B…《500万円×法定相続人の数》＝非課税限度額C…その《相続人》の取得した保険金","lv":2}]},{"mk":"⑺","h":"","ref":"","st":0,"t":"《相続人》の取得した《相続税が課税される退職手当金等》については、次の区分に応じ、次の金額に相当する部分","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"A≦Bの場合","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"A＞Bの場合\nB×A分のCA…《全ての相続人》が取得した退職手当金等の合計額B…《500万円×法定相続人の数》＝非課税限度額C…その《相続人》の取得した退職手当金等","lv":2}]}],"t":"次に掲げる財産の価額は、《相続税の課税価格に算入しない》。"}]},{"no":"3-2","chap":"課税価格","ttl":"国等に対して相続財産を贈与した場合等の相続税の非課税","sub":"","secs":[{"n":"〔1〕","h":"内容","st":2,"ref":"措法70①、②、③、④、⑤、⑩","items":[{"mk":"⑴","h":"特定の公益法人等など","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"非課税\n《相続又は遺贈により財産を取得した者》が、その財産の《全部又は一部》を《申告期限まで》に《国》、《地方公共団体》、《特定の公益法人等》、《認定特定非営利活動法人》に贈与した場合には、その贈与により《その贈与をした者又はその親族その他これらの者と特別の関係がある者》の《相続税又は贈与税》の負担が《不当に減少》すると認められる場合を除き、その財産の価額は、《相続税の課税価格に算入しない》。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"取消し\n《特定の公益法人等》、《認定特定非営利活動法人》で①の贈与を受けたものが、《その贈与の日から2年を経過した日》までに《特定の公益法人等》、《認定特定非営利活動法人》に《該当しない》こととなった場合又はその贈与により取得した財産を《同日》までにその《公益を目的とする事業の用に供しない場合》若しくは《供しなくなった場合》には、その財産の価額は、《相続税の課税価格に算入する》。","lv":2}]},{"mk":"⑵","h":"公益信託","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"非課税\n《相続又は遺贈により財産を取得した者》が、その財産の《全部又は一部》を《申告期限まで》に《公益信託の信託財産》として支出した場合には、その支出により《その支出をした者又はその親族その他これらの者と特別の関係がある者》の《相続税又は贈与税》の負担が《不当に減少》すると認められる場合を除き、その財産の価額は、《相続税の課税価格に算入しない》。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"取消し\n①の財産を受け入れた《公益信託》が、《その受入れの日から2年を経過した日》までに《終了》（《信託の併合》による《終了を除く》。）《をした場合》又はその《公益信託の受託者》がその財産を《同日まで》にその《公益信託事務の用に供しない場合》若しくは《供しなくなった場合》には、その財産の価額は、《相続税の課税価格に算入する》。","lv":2}]},{"mk":"⑶","h":"申告要件","ref":"","st":0,"t":"《⑴①⑵①の規定》は、《相続税の期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。","lv":1}],"t":""},{"n":"〔2〕","h":"取消しによる手続","st":0,"ref":"措法70⑥、⑦、⑨","items":[{"mk":"⑴","h":"期限後申告","ref":"","st":2,"t":"《〔1〕⑴①⑵①の規定》の適用を受けた者は、《〔1〕⑴②⑵②に該当》したことに伴いその《財産の価額》を《相続税の課税価格に算入》すべきこととなったことにより、《相続税の期限内申告書を提出すべきこととなった場合》には、《その2年を経過した日の翌日から4月以内》に《期限後申告書》を提出し、かつ、その期限内にその申告書の提出により《納付すべき税額を納付しなければならない》。","lv":1},{"mk":"⑵","h":"修正申告","ref":"","st":2,"t":"《〔1〕⑴①⑵①の規定》の適用を受けて《相続税の期限内申告書を提出した者》（その者の《相続人》及び《包括受遺者》を含む。）は、《〔1〕⑴②⑵②に該当》した場合には、《その2年を経過した日の翌日から4月以内》に《修正申告書》を提出し、かつ、その期限内にその申告書の提出により《納付すべき税額を納付しなければならない》。","lv":1},{"mk":"⑶","h":"その他","ref":"","st":1,"t":"⑴⑵の申告書で《提出期限内》に《提出》されたものについては、《期限内申告書とみなす》。","lv":1}],"t":""}]},{"no":"3-3","chap":"課税価格","ttl":"贈与税の非課税財産","sub":"（租税特別措置法の非課税財産を除く。）","secs":[{"n":"〔1〕","h":"贈与税の非課税財産","st":2,"ref":"法21の2④、21の3、21の4①","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《法人からの贈与》により取得した財産及び《公益信託から給付》を受けた財産","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"《扶養義務者相互間》において《生活費》又は《教育費》に充てるためにした贈与により取得した財産のうち《通常必要》と認められるもの","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《宗教、慈善、学術》その他《公益を目的とする事業》を行う者で一定のものが《贈与》により取得した財産でその《公益を目的とする事業の用》に供することが《確実なもの》（《⑷》を除く。）","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"①の財産を取得した者がその《取得した日》から《2年を経過した日》までにその財産をその《公益を目的とする事業の用に供しない場合》又は《供しなくなった場合》には、その財産の価額は、《贈与税の課税価格》に算入する。","lv":2}]},{"mk":"⑷","h":"","ref":"","st":0,"t":"《公益信託》の《受託者》が《贈与》により取得した財産（その《信託財産》として取得したものに《限る》。）","lv":1},{"mk":"⑸","h":"","ref":"","st":0,"t":"条例の規定により《地方公共団体》が実施する《心身障害者共済制度》に基づき支給される《給付金の受給権》","lv":1},{"mk":"⑹","h":"","ref":"","st":0,"t":"《公職選挙法》の適用を受ける選挙における《公職の候補者》が選挙運動に関し贈与により取得した金銭等で《報告がなされたもの》\n（注）","lv":1},{"mk":"⑺","h":"","ref":"","st":0,"t":"《特定障害者》（《非居住無制限納税義務者》、《居住制限納税義務者》又は《非居住制限納税義務者》に該当する者を除く。）が、《特定障害者扶養信託契約》に基づき信託受益権を有することとなる場合において、その信託の際、《障害者非課税信託申告書》を納税地の所轄税務署長に提出したときは、その信託受益権のうち《6≤000万円》（《特別障害者以外》の者にあっては、《3≤000万円》）までの金額（《既にこの規定の適用を受けた》部分の価額を控除した残額）に相当する部分\n（注）　特定障害者とは、《特別障害者》及び《障害者》（《特別障害者》を除く。）のうち《精神上の障害により事理を弁識する能力を欠く常況》にある者等をいう。","lv":1},{"mk":"⑻","h":"","ref":"","st":0,"t":"《相続又は遺贈》により財産を取得した者が《相続開始の年》においてその相続に係る《被相続人から受けた贈与》により取得した財産の価額で《生前贈与加算》の規定により《相続税の課税価格に加算》されるもの","lv":1}],"t":"次に掲げる財産の価額は、《贈与税の課税価格に算入しない》。"}]},{"no":"3-4","chap":"課税価格","ttl":"直系尊属から住宅取得等資金の贈与を受けた場合の贈与税の非課税","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":2,"ref":"措法70の2①、②","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"《居住無制限納税義務者》又は《非居住無制限納税義務者》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"贈与の年の《1月1日》において《18歳以上》","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"贈与の年の《合計所得金額が2000万円》（新築、取得、増改築等をした《住宅用家屋の床面積》が一定の《規模未満》である場合には、《1000万円》）《以下》","lv":1}],"t":"《令和6年1月1日から令和8年12月31日まで》の間にその《直系尊属》からの贈与により住宅\n（注）取得等資金の取得をした《特定受贈者》が、その贈与の年の《翌年3月15日まで》にその住宅取得等資金の全額を《住宅用家屋の新築、取得、増改築等》又はこれらの住宅用家屋の《新築、取得、増改築等とともに》する《その敷地の用に供されている土地等の取得》（家屋の《新築に先行》してする《土地等の取得》を含む。）のための《対価に充てた》場合（《特別の関係がある者》から《新築、取得、増改築等》をする場合を除く。）において、《同日までに》その住宅用家屋をその特定受贈者の居住の用に供したとき又は《同日後遅滞なく》居住の用に供することが確実であると見込まれるときは、その贈与により取得をした住宅取得等資金のうち一定の《住宅資金非課税限度額》（《既に》この規定の適用を受けた部分の価額を《控除した残額》）までの金額については、《贈与税の課税価格に算入しない》。\n（注）　特定受贈者は、次に掲げる要件を満たすものをいう。"},{"n":"〔2〕","h":"申告要件","st":2,"ref":"措法70の2⑭、⑮","items":[],"t":"この規定は、《税務署長がやむを得ない事情があると認める場合を除き》、贈与税の《期限内申告書》に一定の事項を記載し、かつ、一定の書類を添付した場合に限り、適用する。"},{"n":"〔3〕","h":"修正申告","st":2,"ref":"措法70の2④","items":[],"t":"〔1〕の規定の適用を受けた《特定受贈者》が、住宅取得等資金の取得をした年の《翌年3月15日後遅滞なく》その特定受贈者の居住の用に供することが《確実であると見込まれる》ことにより〔1〕の規定の適用を受けた場合において、《住宅用家屋をその年12月31日までにその特定受贈者の居住の用に供していなかったとき》は、〔1〕の規定は適用しない。この場合において、その特定受贈者は、《その年12月31日から2月以内》に、〔1〕の規定の《適用を受けた年分の贈与税》についての《修正申告書》を提出し、かつ、その期限内にその申告書の提出により《納付すべき税額》を《納付》しなければならない。"},{"n":"〔4〕","h":"住宅資金非課税限度額","st":1,"ref":"措法70の2②","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"その住宅用家屋が《エネルギーの使用の合理化に資する》住宅用家屋（《新築又は建築後使用されたことのない住宅用家屋》については、《エネルギーの使用の合理化に著しく資する》ものに限る。）、《地震に対する安全性に係る基準に適合する》住宅用家屋又は《高齢者等が自立した日常生活を営むのに必要な構造及び設備の基準に適合する》住宅用家屋として一定のものである場合…《1000万円》","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"その住宅用家屋が《⑴に規定する住宅用家屋以外》のものである場合…《500万円》","lv":1}],"t":"次の区分に応じ、《特定受贈者ごと》にそれぞれ次に定める金額をいう。"},{"n":"〔5〕","h":"災害による居住要件の免除","st":1,"ref":"措法70の2①、⑧、⑨","items":[{"mk":"⑴","h":"申告期限前に災害があった場合","ref":"","st":0,"t":"《令和8年12月31日まで》の間にその《直系尊属から》の贈与により金銭の取得をした《個人》が、その金銭を《住宅用家屋の新築、取得、増改築等の対価》に充ててその《贈与の年の翌年3月15日まで》にその《新築、取得、増改築等》をした場合には、その《新築、取得、増改築等》をした《住宅用家屋が災害》（《震災》、《風水害》、《火災その他一定のもの》をいう。以下同じ。）によって《滅失》（《通常の修繕》によっては《原状回復が困難》な《損壊を含む》。以下⑵において同じ。）をしたことにより《同日まで》にその《居住の用に供することができなくなったとき》であっても、その《個人》は、《〔1〕の規定の適用を受けることができる》。","lv":1},{"mk":"⑵","h":"申告期限後に災害があった場合","ref":"","st":0,"t":"《住宅取得等資金》について《〔1〕の規定》の適用を受けた《特定受贈者》が、《住宅取得等資金の取得》をした《年の翌年3月15日後遅滞なく》その《特定受贈者の居住の用に供すること》が《確実であると見込まれること》により《〔1〕の規定の適用を受けた場合》において、《住宅用家屋が災害により滅失をしたこと》によって《居住の用に供することができなくなったとき》は、《〔3〕の規定は適用しない》。","lv":1}],"t":""},{"n":"〔6〕","h":"災害による居住期限等の延長","st":1,"ref":"措法70の2①、⑩、⑪","items":[{"mk":"⑴","h":"申告期限前に災害があった場合","ref":"","st":0,"t":"《令和8年12月31日まで》の間にその《直系尊属から》の贈与により金銭の取得をした《個人》が、その金銭を《住宅用家屋の新築、取得、増改築等の対価》に充ててその《新築、取得、増改築等をする場合》には、《災害に基因するやむを得ない事情》によりその《贈与の年の翌年3月15日まで》に《その新築、取得、増改築等ができなかったときであっても》、その《個人》は、《〔1〕の規定の適用を受けることができる》。この場合、〔1〕〔3〕において、翌年3月15日とあるのは、《翌々年3月15日》とする。","lv":1},{"mk":"⑵","h":"申告期限後に災害があった場合","ref":"","st":0,"t":"《住宅取得等資金》について《〔1〕の規定》の適用を受けた《特定受贈者》が、《住宅取得等資金の取得》をした《年の翌年3月15日後遅滞なく》その《特定受贈者の居住の用に供すること》が《確実であると見込まれること》により《〔1〕の規定の適用を受けた場合》において、《災害に基因するやむを得ない事情》により住宅用家屋をその《年12月31日まで》にその《特定受贈者の居住の用に供することができなかった》ときにおける《〔3〕の規定の適用》については、その《年12月31日》とあるのは、贈与の年の《翌々年12月31日》とする。","lv":1}],"t":""}]},{"no":"3-5","chap":"課税価格","ttl":"直系尊属から教育資金の一括贈与を受けた場合の贈与税の非課税","sub":"","secs":[{"n":"〔1〕","h":"適用要件","st":2,"ref":"措法70の2の2①","items":[{"mk":"⑴","h":"","ref":"","st":0,"t":"その《直系尊属》と信託会社との間の《教育資金管理契約》に基づき《信託受益権を取得》した場合","lv":1},{"mk":"⑵","h":"","ref":"","st":0,"t":"その《直系尊属》からの贈与により取得した金銭を《教育資金管理契約》に基づき銀行等において《預金又は貯金として預入》をした場合","lv":1},{"mk":"⑶","h":"","ref":"","st":0,"t":"《教育資金管理契約》に基づきその《直系尊属》からの贈与により取得した金銭等で金融商品取引業者において《有価証券を購入》した場合","lv":1}],"t":"《令和8年3月31日まで》の間に、個人（《教育資金管理契約》を締結する日において《30歳未満》の者に限る。）が、次のいずれかに該当する場合には、その《信託受益権》、《金銭》又は《金銭等》の価額のうち《1500万円》までの金額（《既にこの規定の適用を受けた部分》の価額を控除した残額）に相当する部分については、《贈与税の課税価格》に算入しない。\nただし、その個人の《信託受益権》、《金銭》又は《金銭等》を取得した日の属する年の《前年分》の《合計所得金額》が《1≤000万円》を《超える》場合は、《この限りでない》。"},{"n":"〔2〕","h":"書類の提出","st":2,"ref":"措法70の2の2③、⑨","items":[{"mk":"⑴","h":"教育資金非課税申告書の提出","ref":"","st":0,"t":"〔1〕の規定は、受贈者が《教育資金非課税申告書》を取扱金融機関の《営業所等を経由》し、《信託がされる日》、《預金若しくは貯金の預入をする日》又は《有価証券を購入する日》までに、《納税地の所轄税務署長》に提出した場合に限り、適用する。","lv":1},{"mk":"⑵","h":"領収書等の提出","ref":"","st":0,"t":"〔1〕の規定の適用を受ける受贈者は、次に掲げる場合の区分に応じ《次に定める日》までに、教育資金の支払に充てた金銭に係る《領収書等》を《取扱金融機関に提出》しなければならない。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"教育資金の《支払に充てた金額》を《払い出す方法》により《専ら》払出しを受ける場合…《支払年月日から1年》を経過する日","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《①以外》の場合…支払年月日の属する年の翌年《3月15日》","lv":2}]}],"t":""},{"n":"〔3〕","h":"適用除外","st":1,"ref":"措法70の2の2⑥","items":[],"t":"《教育資金非課税申告書》は、受贈者が《既に教育資金非課税申告書を提出している場合》（〔6〕⑴⑤に該当したことにより《終了》している場合を除く。）には《提出することができない》ものとし、《教育資金非課税申告書》に〔1〕の規定の適用を受けるものとして記載された金額が《1≤500万円を超えるもの》である場合その他一定の場合には、取扱金融機関は、これらの申告書を《受理》することができない。"},{"n":"〔4〕","h":"追加適用","st":1,"ref":"措法70の2の2④","items":[],"t":"受贈者（《30歳未満》の者に限る。）が《既に教育資金非課税申告書を提出している》場合（その教育資金非課税申告書に記載された金額が《1≤500万円に満たない》場合に限る。）において、その教育資金非課税申告書に係る教育資金管理契約に基づき、その受贈者が《新たに信託受益権を取得》、《預金又は貯金として預入》、《有価証券を購入》したときは、その受贈者は、《追加教育資金非課税申告書》を〔2〕⑴に係る《申告書を提出した取扱金融機関の営業所等》を経由し、《新たに信託がされる日》等までに、《納税地の所轄税務署長》に提出した場合に限り、〔1〕の規定の適用を受けることができる。\nただし、その受贈者の《信託受益権》、《金銭》又は《金銭等》を取得した日の属する年の《前年分》の《合計所得金額》が《1000万円》を《超える》場合は、《この限りでない》。"},{"n":"〔5〕","h":"贈与者が死亡した場合","st":2,"ref":"措法70の2の2⑫、⑬","items":[{"mk":"⑴","h":"内　　容","ref":"","st":0,"t":"《贈与者》（《教育資金管理契約》に基づくその《受贈者の直系尊属》をいう。）が《教育資金管理契約》に基づき《信託をした日》、《預金若しくは貯金》をするための《贈与をした日》又は《有価証券の購入》をするための《贈与をした日》からこれらの《教育資金管理契約の終了の日までの間》に《死亡した場合》には、次に定めるところによる。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《受贈者》については、《贈与者が死亡した日》における《非課税拠出額》から《教育資金支出額》（《学校等以外》の者に《支払われる金銭》については、《500万円》を限度とする。以下同じ。）を《控除した残額》（以下「《管理残額》」という。）を《贈与者から相続又は遺贈》により《取得したものとみなす》。","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《贈与者から相続又は遺贈》により《管理残額以外の財産を取得しなかった》受贈者については、《生前贈与加算の規定》は《適用しない》。","lv":2}]},{"mk":"⑵","h":"適用除外","ref":"","st":0,"t":"⑴の規定は、《贈与者の死亡の日》において《受贈者が23歳未満》である場合、《学校等に在学している》場合又は《教育訓練を受けている》場合には《適用しない》。\nただし、その贈与者から《相続又は遺贈》（その贈与者からの《相続時精算課税に係る贈与》を含む。）《により財産を取得した全ての者》に係る《⑴①の規定の適用がないもの》とした場合における《相続税の課税価格の合計額》が《5億円を超えるとき》は、《この限りでない》。","lv":1}],"t":""},{"n":"〔6〕","h":"契約終了時","st":2,"ref":"措法70の2の2⑯、⑰、⑱","items":[{"mk":"⑴","h":"契約の終了事由及び終了日","ref":"","st":0,"t":"《教育資金管理契約》は、次に掲げる事由の区分に応じ《それぞれに定める日》の《いずれか早い日に終了》するものとする。","lv":1,"items":[{"mk":"①","h":"","ref":"","st":0,"t":"《受贈者が30歳に達したこと》（その《受贈者が30歳に達した日》において《学校等に在学している場合》又は《教育訓練を受けている場合》を《除く》。）…《受贈者が30歳に達した日》","lv":2},{"mk":"②","h":"","ref":"","st":0,"t":"《受贈者》（《30歳以上の者に限る》。《③》において同じ。）が《その年中のいずれかの日》において《学校等に在学した日》又は《教育訓練を受けた日》があることを《取扱金融機関の営業所等》に《届け出なかったこと》…その《年の12月31日》","lv":2},{"mk":"③","h":"","ref":""
